/* === js/apps/calculator.js === */
/* Hiko OS · Калькулятор */
(function () {
  'use strict';
  const { el } = OS;

  const ICON = OS.appTile(
    { from: '#4A4E5E', to: '#20222C' },
    `<g stroke="#fff" stroke-width="6.5" stroke-linecap="round">
      <path d="M -17 -25 L -17 -9 M -25 -17 L -9 -17"/>
      <path d="M 9 -17 L 25 -17"/>
      <path d="M -24 10 L -10 24 M -10 10 L -24 24"/>
      <path d="M 9 17 L 25 17"/>
    </g>
    <circle cx="17" cy="8" r="3" fill="#fff"/><circle cx="17" cy="26" r="3" fill="#fff"/>`
  );

  OS.injectStyle('app-calculator', `
    .calc-root { flex:1; min-height:0; display:flex; flex-direction:column; background:#171922; outline:none; }
    .calc-display { flex:1; min-height:64px; display:flex; align-items:flex-end; justify-content:flex-end;
      padding: 8px 20px 4px; color:#f2f3fa; font-weight:300; overflow:hidden; white-space:nowrap; user-select:text; }
    .calc-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; padding:12px; }
    .calc-btn { aspect-ratio:1; border:none; border-radius:16px; font-size:21px; font-family:var(--font);
      color:#f2f3fa; background:#2c2f3d; cursor:default; transition: filter .08s, transform .08s; font-weight:600; }
    .calc-btn:active { filter:brightness(1.35); transform:scale(.95); }
    .calc-btn.fn { background:#454a5c; color:#d9dce8; }
    .calc-btn.op { background:var(--accent); color:var(--on-accent); font-size:25px; }
    .calc-btn.op.hot { background:#f2f3fa; color:#171922; }
    .calc-btn.zero { aspect-ratio:auto; grid-column:span 2; text-align:left; padding-left:26px; }
  `);

  const fmt = (n) => {
    if (!isFinite(n) || isNaN(n)) return 'Ошибка';
    let s = String(+parseFloat(n.toPrecision(12)));
    if (Math.abs(n) >= 1e12 || (Math.abs(n) < 1e-9 && n !== 0)) return n.toExponential(6).replace('.', ',').replace('e', 'e');
    const [int, frac] = s.split('.');
    const gi = int.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return frac ? gi + ',' + frac : gi;
  };

  OS.registerApp({
    id: 'calculator',
    name: 'Калькулятор',
    icon: ICON,
    width: 300, height: 470,
    minWidth: 260, minHeight: 400,
    singleton: true,
    render(win) {
      // состояние
      let acc = null;        // накопленное
      let op = null;         // текущая операция
      let entry = '0';       // вводимое число (строка, '.' как разделитель)
      let fresh = true;      // следующий ввод начинает новое число
      let lastOp = null, lastOperand = null; // для повтора "="

      const root = el('div', 'calc-root');
      root.tabIndex = 0;
      const display = el('div', 'calc-display', '0');
      const grid = el('div', 'calc-grid');
      root.appendChild(display);
      root.appendChild(grid);
      win.content.appendChild(root);

      const BTNS = [
        { t: 'AC', cls: 'fn', k: 'clear' }, { t: '±', cls: 'fn', k: 'neg' }, { t: '%', cls: 'fn', k: 'pct' }, { t: '÷', cls: 'op', k: '/' },
        { t: '7' }, { t: '8' }, { t: '9' }, { t: '×', cls: 'op', k: '*' },
        { t: '4' }, { t: '5' }, { t: '6' }, { t: '−', cls: 'op', k: '-' },
        { t: '1' }, { t: '2' }, { t: '3' }, { t: '+', cls: 'op', k: '+' },
        { t: '0', cls: 'zero' }, { t: ',', k: 'dot' }, { t: '=', cls: 'op', k: '=' },
      ];
      const opBtns = {};
      BTNS.forEach(b => {
        const btn = el('button', 'calc-btn' + (b.cls ? ' ' + b.cls : ''), b.t);
        const key = b.k || b.t;
        if (['+', '-', '*', '/'].includes(key)) opBtns[key] = btn;
        btn.addEventListener('click', () => { press(key); root.focus(); });
        grid.appendChild(btn);
      });

      function currentValue() { return parseFloat(entry.replace(',', '.')) || 0; }

      function updateDisplay(text) {
        const t = text !== undefined ? text : entry.replace('.', ',');
        display.textContent = t;
        // динамический размер шрифта
        const len = t.length;
        display.style.fontSize = Math.max(26, Math.min(64, Math.floor(64 - Math.max(0, len - 7) * 4.4))) + 'px';
        const acBtn = grid.querySelector('.calc-btn.fn');
        acBtn.textContent = (entry !== '0' || acc !== null) ? 'C' : 'AC';
        Object.entries(opBtns).forEach(([k, b]) => b.classList.toggle('hot', op === k && fresh));
      }

      function apply(a, b, o) {
        switch (o) {
          case '+': return a + b;
          case '-': return a - b;
          case '*': return a * b;
          case '/': return b === 0 ? NaN : a / b;
        }
        return b;
      }

      function press(k) {
        if (/^\d$/.test(k)) {
          if (fresh) { entry = k; fresh = false; }
          else if (entry.replace('-', '').replace('.', '').length < 12) entry = entry === '0' ? k : entry + k;
          updateDisplay();
        } else if (k === 'dot') {
          if (fresh) { entry = '0.'; fresh = false; }
          else if (!entry.includes('.')) entry += '.';
          updateDisplay(entry.replace('.', ','));
        } else if (k === 'clear') {
          if (entry !== '0' && !fresh) { entry = '0'; }
          else { acc = null; op = null; entry = '0'; lastOp = null; lastOperand = null; }
          fresh = true;
          updateDisplay(fmt(currentValue()));
        } else if (k === 'neg') {
          entry = entry.startsWith('-') ? entry.slice(1) : (entry === '0' ? entry : '-' + entry);
          updateDisplay(fmt(currentValue()));
          fresh = false;
        } else if (k === 'pct') {
          const v = currentValue() / 100;
          entry = String(v);
          fresh = true;
          updateDisplay(fmt(v));
        } else if (['+', '-', '*', '/'].includes(k)) {
          if (op && !fresh) {
            const r = apply(acc, currentValue(), op);
            acc = r;
            entry = String(r);
            updateDisplay(fmt(r));
          } else if (acc === null) {
            acc = currentValue();
          }
          op = k;
          fresh = true;
          updateDisplay(fmt(acc));
        } else if (k === '=') {
          let r;
          if (op) {
            const operand = fresh ? acc : currentValue();
            r = apply(acc, operand, op);
            lastOp = op; lastOperand = operand;
          } else if (lastOp !== null) {
            r = apply(currentValue(), lastOperand, lastOp);
          } else {
            r = currentValue();
          }
          acc = null; op = null;
          entry = String(r);
          fresh = true;
          updateDisplay(fmt(r));
        } else if (k === 'back') {
          if (!fresh && entry.length > 1) entry = entry.slice(0, -1);
          else if (!fresh) entry = '0';
          updateDisplay();
        }
      }

      root.addEventListener('keydown', (e) => {
        e.stopPropagation();
        const map = { 'Enter': '=', '=': '=', 'Escape': 'clear', 'Backspace': 'back', ',': 'dot', '.': 'dot', '%': 'pct' };
        if (/^\d$/.test(e.key)) { press(e.key); e.preventDefault(); }
        else if (['+', '-', '*', '/'].includes(e.key)) { press(e.key); e.preventDefault(); }
        else if (map[e.key]) { press(map[e.key]); e.preventDefault(); }
      });
      win.on('focus', () => setTimeout(() => root.focus(), 0));
      setTimeout(() => root.focus(), 50);
      updateDisplay('0');
    },
  });
})();

</script>

          <div class="br-search">${OS.icons.search}<input placeholder="Поиск в Google" spellcheck="false"></div>
          <div class="br-tiles">
            ${BOOKMARKS.map((b, i) => `
              <div class="br-tile" data-i="${i}">
                <div class="br-fav" style="background:${b.bg}">${b.label}</div>
                <span>${esc(b.name)}</span>
              </div>`).join('')}
          </div>`;
        stage.appendChild(home);

        const tickC = () => {
          const cEl = home.querySelector('.br-clock');
          if (!cEl || !cEl.isConnected) return;
          const d = new Date();
          cEl.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
          home.querySelector('.br-date').textContent = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
          setTimeout(tickC, 5000);
        };
        tickC();

        const si = home.querySelector('.br-search input');
        si.addEventListener('keydown', (e) => {
          e.stopPropagation();
          if (e.key === 'Enter' && si.value.trim()) go(si.value.trim());
        });
        home.querySelectorAll('.br-tile').forEach(t => t.addEventListener('click', () => {
          navigate(BOOKMARKS[+t.dataset.i].url);
        }));
      }

      function renderAbout() {
        const a = el('div');
        a.style.cssText = 'position:absolute;inset:0;overflow-y:auto;background:var(--content-bg)';
        a.innerHTML = `<div class="br-about">
          <h1><span class="lg">${OS.icons.logo}</span> Hiko OS ${esc(OS.VERSION)} «${esc(OS.CODENAME)}»</h1>
          <p><span class="tag">свой визуал</span><span class="tag">привычная логика</span><span class="tag">0 зависимостей</span></p>
          <p>Персональная операционная система в браузере. Оконный менеджер со снэпом,
          виртуальная файловая система, Spotlight, Mission Control, док с магнификацией —
          всё написано на чистом JavaScript без единого фреймворка.</p>
          <p>Приложений установлено: ${OS.allApps().length}. Занято хранилища: ${OS.fmtBytes(OS.vfs.usage())}.</p>
          <p>Исходники живут в папках <code>js/core</code> и <code>js/apps</code>.
          Своё приложение — это один файл на ~100 строк, см. <code>docs/APP_API.md</code>.</p>
        </div>`;
        stage.appendChild(a);
      }

      function go(input) {
        let target;
        if (input === 'about:hiko') target = input;
        else if (/^https?:\/\//i.test(input)) target = input;
        else if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(input)) target = 'https://' + input;
        else target = 'https://www.google.com/search?q=' + encodeURIComponent(input);
        navigate(target);
      }

      urlIn.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter' && urlIn.value.trim()) go(urlIn.value.trim());
      });
      root.querySelector('.br-back').addEventListener('click', () => { if (pos > 0) { pos--; show(current()); updateNav(); } });
      root.querySelector('.br-fwd').addEventListener('click', () => { if (pos < stack.length - 1) { pos++; show(current()); updateNav(); } });
      root.querySelector('.br-reload').addEventListener('click', () => show(current()));
      root.querySelector('.br-home-btn').addEventListener('click', () => navigate('home'));

      win.on('close', () => clearTimeout(loadTimer));
      show('home');
      updateNav();
      // запуск с адресом: OS.launch('browser', { url }) или { query } — поиск в Google
      const a = (ctx && ctx.args) || {};
      if (a.url) navigate(String(a.url));
      else if (a.query) navigate('https://www.google.com/search?q=' + encodeURIComponent(String(a.query)));
    },
  });
})();

  );

  OS.injectStyle('app-photos', `

  `);

  const IMG_EXT = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'ico'];
  const isImage = (name) => IMG_EXT.includes((name.split('.').pop() || '').toLowerCase());

  function srcOf(item) {
    try {
      const c = OS.vfs.read(item.path);
      if (c.startsWith('data:')) return c;
      if (item.name.toLowerCase().endsWith('.svg')) return 'data:image/svg+xml,' + encodeURIComponent(c);
    } catch (e) { /* — */ }
    return null;
  }

  function collect() {
    const out = [];
    const walk = (dir) => {
      let items;
      try { items = OS.vfs.list(dir); } catch (e) { return; }
      items.forEach(i => {
        if (i.type === 'dir') walk(i.path);
        else if (isImage(i.name)) out.push(i);
      });
    };
    walk('/Pictures');
    walk('/Desktop');
    walk('/Downloads');
    return out;
  }

  OS.registerApp({
    id: 'photos',
    name: 'Фото',
    icon: ICON,
    width: 860, height: 580,
    minWidth: 480, minHeight: 360,
    render(win, ctx) {
      let mode = 'grid';       // grid | view
      let items = [];          // файлы-картинки
      let wpMode = false;      // просматриваем обои

      const root = el('div', 'ph-root');
      win.content.appendChild(root);

      function renderGrid() {
        mode = 'grid';
        zoom = 1;
        win.setTitle('Фото');
        items = collect();
        const wps = OS.wallpapers.presets;
        root.innerHTML = `
          <div class="ui-toolbar">

            }).join('')}

            ${wps.map((w, i) => `<div class="ph-thumb" data-wp="${i}"><img src="${w.uri}" alt=""><div class="ph-name">${esc(w.name)}</div></div>`).join('')}
          </div>`;
        if (!items.length) {
          const grid = root.querySelector('.ph-grid');
          const empty = el('div', 'ui-empty', `${OS.icons.fileImage}<div>Нет изображений</div><button class="ui-btn primary">Нарисовать в Paint</button>`);
          empty.style.gridColumn = '1/-1';
          empty.style.minHeight = '160px';
          empty.querySelector('button').addEventListener('click', () => OS.launch('paint'));
          grid.insertBefore(empty, grid.firstChild);
        }
        root.querySelector('.ph-paint').addEventListener('click', () => OS.launch('paint'));
        root.querySelectorAll('[data-i]').forEach(t => t.addEventListener('click', () => {
          wpMode = false; idx = +t.dataset.i; renderView();
        }));
        root.querySelectorAll('[data-wp]').forEach(t => t.addEventListener('click', () => {
          wpMode = true; idx = +t.dataset.wp; renderView();
        }));
      }

      function current() {
        return wpMode ? OS.wallpapers.presets[idx] : items[idx];
      }

      function renderView() {
        mode = 'view';
        zoom = 1;
        const list = wpMode ? OS.wallpapers.presets : items;
        if (!list.length) { renderGrid(); return; }
        idx = (idx + list.length) % list.length;
        const it = list[idx];
        const src = wpMode ? it.uri : srcOf(it);
        win.setTitle(wpMode ? `Обои — ${it.name}` : it.name);
        root.innerHTML = `
          <div class="ph-view">
            <div class="ui-toolbar" style="border-bottom-color:rgba(255,255,255,.08)">
              <button class="ui-btn ph-back" style="background:rgba(255,255,255,.1);color:#fff;box-shadow:none">${OS.icons.chevronL} Назад</button>
              <span style="flex:1"></span>
              <button class="ui-btn ph-zo" style="background:rgba(255,255,255,.1);color:#fff;box-shadow:none">−</button>
              <button class="ui-btn ph-z1" style="background:rgba(255,255,255,.1);color:#fff;box-shadow:none">100%</button>
              <button class="ui-btn ph-zi" style="background:rgba(255,255,255,.1);color:#fff;box-shadow:none">+</button>
            </div>
            <div class="ph-stage">
              ${src ? `<img src="${src}" alt="">` : `<div style="color:#888">Не удалось открыть</div>`}
              <button class="ph-nav prev">${OS.icons.chevronL}</button>
              <button class="ph-nav next">${OS.icons.chevronR}</button>
            </div>
            <div class="ph-caption">
              <span>${esc(it.name)}</span>
              ${!wpMode ? `<span style="color:#8e8e96">${OS.fmtBytes(it.size)}</span>` : ''}
              <span class="sp"></span>
              ${wpMode ? `<button class="ui-btn ph-setwp">Сделать обоями</button>`
                       : `<button class="ui-btn ph-del">Удалить</button>`}
              <span style="color:#8e8e96">${idx + 1} из ${list.length}</span>
            </div>
          </div>`;
        const img = root.querySelector('.ph-stage img');
        const applyZoom = () => { if (img) img.style.transform = `scale(${zoom})`; };
        root.querySelector('.ph-back').addEventListener('click', renderGrid);
        root.querySelector('.prev').addEventListener('click', () => { idx--; renderView(); });
        root.querySelector('.next').addEventListener('click', () => { idx++; renderView(); });
        root.querySelector('.ph-zi').addEventListener('click', () => { zoom = Math.min(6, zoom * 1.3); applyZoom(); });
        root.querySelector('.ph-zo').addEventListener('click', () => { zoom = Math.max(0.2, zoom / 1.3); applyZoom(); });
        root.querySelector('.ph-z1').addEventListener('click', () => { zoom = 1; applyZoom(); });
        root.querySelector('.ph-stage').addEventListener('wheel', (e) => {
          e.preventDefault();
          zoom = Math.max(0.2, Math.min(6, zoom * (e.deltaY < 0 ? 1.12 : 0.89)));
          applyZoom();
        }, { passive: false });
        const setwp = root.querySelector('.ph-setwp');
        if (setwp) setwp.addEventListener('click', () => {
          OS.settings.set('wallpaper', it.id);
          OS.notify({ title: 'Фото', body: `Обои «${it.name}» установлены`, appId: 'photos' });
        });
        const del = root.querySelector('.ph-del');
        if (del) del.addEventListener('click', async () => {
          const ok = await OS.dialog.confirm('Удалить изображение?', `«${it.name}» будет перемещено в корзину.`, { okLabel: 'Удалить', danger: true });
          if (ok) { OS.vfs.rm(it.path, { toTrash: true }); renderGrid(); }
        });
      }

      const onKey = (e) => {
        if (mode !== 'view' || OS.wm.focused !== win) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); idx--; renderView(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); idx++; renderView(); }
        else if (e.key === 'Escape') { e.preventDefault(); renderGrid(); }
      };
      document.addEventListener('keydown', onKey);

      const unVfs = OS.on('vfs:change', OS.debounce(() => { if (mode === 'grid') renderGrid(); }, 200));
      win.on('close', () => {
        document.removeEventListener('keydown', onKey);
        unVfs();
      });

      // старт
      if (ctx.args && ctx.args.path) {
        items = collect();
        const i = items.findIndex(x => x.path === ctx.args.path);
        if (i >= 0) { wpMode = false; idx = i; renderView(); return; }
      }
      renderGrid();
    },
  });
})();

  };
  const PALETTE = ['#000000', '#8e8e93', '#ffffff', '#ff453a', '#ff9f0a', '#ffd60a', '#30d158', '#64d2ff', '#0a84ff', '#5e5ce6', '#bf5af2', '#ff375f', '#a2845e', '#1c3a5e', '#0e6b45', '#7a1e56'];
  const CW = 1200, CH = 700;

  OS.registerApp({
    id: 'paint',
    name: 'Paint',
    icon: ICON,
    width: 900, height: 620,

    render(win, ctx0) {
      let tool = 'brush';

      function pushUndo() {

        if (undoStack.length > 30) undoStack.shift();
        redoStack = [];
      }
      function undo() {
        if (!undoStack.length) return;
        redoStack.push(cx.getImageData(0, 0, CW, CH));
        cx.putImageData(undoStack.pop(), 0, 0);
      }
      function redo() {
        if (!redoStack.length) return;
        undoStack.push(cx.getImageData(0, 0, CW, CH));
        cx.putImageData(redoStack.pop(), 0, 0);
      }
      root.querySelector('.pt-undo').addEventListener('click', undo);
      root.querySelector('.pt-redo').addEventListener('click', redo);

      root.querySelector('.pt-clear').addEventListener('click', async () => {
        const ok = await OS.dialog.confirm('Очистить холст?', 'Рисунок будет удалён.', { okLabel: 'Очистить', danger: true });
        if (!ok) return;
        pushUndo();
        cx.fillStyle = '#ffffff';
        cx.fillRect(0, 0, CW, CH);
        dirty = true;
      });

      async function save() {
        try {
          const data = canvas.toDataURL('image/png');
          const name = OS.vfs.uniqueName('/Pictures', 'Рисунок.png');
          OS.vfs.write('/Pictures/' + name, data);
          dirty = false;
          win.setTitle('Paint — ' + name);
          OS.notify({ title: 'Paint', body: `Сохранено в Изображения: ${name}`, appId: 'paint' });
        } catch (e) {
          OS.dialog.alert('Не удалось сохранить', e.message);
        }
      }
      root.querySelector('.pt-save').addEventListener('click', save);

      const pos = (e) => {
        const r = canvas.getBoundingClientRect();
        return [
          (e.clientX - r.left) * (CW / r.width),
          (e.clientY - r.top) * (CH / r.height),
        ];
      };

      function hexToRgba(hex) {
        const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16), 255];
      }

      function floodFill(x, y) {
        x = Math.floor(x); y = Math.floor(y);
        const img = cx.getImageData(0, 0, CW, CH);
        const d = img.data;
        const idx = (px, py) => (py * CW + px) * 4;
        const target = d.slice(idx(x, y), idx(x, y) + 4);
        const fill = hexToRgba(color);
        if (target[0] === fill[0] && target[1] === fill[1] && target[2] === fill[2]) return;
        const match = (i) => Math.abs(d[i] - target[0]) < 12 && Math.abs(d[i + 1] - target[1]) < 12 && Math.abs(d[i + 2] - target[2]) < 12;
        const stack = [[x, y]];
        let iter = 0;
        while (stack.length && iter++ < 3000000) {
          const [px, py] = stack.pop();
          if (px < 0 || py < 0 || px >= CW || py >= CH) continue;
          const i = idx(px, py);
          if (!match(i)) continue;
          d[i] = fill[0]; d[i + 1] = fill[1]; d[i + 2] = fill[2]; d[i + 3] = 255;
          stack.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
        }
        cx.putImageData(img, 0, 0);
      }

      function strokeSetup() {
        cx.globalAlpha = tool === 'marker' ? 0.35 : 1;
        cx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
        cx.fillStyle = cx.strokeStyle;
        cx.lineWidth = tool === 'marker' ? size * 2.2 : size;
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        canvas.setPointerCapture(e.pointerId);
        const [x, y] = pos(e);
        if (tool === 'picker') {
          const p = cx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
          color = '#' + [p[0], p[1], p[2]].map(v => v.toString(16).padStart(2, '0')).join('');
          refreshCur();
          return;
        }
        pushUndo();
        dirty = true;
        drawing = true;
        sx = x; sy = y;
        if (tool === 'fill') {
          floodFill(x, y);
          drawing = false;
          return;
        }
        snapshot = ['line', 'rect', 'ellipse'].includes(tool) ? cx.getImageData(0, 0, CW, CH) : null;
        strokeSetup();
        if (tool === 'brush' || tool === 'marker' || tool === 'eraser') {
          cx.beginPath();
          cx.moveTo(x, y);
          cx.lineTo(x + 0.01, y + 0.01);
          cx.stroke();
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        const [x, y] = pos(e);
        if (tool === 'brush' || tool === 'marker' || tool === 'eraser') {
          cx.lineTo(x, y);
          cx.stroke();
        } else if (snapshot) {
          cx.putImageData(snapshot, 0, 0);
          strokeSetup();
          cx.beginPath();
          if (tool === 'line') { cx.moveTo(sx, sy); cx.lineTo(x, y); }
          else if (tool === 'rect') cx.rect(Math.min(sx, x), Math.min(sy, y), Math.abs(x - sx), Math.abs(y - sy));
          else if (tool === 'ellipse') cx.ellipse((sx + x) / 2, (sy + y) / 2, Math.abs(x - sx) / 2, Math.abs(y - sy) / 2, 0, 0, Math.PI * 2);
          cx.stroke();
        }
      });

      const endStroke = () => {
        if (!drawing) return;
        drawing = false;
        snapshot = null;
        cx.globalAlpha = 1;
      };
      canvas.addEventListener('pointerup', endStroke);
      canvas.addEventListener('pointercancel', endStroke);

      const onKey = (e) => {
        if (OS.wm.focused !== win) return;
        if (e.ctrlKey && !e.shiftKey && e.code === 'KeyZ') { e.preventDefault(); undo(); }
        else if (e.ctrlKey && (e.code === 'KeyY' || (e.shiftKey && e.code === 'KeyZ'))) { e.preventDefault(); redo(); }
        else if (e.ctrlKey && e.code === 'KeyS') { e.preventDefault(); save(); }
      };
      document.addEventListener('keydown', onKey);
      win.on('close', () => document.removeEventListener('keydown', onKey));

      win.on('beforeclose', async () => {
        if (!dirty) return true;
        const ok = await OS.dialog.confirm('Есть несохранённый рисунок', 'Закрыть без сохранения?', { okLabel: 'Закрыть', danger: true });
        return ok;
      });

      // открыть существующее изображение
      if (ctx0.args && ctx0.args.path) {
        try {
          const data = OS.vfs.read(ctx0.args.path);
          if (data.startsWith('data:image')) {
            const img = new Image();
            img.onload = () => {
              const s = Math.min(CW / img.width, CH / img.height, 1);
              cx.drawImage(img, 0, 0, img.width * s, img.height * s);
            };
            img.src = data;
            win.setTitle('Paint — ' + OS.vfs.nameOf(ctx0.args.path));
          }
        } catch (e) { /* — */ }
      }
    },
  });
})();

</script>

/* === js/apps/minesweeper.js === */
/* Hiko OS · Сапёр — классический Minesweeper */
(function () {
  'use strict';
  const { el, esc } = OS;

  const ICON = OS.appTile(
    { from: '#8E8E93', to: '#48484A' },
    `<g>
      <g stroke="#fff" stroke-width="6" stroke-linecap="round">
        <path d="M 0 -32 L 0 -22"/><path d="M 0 22 L 0 32"/><path d="M -32 0 L -22 0"/><path d="M 22 0 L 32 0"/>
        <path d="M -23 -23 L -16 -16"/><path d="M 16 16 L 23 23"/><path d="M 23 -23 L 16 -16"/><path d="M -16 16 L -23 23"/>
      </g>
      <circle cx="0" cy="0" r="18" fill="#1d1d1f"/>
      <circle cx="-6" cy="-6" r="5" fill="rgba(255,255,255,.55)"/>
    </g>`
  );

  OS.injectStyle('app-minesweeper', `
    .ms-root { flex:1; min-height:0; display:flex; flex-direction:column; background:var(--content-bg); }
    .ms-top { display:flex; align-items:center; justify-content:center; gap:10px; padding:10px 14px 4px; }
    .ms-panel { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:8px 14px;
      padding:8px 14px; background:var(--ctl-bg); border-radius:10px; }
    .ms-lcd { font-family:var(--font-mono); font-size:22px; font-weight:700; color:#ff453a; background:#1a1a1c;
      padding:2px 10px; border-radius:7px; min-width:74px; text-align:center; letter-spacing:2px; }
    .ms-face { width:44px; height:44px; border:none; border-radius:10px; background:var(--ctl-bg-hover);
      font-size:24px; cursor:default; transition: transform .08s; }
    .ms-face:active { transform:scale(.92); }
    .ms-best { text-align:center; font-size:11.5px; color:var(--text-3); padding-bottom:4px; }
    .ms-board-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:4px 14px 14px; overflow:auto; }
    .ms-board { display:grid; gap:2px; background:var(--divider); padding:3px; border-radius:8px; user-select:none; }
    .ms-cell { width:26px; height:26px; display:flex; align-items:center; justify-content:center;
      font-family:var(--font-mono); font-size:14.5px; font-weight:800; border-radius:4px; cursor:default;
      background:linear-gradient(135deg, var(--ctl-bg-hover), var(--ctl-bg));
      box-shadow: inset 1px 1px 0 rgba(255,255,255,.22), inset -1px -1px 0 rgba(0,0,0,.18); }
    .ms-cell:hover { filter:brightness(1.12); }
    .ms-cell.open { background:var(--content-bg); box-shadow: inset 0 0 0 1px var(--divider); filter:none; }
    .ms-cell.boom { background:#ff453a !important; }
    .ms-c1{color:#0a84ff}.ms-c2{color:#30d158}.ms-c3{color:#ff453a}.ms-c4{color:#5e5ce6}
    .ms-c5{color:#a2845e}.ms-c6{color:#64d2ff}.ms-c7{color:var(--text)}.ms-c8{color:#8e8e93}
  `);

  const LEVELS = {
    beginner: { name: 'Новичок', w: 9, h: 9, mines: 10 },
    amateur: { name: 'Любитель', w: 16, h: 16, mines: 40 },
    pro: { name: 'Профи', w: 22, h: 16, mines: 80 },
  };

  OS.registerApp({
    id: 'minesweeper',
    name: 'Сапёр',
    icon: ICON,
    width: 420, height: 560,
    minWidth: 340, minHeight: 420,
    singleton: true,
    render(win) {
      let level = 'beginner';
      let grid, opened, flags, mines, started, over, timer, seconds, minesLeft;

      const root = el('div', 'ms-root');
      root.innerHTML = `
        <div class="ms-top"><div class="ui-seg">
          ${Object.entries(LEVELS).map(([k, v]) => `<button class="seg-btn ${k === level ? 'on' : ''}" data-lvl="${k}">${v.name}</button>`).join('')}
        </div></div>
        <div class="ms-panel">
          <div class="ms-lcd ms-mines">010</div>
          <button class="ms-face">🙂</button>
          <div class="ms-lcd ms-time">000</div>
        </div>
        <div class="ms-best"></div>
        <div class="ms-board-wrap"><div class="ms-board"></div></div>`;
      win.content.appendChild(root);

      const boardEl = root.querySelector('.ms-board');
      const faceEl = root.querySelector('.ms-face');
      const minesEl = root.querySelector('.ms-mines');
      const timeEl = root.querySelector('.ms-time');
      const bestEl = root.querySelector('.ms-best');

      root.querySelectorAll('[data-lvl]').forEach(b => b.addEventListener('click', () => {
        level = b.dataset.lvl;
        root.querySelectorAll('[data-lvl]').forEach(x => x.classList.toggle('on', x === b));
        resizeWin();
        reset();
      }));
      faceEl.addEventListener('click', reset);

      function resizeWin() {
        const L = LEVELS[level];
        const r = win.rect();
        const w = Math.max(340, L.w * 28 + 60);
        const h = Math.max(420, L.h * 28 + 220);
        win.setRect({ x: Math.max(8, Math.min(r.x, innerWidth - w - 8)), y: Math.max(38, Math.min(r.y, innerHeight - h - 8)), w, h }, true);
      }

      const lcd = (n) => String(Math.max(-99, Math.min(999, n))).padStart(3, '0');
      const bestKey = () => 'minesweeper.best.' + level;
      const showBest = () => {
        const b = OS.settings.get(bestKey());
        bestEl.textContent = b ? `Рекорд (${LEVELS[level].name.toLowerCase()}): ${b} сек` : 'Рекорда пока нет — вперёд!';
      };

      function reset() {
        const L = LEVELS[level];
        clearInterval(timer);
        timer = null;
        seconds = 0;
        started = false;
        over = false;
        minesLeft = L.mines;
        grid = [];
        opened = 0;
        flags = new Set();
        mines = new Set();
        faceEl.textContent = '🙂';
        minesEl.textContent = lcd(minesLeft);
        timeEl.textContent = '000';
        showBest();

        boardEl.style.gridTemplateColumns = `repeat(${L.w}, 26px)`;
        boardEl.innerHTML = '';
        for (let y = 0; y < L.h; y++) {
          grid.push([]);
          for (let x = 0; x < L.w; x++) {
            const c = el('div', 'ms-cell');
            c.dataset.x = x; c.dataset.y = y;
            grid[y].push({ el: c, mine: false, open: false, flag: 0, n: 0 });
            boardEl.appendChild(c);
          }
        }
      }

      function plantMines(sx, sy) {
        const L = LEVELS[level];
        const forbidden = new Set();
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) forbidden.add((sy + dy) * L.w + (sx + dx));
        let planted = 0;
        while (planted < L.mines) {
          const i = Math.floor(Math.random() * L.w * L.h);
          if (mines.has(i) || forbidden.has(i)) continue;
          mines.add(i);
          grid[Math.floor(i / L.w)][i % L.w].mine = true;
          planted++;
        }
        for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
          let n = 0;
          eachNb(x, y, (c) => { if (c.mine) n++; });
          grid[y][x].n = n;
        }
      }

      function eachNb(x, y, fn) {
        const L = LEVELS[level];
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && ny >= 0 && nx < L.w && ny < L.h) fn(grid[ny][nx], nx, ny);
        }
      }

      function startTimer() {
        timer = setInterval(() => {
          seconds++;
          timeEl.textContent = lcd(seconds);
        }, 1000);
      }

      function openCell(x, y) {
        const c = grid[y][x];
        if (c.open || c.flag === 1 || over) return;
        if (!started) { plantMines(x, y); started = true; startTimer(); }
        c.open = true;
        opened++;
        c.el.classList.add('open');
        if (c.mine) { lose(c); return; }
        if (c.n) {
          c.el.textContent = c.n;
          c.el.classList.add('ms-c' + c.n);
        } else {
          // flood fill без рекурсии
          const stack = [[x, y]];
          while (stack.length) {
            const [cx, cy] = stack.pop();
            eachNb(cx, cy, (nc, nx, ny) => {
              if (nc.open || nc.flag === 1 || nc.mine) return;
              nc.open = true;
              opened++;
              nc.el.classList.add('open');
              if (nc.n) { nc.el.textContent = nc.n; nc.el.classList.add('ms-c' + nc.n); }
              else stack.push([nx, ny]);
            });
          }
        }
        checkWin();
      }

      function chord(x, y) {
        const c = grid[y][x];
        if (!c.open || !c.n || over) return;
        let f = 0;
        eachNb(x, y, (nc) => { if (nc.flag === 1) f++; });
        if (f !== c.n) return;
        eachNb(x, y, (nc, nx, ny) => { if (!nc.open && nc.flag !== 1) openCell(nx, ny); });
      }

      function toggleFlag(x, y) {
        const c = grid[y][x];
        if (c.open || over) return;
        c.flag = (c.flag + 1) % 3;
        c.el.textContent = c.flag === 1 ? '🚩' : c.flag === 2 ? '?' : '';
        minesLeft += c.flag === 1 ? -1 : c.flag === 2 ? 1 : 0;
        minesEl.textContent = lcd(minesLeft);
      }

      function lose(boomCell) {
        over = true;
        clearInterval(timer);
        faceEl.textContent = '💀';
        const L = LEVELS[level];
        for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
          const c = grid[y][x];
          if (c.mine) { c.el.classList.add('open'); c.el.textContent = '💣'; }
        }
        boomCell.el.classList.add('boom');
        OS.beep(140, .3);
      }

      function checkWin() {
        const L = LEVELS[level];
        if (opened !== L.w * L.h - L.mines || over) return;
        over = true;
        clearInterval(timer);
        faceEl.textContent = '😎';
        const best = OS.settings.get(bestKey());
        const isRecord = !best || seconds < best;
        if (isRecord) OS.settings.set(bestKey(), seconds);
        showBest();
        OS.beep(880, .18);
        OS.notify({ title: 'Сапёр', body: `Победа за ${seconds} сек!${isRecord ? ' 🏆 Новый рекорд!' : ''}`, appId: 'minesweeper' });
      }

      boardEl.addEventListener('pointerdown', (e) => {
        const cell = e.target.closest('.ms-cell');
        if (!cell || over) return;
        if (e.button === 0) faceEl.textContent = '😮';
      });
      window.addEventListener('pointerup', restoreFace);
      function restoreFace() { if (!over) faceEl.textContent = '🙂'; }

      boardEl.addEventListener('click', (e) => {
        const cell = e.target.closest('.ms-cell');
        if (!cell) return;
        const x = +cell.dataset.x, y = +cell.dataset.y;
        if (grid[y][x].open) chord(x, y);
        else openCell(x, y);
      });
      boardEl.addEventListener('dblclick', (e) => {
        const cell = e.target.closest('.ms-cell');
        if (!cell) return;
        chord(+cell.dataset.x, +cell.dataset.y);
      });
      boardEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const cell = e.target.closest('.ms-cell');
        if (!cell) return;
        toggleFlag(+cell.dataset.x, +cell.dataset.y);
      });

      win.on('close', () => {
        clearInterval(timer);
        window.removeEventListener('pointerup', restoreFace);
      });

      reset();
    },
  });
})();

  const ICON = OS.appTile(

    `<g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round">
      <path d="M -28 22 L 6 22 C 14 22 14 6 6 6 L -6 6 C -14 6 -14 -10 -6 -10 L 28 -10"/>

    .sn-stage canvas { max-width:100%; max-height:100%; border-radius:12px;

      justify-content:center; gap:10px; text-align:center; pointer-events:none; }
    .sn-overlay .big { font-size:26px; font-weight:800; text-shadow:0 2px 12px rgba(0,0,0,.4); color:#fff; }
    .sn-overlay .small { font-size:13px; color:rgba(255,255,255,.85); text-shadow:0 1px 6px rgba(0,0,0,.4); }
  `);

  const COLS = 22, ROWS = 15, CELL = 26;

  OS.registerApp({
    id: 'snake',
    name: 'Змейка',
    icon: ICON,
    width: 640, height: 520,
    minWidth: 480, minHeight: 400,
    singleton: true,
    render(win) {
      let snake, dir, nextDir, food, score, speed, timer = null, state = 'idle'; // idle|run|pause|over
      let best = OS.settings.get('snake.best', 0);

      const root = el('div', 'sn-root');
      root.tabIndex = 0;
      root.innerHTML = `
        <div class="sn-hud">
          <span>Счёт <b class="sn-score">0</b></span>
          <span>Рекорд <b class="sn-best">${best}</b></span>
          <span class="dim sn-speed"></span>
          <span style="flex:1"></span>
          <span class="dim">стрелки / WASD · пробел — пауза</span>
        </div>
        <div class="sn-stage">
          <canvas width="${COLS * CELL}" height="${ROWS * CELL}"></canvas>
          <div class="sn-overlay"></div>
        </div>`;
      win.content.appendChild(root);

      const canvas = root.querySelector('canvas');
      const cx = canvas.getContext('2d');
      const scoreEl = root.querySelector('.sn-score');
      const bestEl = root.querySelector('.sn-best');
      const speedEl = root.querySelector('.sn-speed');
      const overlay = root.querySelector('.sn-overlay');

      const accent = () => getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#23D1A8';

      function reset() {
        snake = [{ x: 6, y: 7 }, { x: 5, y: 7 }, { x: 4, y: 7 }];
        dir = { x: 1, y: 0 };
        nextDir = dir;
        score = 0;
        speed = 150;
        placeFood();
        scoreEl.textContent = '0';
        speedEl.textContent = 'скорость 1';
      }

      function placeFood() {
        do {
          food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
        } while (snake.some(s => s.x === food.x && s.y === food.y));
      }

      function setState(st, msgBig, msgSmall) {
        state = st;
        overlay.innerHTML = msgBig ? `<div class="big">${msgBig}</div><div class="small">${msgSmall || ''}</div>` : '';
      }

      function start() {
        reset();
        setState('run');
        clearInterval(timer);
        timer = setInterval(tick, speed);
      }

      function tick() {
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        // столкновения
        if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
            snake.some(s => s.x === head.x && s.y === head.y)) {
          gameOver();
          return;
        }
        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = score;
          OS.beep(720 + Math.min(500, score * 4), .05, .3);
          placeFood();
          // ускорение каждые 50 очков
          const level = Math.floor(score / 50);
          const newSpeed = Math.max(70, 150 - level * 14);
          if (newSpeed !== speed) {
            speed = newSpeed;
            speedEl.textContent = 'скорость ' + (level + 1);
            clearInterval(timer);
            timer = setInterval(tick, speed);
          }
        } else {
          snake.pop();
        }
        draw();
      }

      function gameOver() {
        clearInterval(timer);
        timer = null;
        OS.beep(150, .3);
        if (score > best) {
          best = score;
          OS.settings.set('snake.best', best);
          bestEl.textContent = best;
          OS.notify({ title: 'Змейка', body: `Новый рекорд: ${best}! 🏆`, appId: 'snake' });
        }
        setState('over', 'Игра окончена', `Счёт: ${score} · Enter — ещё раз`);
        draw(true);
      }

      function rr(x, y, w, h, r) {
        cx.beginPath();
        cx.roundRect(x, y, w, h, r);
        cx.fill();
      }

      function draw(dead) {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        // поле в шашечку
        cx.fillStyle = dark ? '#141620' : '#f2efe8';
        cx.fillRect(0, 0, canvas.width, canvas.height);
        cx.fillStyle = dark ? 'rgba(255,255,255,.025)' : 'rgba(0,0,0,.03)';
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
          if ((x + y) % 2) cx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
        // еда
        cx.fillStyle = '#FF6B5E';
        cx.beginPath();
        cx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2 + 1, CELL * 0.34, 0, Math.PI * 2);
        cx.fill();
        cx.fillStyle = '#2E8B57';
        rr(food.x * CELL + CELL / 2 - 1.5, food.y * CELL + 3, 3, 6, 2);
        // змейка
        const ac = accent();
        snake.forEach((s, i) => {
          const t = i / Math.max(1, snake.length - 1);
          cx.fillStyle = dead ? '#8e8e96' : ac;
          cx.globalAlpha = 1 - t * 0.45;
          const pad = 2 + t * 1.5;
          rr(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 7 - t * 3);
        });
        cx.globalAlpha = 1;
        // глаза
        if (!dead && snake.length) {
          const h = snake[0];
          cx.fillStyle = '#fff';
          const ex = h.x * CELL + CELL / 2 + dir.x * 4, ey = h.y * CELL + CELL / 2 + dir.y * 4;
          const off = dir.x !== 0 ? [0, 4.5] : [4.5, 0];
          cx.beginPath(); cx.arc(ex - off[0], ey - off[1], 2.6, 0, 7); cx.fill();
          cx.beginPath(); cx.arc(ex + off[0], ey + off[1], 2.6, 0, 7); cx.fill();
        }
      }

      function togglePause() {
        if (state === 'run') {
          clearInterval(timer);
          timer = null;
          setState('pause', 'Пауза', 'пробел — продолжить');
        } else if (state === 'pause') {
          setState('run');
          timer = setInterval(tick, speed);
        }
      }

      const onKey = (e) => {
        if (OS.wm.focused !== win) return;
        const map = {
          ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
          ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
          ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
          ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 },
        };
        if (map[e.code]) {
          e.preventDefault();
          if (state === 'idle') { start(); return; }
          if (state !== 'run') return;
          const d = map[e.code];
          if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d; // нельзя развернуться на месте
        } else if (e.code === 'Space') {
          e.preventDefault();
          if (state === 'idle') start(); else togglePause();
        } else if (e.code === 'Enter' && (state === 'over' || state === 'idle')) {
          e.preventDefault();
          start();
        }
      };
      document.addEventListener('keydown', onKey);
      canvas.addEventListener('click', () => { if (state !== 'run') start(); root.focus(); });

      win.on('focus', () => setTimeout(() => root.focus(), 0));
      win.on('close', () => {
        clearInterval(timer);
        document.removeEventListener('keydown', onKey);
      });

      reset();
      draw();
      setState('idle', 'Змейка', 'нажми стрелку или пробел');
      setTimeout(() => root.focus(), 60);
    },
  });
})();

</script>

/* === js/apps/music.js === */
/* Hiko OS · Пианино — синтезатор с записью мелодий */
(function () {
  'use strict';
  const { el, esc } = OS;

  const ICON = OS.appTile(
    { from: '#FF7DA8', to: '#A83A78' },
    `<g fill="#fff">
      <circle cx="-14" cy="20" r="9"/>
      <circle cx="20" cy="14" r="9"/>
      <path d="M -6 20 L -6 -22 L 28 -28 L 28 14 L 22 14 L 22 -14 L 0 -10 L 0 20 Z"/>
    </g>`
  );

  OS.injectStyle('app-music', `
    .mu-root { flex:1; min-height:0; display:flex; flex-direction:column; }
    .mu-bar { flex-wrap:wrap; row-gap:6px; }
    .mu-stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
      background: radial-gradient(700px 300px at 50% -40%, var(--accent-soft), transparent), var(--content-bg);
      padding: 16px; }
    .mu-kbd { position:relative; height:min(240px, 90%); aspect-ratio:2.3; max-width:100%; user-select:none; }
    .mu-key { position:absolute; top:0; border-radius:0 0 7px 7px; cursor:default;
      box-shadow: inset 0 -4px 8px rgba(0,0,0,.08), 0 2px 5px rgba(0,0,0,.22);
      transition: filter .06s, transform .06s; }
    .mu-key.white { background:linear-gradient(#fdfdfa, #eceae4); height:100%; width:calc(100%/14);
      border:1px solid rgba(0,0,0,.16); z-index:1; }
    .mu-key.black { background:linear-gradient(#3a3d4a, #14161e); height:60%; width:calc(100%/14*.62);
      z-index:2; border-radius:0 0 5px 5px; }
    .mu-key.on { filter:brightness(.82); transform:translateY(2px); }
    .mu-key.black.on { filter:brightness(1.6); }
    .mu-key .kb-hint { position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
      font-size:10px; color:rgba(0,0,0,.35); font-family:var(--font-mono); }
    .mu-key.black .kb-hint { color:rgba(255,255,255,.5); }
    .mu-rec-dot { width:9px; height:9px; border-radius:50%; background:#FF6B5E; display:inline-block;
      animation: mu-blink 1s step-end infinite; margin-right:5px; }
    @keyframes mu-blink { 50% { opacity:.25; } }
    .mu-count { font-size:12px; color:var(--text-3); margin-left:auto; white-space:nowrap; }
  `);

  const WAVES = [['sine', 'Синус'], ['triangle', 'Мягкий'], ['sawtooth', 'Пила'], ['square', 'Ретро']];
  // клавиатура: нижний ряд — белые, верхний — чёрные
  const KEYMAP = {
    KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6,
    KeyG: 7, KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13,
    KeyL: 14, KeyP: 15, Semicolon: 16,
  };
  const HINTS = ['A', 'W', 'S', 'E', 'D', 'F', 'T', 'G', 'Y', 'H', 'U', 'J', 'K', 'O', 'L', 'P', ';'];
  const BLACKS = new Set([1, 3, 6, 8, 10, 13, 15, 18, 20, 22]); // полутоны в 2 октавах

  OS.registerApp({
    id: 'music',
    name: 'Пианино',
    icon: ICON,
    width: 720, height: 400,
    minWidth: 540, minHeight: 300,
    singleton: true,
    render(win) {
      let audio = null;
      let wave = 'triangle';
      let octave = 4;         // базовая октава (C4)
      let volume = 0.5;
      const voices = new Map();      // midi -> {osc, gain}
      // запись
      let recording = false, recStart = 0, recNotes = [], noteOpen = new Map();
      let playTimers = [];

      const ensureAudio = () => {
        if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === 'suspended') audio.resume();
        return audio;
      };
      const freqOf = (midi) => 440 * Math.pow(2, (midi - 69) / 12);

      function noteOn(midi) {
        if (voices.has(midi)) return;
        const ctx = ensureAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = wave;
        osc.frequency.value = freqOf(midi);
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(volume * 0.32, ctx.currentTime + 0.015);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        voices.set(midi, { osc, gain });
        keyEl(midi)?.classList.add('on');
        if (recording) noteOpen.set(midi, performance.now() - recStart);
      }
      function noteOff(midi) {
        const v = voices.get(midi);
        if (!v) return;
        voices.delete(midi);
        const ctx = audio;
        try {
          v.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.07);
          v.osc.stop(ctx.currentTime + 0.4);
        } catch (e) { /* — */ }
        keyEl(midi)?.classList.remove('on');
        if (recording && noteOpen.has(midi)) {
          const t = noteOpen.get(midi);
          noteOpen.delete(midi);
          recNotes.push({ t, midi, d: performance.now() - recStart - t });
          updateCount();
        }
      }
      function allOff() {
        Array.from(voices.keys()).forEach(noteOff);
      }

      const root = el('div', 'mu-root');
      root.innerHTML = `
        <div class="ui-toolbar mu-bar">
          <div class="ui-seg">${WAVES.map(([v, n]) => `<button class="seg-btn ${v === wave ? 'on' : ''}" data-w="${v}">${n}</button>`).join('')}</div>
          <button class="ui-btn icon-only mu-oct-dn" title="Октава ниже">−</button>
          <span class="mu-oct" style="font-size:12.5px;font-weight:700;min-width:26px;text-align:center">C${octave}</span>
          <button class="ui-btn icon-only mu-oct-up" title="Октава выше">+</button>
          <input class="ui-slider" type="range" min="5" max="100" value="${volume * 100}" style="width:90px" title="Громкость">
          <button class="ui-btn mu-rec">● Запись</button>
          <button class="ui-btn mu-play" disabled>▶ Играть</button>
          <span class="mu-count"></span>
        </div>
        <div class="mu-stage"><div class="mu-kbd"></div></div>`;
      win.content.appendChild(root);

      const kbd = root.querySelector('.mu-kbd');
      const baseMidi = () => 12 * (octave + 1); // C(octave)

      function keyEl(midi) {
        return kbd.querySelector(`[data-midi="${midi}"]`);
      }

      function buildKeys() {
        kbd.innerHTML = '';
        const base = baseMidi();
        let whiteIdx = 0;
        for (let semi = 0; semi < 24; semi++) {
          const midi = base + semi;
          const isBlack = BLACKS.has(semi);
          const key = el('div', 'mu-key ' + (isBlack ? 'black' : 'white'));
          key.dataset.midi = midi;
          if (isBlack) {
            key.style.left = `calc(100%/14*${whiteIdx} - 100%/14*.31)`;
          } else {
            key.style.left = `calc(100%/14*${whiteIdx})`;
            whiteIdx++;
          }
          // подсказка клавиши
          const hintIdx = Object.values(KEYMAP).indexOf(semi);
          if (hintIdx >= 0 && semi <= 16) key.innerHTML = `<span class="kb-hint">${HINTS[Object.keys(KEYMAP).findIndex(k => KEYMAP[k] === semi)]}</span>`;
          key.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            key.setPointerCapture(e.pointerId);
            noteOn(midi);
          });
          key.addEventListener('pointerup', () => noteOff(midi));
          key.addEventListener('pointercancel', () => noteOff(midi));
          key.addEventListener('pointerleave', () => noteOff(midi));
          kbd.appendChild(key);
        }
      }
      buildKeys();

      /* --- тулбар --- */
      root.querySelectorAll('[data-w]').forEach(b => b.addEventListener('click', () => {
        wave = b.dataset.w;
        root.querySelectorAll('[data-w]').forEach(x => x.classList.toggle('on', x === b));
      }));
      const octLabel = root.querySelector('.mu-oct');
      root.querySelector('.mu-oct-dn').addEventListener('click', () => {
        if (octave > 2) { octave--; octLabel.textContent = 'C' + octave; allOff(); buildKeys(); }
      });
      root.querySelector('.mu-oct-up').addEventListener('click', () => {
        if (octave < 6) { octave++; octLabel.textContent = 'C' + octave; allOff(); buildKeys(); }
      });
      root.querySelector('.ui-slider').addEventListener('input', (e) => { volume = e.target.value / 100; });

      const recBtn = root.querySelector('.mu-rec');
      const playBtn = root.querySelector('.mu-play');
      const countEl = root.querySelector('.mu-count');
      const updateCount = () => {
        countEl.textContent = recNotes.length ? `нот: ${recNotes.length}` : '';
        playBtn.disabled = !recNotes.length || recording;
      };

      recBtn.addEventListener('click', () => {
        recording = !recording;
        if (recording) {
          recNotes = [];
          noteOpen.clear();
          recStart = performance.now();
          recBtn.innerHTML = `<span class="mu-rec-dot"></span>Стоп`;
        } else {
          recBtn.textContent = '● Запись';
        }
        updateCount();
      });

      playBtn.addEventListener('click', () => {
        stopPlayback();
        recNotes.forEach(n => {
          playTimers.push(setTimeout(() => noteOn(n.midi), n.t));
          playTimers.push(setTimeout(() => noteOff(n.midi), n.t + Math.max(80, n.d)));
        });
      });
      function stopPlayback() {
        playTimers.forEach(clearTimeout);
        playTimers = [];
        allOff();
      }

      /* --- клавиатура компьютера --- */
      const downKeys = new Set();
      const onDown = (e) => {
        if (OS.wm.focused !== win) return;
        if (e.target.closest('input, textarea, select')) return;
        const semi = KEYMAP[e.code];
        if (semi === undefined || downKeys.has(e.code)) return;
        e.preventDefault();
        downKeys.add(e.code);
        noteOn(baseMidi() + semi);
      };
      const onUp = (e) => {
        const semi = KEYMAP[e.code];
        if (semi === undefined) return;
        downKeys.delete(e.code);
        noteOff(baseMidi() + semi);
      };
      document.addEventListener('keydown', onDown);
      document.addEventListener('keyup', onUp);

      win.on('close', () => {
        stopPlayback();
        allOff();
        document.removeEventListener('keydown', onDown);
        document.removeEventListener('keyup', onUp);
        if (audio) { try { audio.close(); } catch (e) { /* — */ } }
      });
    },
  });
})();

</script>

    render(win) {

      const procStats = new Map(); // winId -> {cpu, mem}

        renderBody();

      killBtn.addEventListener('click', () => {
        const w = OS.wm.byId(selId);
        if (w) { w.close(); selId = null; killBtn.disabled = true; }
      });

      function statFor(w) {
        if (!procStats.has(w.id)) {
          procStats.set(w.id, {
            cpu: 0.5 + Math.random() * 3,
            mem: 18 + Math.random() * 60,
          });
        }
        return procStats.get(w.id);
      }
      function drift() {
        OS.wm.all().forEach(w => {
          const s = statFor(w);
          const active = OS.wm.focused === w ? 2.5 : 0;
          s.cpu = Math.max(0.1, Math.min(28, s.cpu + (Math.random() - 0.48) * 1.6 + active * 0.15));
          s.mem = Math.max(12, Math.min(400, s.mem + (Math.random() - 0.5) * 3));
        });
      }

      function totalCpu() {
        let t = 1.2;
        OS.wm.all().forEach(w => { t += statFor(w).cpu; });
        return Math.min(99, t);
      }
      function totalMem() {
        let t = 210; // «система»
        OS.wm.all().forEach(w => { t += statFor(w).mem; });
        try { t += JSON.stringify(localStorage).length / 1024 / 1024 * 8; } catch (e) { /* — */ }
        return t;
      }

      function renderBody() {
        if (tab === 'proc') renderProcs();
        else renderPerf();
      }

      function renderProcs() {
        const wins = OS.wm.all();
        const rows = wins.map(w => {
          const s = statFor(w);
          return `<tr class="proc ${selId === w.id ? 'sel' : ''}" data-id="${w.id}">
            <td><div class="tm-name"><div class="tm-ic">${w.app.icon || ''}</div>
              <span>${esc(w.app.name)}</span>&nbsp;<span class="tm-dim">— ${esc(w.getTitle() || '')}</span></div></td>
            <td class="tm-dim">${w.isMin ? 'Свёрнуто' : 'Активно'}</td>
            <td class="num">${s.cpu.toFixed(1)}%</td>
            <td class="num">${s.mem.toFixed(0)} МБ</td>
          </tr>`;
        }).join('');
        body.innerHTML = `<table class="tm-table">
          <thead><tr><th>Приложение</th><th>Статус</th><th class="num">ЦП</th><th class="num">Память</th></tr></thead>
          <tbody>
            <tr class="proc sys"><td><div class="tm-name"><div class="tm-ic" style="color:var(--accent)">${OS.icons.logo}</div><span>Система</span>&nbsp;<span class="tm-dim">— ядро Hiko OS</span></div></td>
              <td class="tm-dim">Работает</td><td class="num">1.2%</td><td class="num">210 МБ</td></tr>
            ${rows}
          </tbody></table>
          ${!wins.length ? '<div class="ui-empty" style="padding:30px 0">Нет запущенных приложений</div>' : ''}`;

        body.querySelectorAll('tr.proc[data-id]').forEach(tr => {

            selId = tr.dataset.id;
            killBtn.disabled = false;
            body.querySelectorAll('tr.proc').forEach(x => x.classList.toggle('sel', x === tr));
          });
          tr.addEventListener('dblclick', () => {
            const w = OS.wm.byId(tr.dataset.id);
            if (w) { w.restore(); w.focus(); }
          });
        });
      }

      function renderPerf() {
        body.innerHTML = `<div class="tm-perf">
          <div class="tm-card"><h3>ЦП</h3><div class="tm-val tm-cpuval"></div><canvas class="tm-cpu"></canvas></div>
          <div class="tm-card"><h3>Память</h3><div class="tm-val tm-memval"></div><canvas class="tm-mem"></canvas></div>
        </div>`;
        drawCharts();
      }

      function drawChart(canvas, hist, max, color) {
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth || 500, h = canvas.clientHeight || 110;
        canvas.width = w * dpr; canvas.height = h * dpr;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, w, h);
        // сетка
        ctx.strokeStyle = 'rgba(128,128,140,.18)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 4; i++) {
          ctx.beginPath(); ctx.moveTo(0, h * i / 4); ctx.lineTo(w, h * i / 4); ctx.stroke();
        }
        // линия
        const pts = hist.map((v, i) => [i / (hist.length - 1) * w, h - (v / max) * (h - 8) - 2]);
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, color + '55');
        grad.addColorStop(1, color + '00');
        ctx.beginPath();
        pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();
      }

      function drawCharts() {
        const cpuC = body.querySelector('.tm-cpu');
        const memC = body.querySelector('.tm-mem');
        if (!cpuC) return;
        const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0a84ff';
        drawChart(cpuC, cpuHist, 100, accent);
        drawChart(memC, memHist, 2048, '#30d158');
        body.querySelector('.tm-cpuval').textContent = cpuHist[cpuHist.length - 1].toFixed(1) + ' %';
        body.querySelector('.tm-memval').textContent = (memHist[memHist.length - 1] / 1024).toFixed(2) + ' ГБ из 2 ГБ';
      }

      function foot() {
        const up = Math.floor(performance.now() / 1000);
        const hh = String(Math.floor(up / 3600)).padStart(2, '0');
        const mm = String(Math.floor(up / 60) % 60).padStart(2, '0');
        const ss = String(up % 60).padStart(2, '0');
        root.querySelector('.tm-count').textContent = `Процессов: ${OS.wm.all().length + 1}`;
        root.querySelector('.tm-uptime').textContent = `Аптайм: ${hh}:${mm}:${ss}`;
      }

      const tick = setInterval(() => {
        drift();
        cpuHist.push(totalCpu()); cpuHist.shift();
        memHist.push(totalMem()); memHist.shift();
        if (tab === 'proc') renderProcs(); else drawCharts();
        foot();
      }, 1000);

      const unsubs = ['wm:opened', 'wm:closed', 'wm:minimized', 'wm:restored'].map(evt =>
        OS.on(evt, () => { if (tab === 'proc') renderProcs(); foot(); }));

      win.on('close', () => {
        clearInterval(tick);
        unsubs.forEach(u => u());
      });
      win.on('resize', () => { if (tab === 'perf') drawCharts(); });

      renderBody();
      foot();
    },
  });
})();

</script>

  const CITIES = [
    { name: 'Москва', tz: 'Europe/Moscow' },
    { name: 'Лондон', tz: 'Europe/London' },
    { name: 'Нью-Йорк', tz: 'America/New_York' },
    { name: 'Токио', tz: 'Asia/Tokyo' },
    { name: 'Дубай', tz: 'Asia/Dubai' },
    { name: 'Сидней', tz: 'Australia/Sydney' },
  ];

  OS.registerApp({
    id: 'clock',
    name: 'Часы',
    icon: ICON,
    width: 460, height: 560,
    minWidth: 380, minHeight: 420,
    singleton: true,
    render(win) {
      let tab = 'world';
      let raf = null, worldTimer = null, timerInt = null;
      // секундомер
      let swRunning = false, swStart = 0, swAcc = 0, laps = [];
      // таймер
      let tmTotal = 300, tmLeft = 300, tmRunning = false, tmLastTick = 0;

      const root = el('div', 'ck-root');
      root.innerHTML = `
        <div class="ui-toolbar" style="justify-content:center">
          <div class="ui-seg">
            <button class="seg-btn on" data-tab="world">Мир</button>
            <button class="seg-btn" data-tab="sw">Секундомер</button>
            <button class="seg-btn" data-tab="timer">Таймер</button>
          </div>
        </div>
        <div class="ck-body"></div>`;
      win.content.appendChild(root);
      const body = root.querySelector('.ck-body');

      root.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
        tab = b.dataset.tab;
        root.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
        stopLoops();
        render();
      }));

      function stopLoops() {
        cancelAnimationFrame(raf);
        clearInterval(worldTimer);
      }

      /* ---------- Мир ---------- */
      function renderWorld() {
        body.innerHTML = `
          <svg class="ck-face" width="190" height="190" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="95" fill="var(--content-bg)" stroke="var(--divider)" stroke-width="2"/>
            ${Array.from({ length: 12 }, (_, i) => {
              const a = i * 30 * Math.PI / 180;
              const r1 = i % 3 === 0 ? 80 : 86, r2 = 91;
              return `<line x1="${100 + r1 * Math.sin(a)}" y1="${100 - r1 * Math.cos(a)}" x2="${100 + r2 * Math.sin(a)}" y2="${100 - r2 * Math.cos(a)}" stroke="var(--text-3)" stroke-width="${i % 3 === 0 ? 3 : 1.5}" stroke-linecap="round"/>`;
            }).join('')}
            <line class="ck-h" x1="100" y1="100" x2="100" y2="52" stroke="var(--text)" stroke-width="6" stroke-linecap="round"/>
            <line class="ck-m" x1="100" y1="100" x2="100" y2="34" stroke="var(--text)" stroke-width="4" stroke-linecap="round"/>
            <line class="ck-s" x1="100" y1="112" x2="100" y2="26" stroke="#ff453a" stroke-width="2" stroke-linecap="round"/>
            <circle cx="100" cy="100" r="4.5" fill="#ff453a"/>
            <circle cx="100" cy="100" r="2" fill="var(--content-bg)"/>
          </svg>
          <div class="ck-big ck-digital"></div>
          <div class="ck-cities">
            ${CITIES.map(c => `<div class="ck-city" data-tz="${c.tz}">
              <div class="cc-ic"></div>
              <div><div class="nm">${esc(c.name)}</div><div class="off"></div></div>
              <div class="tm"></div>
            </div>`).join('')}
          </div>`;

        const hH = body.querySelector('.ck-h'), mH = body.querySelector('.ck-m'), sH = body.querySelector('.ck-s');
        const dig = body.querySelector('.ck-digital');

        const spin = () => {
          if (tab !== 'world' || !hH.isConnected) return;
          const d = new Date();
          const ms = d.getMilliseconds();
          const s = d.getSeconds() + ms / 1000;
          const m = d.getMinutes() + s / 60;
          const h = (d.getHours() % 12) + m / 60;
          sH.setAttribute('transform', `rotate(${s * 6} 100 100)`);
          mH.setAttribute('transform', `rotate(${m * 6} 100 100)`);
          hH.setAttribute('transform', `rotate(${h * 30} 100 100)`);
          dig.textContent = d.toLocaleTimeString('ru-RU');
          raf = requestAnimationFrame(spin);
        };
        spin();

        const updateCities = () => {
          if (tab !== 'world') return;
          const now = new Date();
          body.querySelectorAll('.ck-city').forEach(row => {
            const tz = row.dataset.tz;
            const fmt = new Intl.DateTimeFormat('ru-RU', { timeZone: tz, hour: '2-digit', minute: '2-digit' });
            row.querySelector('.tm').textContent = fmt.format(now);
            // смещение от локального
            const remote = new Date(now.toLocaleString('en-US', { timeZone: tz }));
            const local = new Date(now.toLocaleString('en-US'));
            const diff = Math.round((remote - local) / 3600000);
            row.querySelector('.off').textContent = diff === 0 ? 'как у тебя' : (diff > 0 ? `+${diff} ч` : `${diff} ч`);

            row.querySelector('.cc-ic').innerHTML = (hour >= 7 && hour < 21) ? OS.icons.sun : OS.icons.moon;

      /* ---------- Секундомер ---------- */
      const swNow = () => swAcc + (swRunning ? performance.now() - swStart : 0);
      const swFmt = (ms) => {

          <div class="ck-laps"></div>`;
        const big = body.querySelector('.ck-big');
        const lapsEl = body.querySelector('.ck-laps');

        const drawLaps = () => {
          if (!laps.length) { lapsEl.innerHTML = ''; return; }
          const deltas = laps.map((v, i) => v - (laps[i - 1] || 0));
          const best = Math.min(...deltas), worst = Math.max(...deltas);
          lapsEl.innerHTML = laps.map((v, i) => {
            const d = deltas[i];
            const cls = deltas.length > 1 ? (d === best ? 'best' : d === worst ? 'worst' : '') : '';
            return `<div class="ck-lap ${cls}"><span>Круг ${i + 1}</span><span>${swFmt(d)}</span></div>`;
          }).join('');
        };
        drawLaps();

        const loop = () => {
          if (tab !== 'sw' || !big.isConnected) return;
          big.textContent = swFmt(swNow());
          raf = requestAnimationFrame(loop);
        };
        loop();

        body.querySelector('.ck-startstop').addEventListener('click', () => {
          if (swRunning) { swAcc = swNow(); swRunning = false; }
          else { swStart = performance.now(); swRunning = true; }
          renderSw();
        });
        body.querySelector('.ck-lapreset').addEventListener('click', () => {
          if (swRunning) { laps.push(swNow()); drawLaps(); }
          else { swAcc = 0; laps = []; renderSw(); }
        });
      }

      /* ---------- Таймер ---------- */
      const tmFmt = (s) => {
        s = Math.max(0, Math.ceil(s));
        const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
        return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      };

      function renderTimer() {
        const R = 92, C = 2 * Math.PI * R;
        body.innerHTML = `
          <div class="ck-ring-wrap">
            <svg width="210" height="210" viewBox="0 0 210 210">
              <circle cx="105" cy="105" r="${R}" fill="none" stroke="var(--ctl-bg-hover)" stroke-width="9"/>
              <circle class="ck-ring" cx="105" cy="105" r="${R}" fill="none" stroke="var(--accent)" stroke-width="9"
                stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/>
            </svg>
            <div class="ck-remain">${tmFmt(tmLeft)}</div>
          </div>
          <div class="ck-timer-set ${tmRunning ? 'hidden' : ''}">
            <input class="ui-input tm-h" type="number" min="0" max="23" value="${Math.floor(tmTotal / 3600)}"> ч
            <input class="ui-input tm-m" type="number" min="0" max="59" value="${Math.floor(tmTotal / 60) % 60}"> мин
            <input class="ui-input tm-s" type="number" min="0" max="59" value="${tmTotal % 60}"> с
          </div>
          <div class="ck-presets ${tmRunning ? 'hidden' : ''}">
            <button class="ui-btn" data-p="60">1 мин</button>
            <button class="ui-btn" data-p="300">5 мин</button>
            <button class="ui-btn" data-p="600">10 мин</button>
          </div>
          <div class="ck-btnrow">
            <button class="ck-round neutral ck-tm-reset">Сброс</button>
            <button class="ck-round ${tmRunning ? 'stop' : 'go'} ck-tm-go">${tmRunning ? 'Пауза' : 'Старт'}</button>
          </div>`;

        const ring = body.querySelector('.ck-ring');
        const remain = body.querySelector('.ck-remain');
        const upd = () => {
          remain.textContent = tmFmt(tmLeft);
          ring.style.strokeDashoffset = String(C * (1 - (tmTotal ? tmLeft / tmTotal : 0)));
        };
        upd();

        const readInputs = () => {
          const h = +body.querySelector('.tm-h').value || 0;
          const m = +body.querySelector('.tm-m').value || 0;
          const s = +body.querySelector('.tm-s').value || 0;
          tmTotal = Math.max(1, h * 3600 + m * 60 + s);
          tmLeft = tmTotal;
          upd();
        };
        body.querySelectorAll('.tm-h,.tm-m,.tm-s').forEach(i => i.addEventListener('change', readInputs));
        body.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
          tmTotal = tmLeft = +b.dataset.p;
          renderTimer();
        }));

        body.querySelector('.ck-tm-go').addEventListener('click', () => {
          if (tmRunning) { tmRunning = false; clearInterval(timerInt); }
          else {
            if (tmLeft <= 0) tmLeft = tmTotal;
            tmRunning = true;
            tmLastTick = performance.now();
            timerInt = setInterval(() => {
              const now = performance.now();
              tmLeft -= (now - tmLastTick) / 1000;
              tmLastTick = now;
              if (tmLeft <= 0) {
                tmLeft = 0;
                tmRunning = false;
                clearInterval(timerInt);
                OS.notify({ title: 'Часы', body: 'Таймер завершён! ⏰', appId: 'clock' });
                OS.beep(880, .22); setTimeout(() => OS.beep(880, .22), 350); setTimeout(() => OS.beep(1100, .3), 700);
                renderTimer();
                return;
              }
              upd();
            }, 200);
          }
          renderTimer();
        });
        body.querySelector('.ck-tm-reset').addEventListener('click', () => {
          tmRunning = false;
          clearInterval(timerInt);
          tmLeft = tmTotal;
          renderTimer();
        });
      }

      function render() {
        if (tab === 'world') renderWorld();
        else if (tab === 'sw') renderSw();
        else renderTimer();
      }

      win.on('close', () => {
        stopLoops();
        clearInterval(timerInt);
      });

      render();
    },
  });
})();

</script>

    "          var a = Math.floor(Math.random() * 6), b = Math.floor(Math.random() * 6);",
    "          row.textContent = FACES[a] + ' ' + FACES[b];",
    "          if (++n >= 8) {",
    "            clearInterval(t);",
    "            rolls++;",
    "            sum.textContent = 'Выпало: ' + (a + 1 + b + 1) + ' · бросков: ' + rolls;",
    "            OS.beep(500 + (a + b) * 40, .08);",
    "          }",
    "        }, 55);",
    "      });",
    "    },",
    "  });",
    "})();",
  ].join('\n');

  /* ---------- установка ---------- */

  const metaOf = (code) => ({
    id: (code.match(/id:\s*['"]([\w-]+)['"]/) || [])[1] || null,
    name: (code.match(/name:\s*['"]([^'"]+)['"]/) || [])[1] || null,
  });

  function execute(code) {
    new Function(code)(); // бросит исключение, если код невалиден
  }

  /** Установка с подтверждением. Возвращает true при успехе. */
  async function installCode(code, fileName, sourceUrl) {
    code = String(code || '');
    if (!code.trim()) { OS.dialog.alert('Установщик', 'Файл пустой.'); return false; }
    if (code.length > 400 * 1024) { OS.dialog.alert('Установщик', 'Файл больше 400 КБ — слишком крупный для приложения.'); return false; }
    const meta = metaOf(code);
    const isNet = code.includes('OS.net.registerProvider');
    const isVoice = code.includes('OS.assistant.registerProvider');
    const looksLikeApp = code.includes('OS.registerApp') || code.includes('OS.widgets.register') || isNet || isVoice;
    const kind = isNet ? 'модуль обхода блокировок' : isVoice ? 'голосовой ассистент' : null;
    const ok = await OS.dialog.confirm(
      isNet ? 'Установить модуль обхода?' : isVoice ? 'Установить ассистента?' : 'Установить приложение?',
      `${meta.name ? `«${meta.name}»` : fileName}${kind ? `\nтип: ${kind}` : ''}${sourceUrl ? `\nисточник: ${sourceUrl.slice(0, 60)}` : ''}\n\n⚠ Код получит полный доступ к Hiko OS (файлы, настройки, сеть). Устанавливай только то, чему доверяешь.${looksLikeApp ? (isNet ? '\n\nПосле установки переключатель появится в Центре управления.' : '') : '\n\nВнимание: в коде не видно точки подключения Hiko OS — возможно, это не модуль Hiko.'}`,
      { okLabel: 'Установить', danger: !looksLikeApp }
    );
    if (!ok) return false;
    return installTrusted(code, fileName, sourceUrl);
  }

  /** Установка без вопросов (для демо и программного API). */
  function installTrusted(code, fileName, sourceUrl) {
    try {
      execute(code);
    } catch (e) {
      OS.dialog.alert('Не удалось установить', 'Код приложения сломан: ' + e.message);
      return false;
    }
    try {
      const meta = metaOf(code);
      let name = fileName || ((meta.id || 'app') + '.js');
      if (!name.endsWith('.js')) name += '.js';
      // перезапись файла того же приложения, иначе — уникальное имя
      if (!OS.vfs.exists('/Apps/' + name)) name = OS.vfs.uniqueName('/Apps', name);
      OS.vfs.write('/Apps/' + name, code, { sourceUrl: sourceUrl || null, installedAt: Date.now(), appId: meta.id });
      OS.notify({ title: 'Установщик', body: `«${meta.name || name}» установлено ✓`, appId: 'installer' });
      return true;
    } catch (e) {
      OS.dialog.alert('Приложение запущено, но не сохранилось', e.message);
      return false;
    }
  }

  async function installFromUrl(url) {
    url = String(url || '').trim();
    if (!/^https?:\/\//i.test(url)) { OS.dialog.alert('Установщик', 'Нужна полная ссылка (https://…) на .js-файл.'); return; }
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 12000);
      const r = await fetch(url, { signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const code = await r.text();
      const fileName = decodeURIComponent(url.split('/').pop().split('?')[0] || 'app.js');
      await installCode(code, fileName, url);
    } catch (e) {
      OS.dialog.alert('Не удалось скачать',
        (e.name === 'AbortError' ? 'Время ожидания вышло.' : e.message) +
        '\n\nПодойдут ссылки, которые разрешают загрузку из браузера (CORS): raw.githubusercontent.com, gist, jsdelivr, unpkg.');
    }
  }

  OS.installer = { installCode, installTrusted, installFromUrl, demoCode: DEMO_CODE };

  /* ---------- интерфейс ---------- */

  OS.registerApp({
    id: 'installer',
    name: 'Установщик',
    icon: ICON,
    width: 620, height: 520,
    minWidth: 480, minHeight: 380,
    singleton: true,
    render(win) {
      const root = el('div', 'ins-root');
      root.innerHTML = `
        <div class="ui-toolbar">
          <button class="ui-btn primary ins-file">Установить из файла…</button>
          <button class="ui-btn ins-url">По ссылке…</button>
          <span style="flex:1"></span>
          <button class="ui-btn ins-demo">🎲 Демо «Кости»</button>
        </div>
        <div class="ins-body">
          <div class="ins-warn">${OS.icons.warn}<div>Приложение — это .js-файл в формате Hiko OS (см. docs/APP_API.md в репозитории).
            Установленный код получает полный доступ к системе — ставь только из доверенных источников.
            Файлы хранятся в папке <b>/Apps</b> и загружаются при каждом старте.</div></div>
          <div class="ins-card" style="margin-top:12px">
            <h3>Установленные приложения</h3>
            <div class="ins-list"></div>
          </div>
        </div>`;
      win.content.appendChild(root);
      const listEl = root.querySelector('.ins-list');

      const fileIn = el('input');
      fileIn.type = 'file';
      fileIn.accept = '.js,text/javascript';
      fileIn.style.display = 'none';
      root.appendChild(fileIn);

      function renderList() {
        let items = [];
        try { items = OS.vfs.list('/Apps').filter(i => i.type === 'file' && i.name.endsWith('.js')); } catch (e) { /* — */ }
        if (!items.length) {
          listEl.innerHTML = `<div class="ins-empty">Пока ничего не установлено.<br>Попробуй демо «Кости» — кнопка сверху.</div>`;
          return;
        }
        listEl.innerHTML = items.map(f => {
          let code = '';
          try { code = OS.vfs.read(f.path); } catch (e) { /* — */ }
          const meta = metaOf(code);
          const app = meta.id ? OS.getApp(meta.id) : null;
          const src = f.meta && f.meta.sourceUrl;
          return `<div class="ins-row" data-path="${esc(f.path)}" data-app="${esc(meta.id || '')}">
            <div class="ic">${app && app.icon ? app.icon : OS.icons.fileGeneric}</div>
            <div><div class="nm">${esc(meta.name || f.name)}</div>
              <div class="meta">${esc(f.name)} · ${OS.fmtBytes(f.size)}${src ? ' · из интернета' : ''}</div></div>
            <span class="sp"></span>
            ${app ? `<button class="ui-btn ins-open">Открыть</button>` : ''}
            <button class="ui-btn danger ins-del">Удалить</button>
          </div>`;
        }).join('');

        listEl.querySelectorAll('.ins-row').forEach(row => {
          const path = row.dataset.path;
          const appId = row.dataset.app;
          const openBtn = row.querySelector('.ins-open');
          if (openBtn) openBtn.addEventListener('click', () => OS.launch(appId));
          row.querySelector('.ins-del').addEventListener('click', async () => {
            const ok = await OS.dialog.confirm('Удалить приложение?',
              `${OS.vfs.nameOf(path)} будет удалено. Иконка исчезнет после перезагрузки системы.`,
              { okLabel: 'Удалить', danger: true });
            if (!ok) return;
            try {
              OS.vfs.rm(path);
              if (appId) {
                const pinned = OS.settings.get('dockPinned', []);
                if (pinned.includes(appId)) OS.settings.set('dockPinned', pinned.filter(x => x !== appId));
                OS.wm.windowsOf(appId).forEach(w => w.close());
              }
              OS.notify({ title: 'Установщик', body: 'Удалено. Полностью исчезнет после перезагрузки.', appId: 'installer' });
            } catch (e) { OS.dialog.alert('Не получилось', e.message); }
          });
        });
      }

      root.querySelector('.ins-file').addEventListener('click', () => fileIn.click());
      fileIn.addEventListener('change', () => {
        const f = fileIn.files && fileIn.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => installCode(reader.result, f.name);
        reader.readAsText(f);
        fileIn.value = '';
      });

      root.querySelector('.ins-url').addEventListener('click', async () => {
        const url = await OS.dialog.prompt('Установка по ссылке', 'Прямая ссылка на .js-файл приложения:', 'https://');
        if (url) installFromUrl(url);
      });

      root.querySelector('.ins-demo').addEventListener('click', async () => {
        const ok = await OS.dialog.confirm('Установить демо «Кости»?', 'Маленькое встроенное приложение — показать, как работает установка.', { okLabel: 'Установить' });
        if (ok) {
          installTrusted(DEMO_CODE, 'dice.js');
          OS.launch('dice');
        }
      });

      const un = OS.on('vfs:change', OS.debounce(({ path }) => {
        if (path.startsWith('/Apps')) renderList();
      }, 150));
      win.on('close', () => un());

      renderList();
    },
  });
})();

</script>
  <script>
