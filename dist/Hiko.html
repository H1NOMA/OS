/* === js/core/wm.js === */
/* ============================================================
   Hiko OS · wm — оконный менеджер
   Перетаскивание, ресайз за 8 ручек, снэп к краям (Windows 11),
   Snap Layouts, Alt+Tab, Mission Control, Aero Shake.
   ============================================================ */
(function () {
  'use strict';
  const { el, $, clamp, uid, esc } = OS;

  const MENUBAR_H = 30;
  let zTop = 100;
  const windows = new Map();  // id -> Win
  let focused = null;

  const layer = () => document.getElementById('windows');
  const workArea = () => ({
    x: 0,
    y: MENUBAR_H,
    w: window.innerWidth,
    h: window.innerHeight - MENUBAR_H,
  });

  /* ============================ SNAP ============================ */

  const snapPreview = () => document.getElementById('snap-preview');

  function snapRect(zone) {
    const a = workArea();
    const half = { w: a.w / 2, h: a.h / 2 };
    switch (zone) {
      case 'max':   return { x: a.x, y: a.y, w: a.w, h: a.h };
      case 'left':  return { x: a.x, y: a.y, w: half.w, h: a.h };
      case 'right': return { x: a.x + half.w, y: a.y, w: half.w, h: a.h };
      case 'tl':    return { x: a.x, y: a.y, w: half.w, h: half.h };
      case 'tr':    return { x: a.x + half.w, y: a.y, w: half.w, h: half.h };
      case 'bl':    return { x: a.x, y: a.y + half.h, w: half.w, h: half.h };
      case 'br':    return { x: a.x + half.w, y: a.y + half.h, w: half.w, h: half.h };
      case 'l23':   return { x: a.x, y: a.y, w: a.w * 2 / 3, h: a.h };
      case 'r13':   return { x: a.x + a.w * 2 / 3, y: a.y, w: a.w / 3, h: a.h };
      default: return null;
    }
  }

  function zoneAt(px, py) {
    const a = workArea();
    const m = 10;        // чувствительность краёв
    const corner = 130;  // зона углов
    const nearL = px <= a.x + m, nearR = px >= a.x + a.w - m;
    const nearT = py <= a.y + m, nearB = py >= a.y + a.h + MENUBAR_H - m - 60;
    if (nearL && py < a.y + corner) return 'tl';
    if (nearL && nearB) return 'bl';
    if (nearR && py < a.y + corner) return 'tr';
    if (nearR && nearB) return 'br';
    if (nearL) return 'left';
    if (nearR) return 'right';
    if (nearT) return 'max';
    return null;
  }

  function showSnapPreview(zone) {
    const p = snapPreview();
    const r = snapRect(zone);
    if (!r) { hideSnapPreview(); return; }
    if (p.style.display !== 'block') {
      p.style.display = 'block';
      p.style.transition = 'none';
      Object.assign(p.style, { left: r.x + 6 + 'px', top: r.y + 6 + 'px', width: r.w - 12 + 'px', height: r.h - 12 + 'px' });
      requestAnimationFrame(() => { p.style.transition = ''; });
    } else {
      Object.assign(p.style, { left: r.x + 6 + 'px', top: r.y + 6 + 'px', width: r.w - 12 + 'px', height: r.h - 12 + 'px' });
    }
  }
  function hideSnapPreview() { snapPreview().style.display = 'none'; }

  /* ============================ ОКНО ============================ */

  class Win {
    constructor(app, args) {
      this.id = uid('win');
      this.app = app;
      this.args = args || {};
      this.isMin = false;
      this.snapState = null;    // null | 'max' | зона
      this.preSnap = null;      // rect до снэпа
      this._handlers = {};

      const a = workArea();
      const w = clamp(app.width || 720, 200, a.w);
      const h = clamp(app.height || 480, 120, a.h);
      const cascade = (windows.size % 8) * 28;
      const x = clamp((a.w - w) / 2 + cascade - 60, 0, Math.max(0, a.w - w));
      const y = clamp(a.y + (a.h - h) / 2.4 + cascade - 40, a.y, Math.max(a.y, a.y + a.h - h));

      const root = el('div', 'window' + (app.borderless ? ' borderless' : ''));
      root.id = this.id;
      Object.assign(root.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
      root.innerHTML = `
        <div class="win-titlebar">
          <div class="traffic">
            <div class="tl tl-close" title="Закрыть"><svg viewBox="0 0 10 10"><path d="M2 2 L8 8 M8 2 L2 8" stroke="rgba(20,10,10,.62)" stroke-width="1.3" stroke-linecap="round"/></svg></div>
            <div class="tl tl-min" title="Свернуть"><svg viewBox="0 0 10 10"><path d="M2 5 L8 5" stroke="rgba(40,25,0,.62)" stroke-width="1.4" stroke-linecap="round"/></svg></div>
            <div class="tl tl-max" title="Развернуть"><svg viewBox="0 0 10 10"><path d="M2.6 5.6 L2.6 7.4 L4.4 7.4 M7.4 4.4 L7.4 2.6 L5.6 2.6" stroke="rgba(0,40,26,.62)" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
          <div class="win-title">${esc(app.name)}</div>
        </div>
        <div class="win-content"></div>
        <div class="rz rz-n"></div><div class="rz rz-s"></div><div class="rz rz-e"></div><div class="rz rz-w"></div>
        <div class="rz rz-ne"></div><div class="rz rz-nw"></div><div class="rz rz-se"></div><div class="rz rz-sw"></div>`;

      this.root = root;
      this.content = $('.win-content', root);
      this.titlebar = $('.win-titlebar', root);
      this.titleEl = $('.win-title', root);

      layer().appendChild(root);
      windows.set(this.id, this);

      this._wire();
      this.focus();

      try { app.render(this, { args: this.args }); }
      catch (e) {
        console.error(`[WM] ошибка рендера «${app.id}»`, e);
        this.content.innerHTML = `<div class="ui-empty"><div>Приложение аварийно завершилось 😵</div><div style="font-size:12px;opacity:.6">${esc(e.message)}</div></div>`;
      }
      OS.emit('wm:opened', this);
    }

    /* --- события окна --- */
    on(evt, cb) { (this._handlers[evt] = this._handlers[evt] || []).push(cb); return this; }
    _fire(evt, data) { (this._handlers[evt] || []).forEach(cb => { try { cb(data); } catch (e) { console.error(e); } }); }

    setTitle(t) { this.titleEl.textContent = t; OS.emit('wm:title', this); }
    getTitle() { return this.titleEl.textContent; }

    rect() {
      return {
        x: parseFloat(this.root.style.left), y: parseFloat(this.root.style.top),
        w: parseFloat(this.root.style.width), h: parseFloat(this.root.style.height),
      };
    }
    setRect(r, animate) {
      if (animate) {
        this.root.classList.add('animated-move');
        setTimeout(() => this.root.classList.remove('animated-move'), 280);
      }
      Object.assign(this.root.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
      this._fire('resize', r);
    }

    focus() {
      if (focused === this && this.root.classList.contains('focused')) return;
      // перенормировка z-index — чтобы окна никогда не «переросли» панели ОС
      if (zTop > 7000) {
        const sorted = Array.from(windows.values())
          .sort((a, b) => (parseInt(a.root.style.zIndex) || 0) - (parseInt(b.root.style.zIndex) || 0));
        zTop = 100;
        sorted.forEach(w => { w.root.style.zIndex = ++zTop; });
      }
      if (focused && focused !== this) focused.root.classList.remove('focused');
      focused = this;
      this.root.classList.add('focused');
      this.root.style.zIndex = ++zTop;
      OS.emit('wm:focus', this);
      this._fire('focus');
    }

    minimize() {
      if (this.isMin) return;
      this.isMin = true;
      const r = this.rect();
      const dock = document.getElementById('dock');
      const dr = dock ? dock.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight, width: 0 };
      const tx = dr.left + dr.width / 2 - (r.x + r.w / 2);
      const ty = dr.top - (r.y + r.h / 2);
      this.root.classList.add('minimizing');
      this.root.style.transform = `translate(${tx}px, ${ty}px) scale(.06)`;
      this.root.style.opacity = '0';
      setTimeout(() => { this.root.classList.add('hidden'); this.root.classList.remove('minimizing'); }, 330);
      if (focused === this) this._focusNext();
      OS.emit('wm:minimized', this);
    }

    restore() {
      if (!this.isMin) return;
      this.isMin = false;
      this.root.classList.remove('hidden');
      requestAnimationFrame(() => {
        // возврат из дока — с плавным замедлением (не тем же ускоряющим curve, что свёртывание)
        this.root.classList.add('restoring');
        this.root.style.transform = '';
        this.root.style.opacity = '';
        setTimeout(() => this.root.classList.remove('restoring'), 420);
      });
      this.focus();
      OS.emit('wm:restored', this);
    }

    toggleMaximize() {
      if (this.snapState === 'max') this.unsnap(true);
      else this.snapTo('max');
    }

    snapTo(zone, animate) {
      const r = snapRect(zone);
      if (!r) return;
      if (!this.snapState) this.preSnap = this.rect();
      this.snapState = zone;
      this.root.classList.toggle('maximized', zone === 'max');
      this.setRect(r, animate !== false);
      OS.emit('wm:snap', this);
    }

    unsnap(animate) {
      if (!this.snapState) return;
      this.snapState = null;
      this.root.classList.remove('maximized');
      const a = workArea();
      const r = this.preSnap || { x: a.w / 2 - 360, y: a.y + 60, w: 720, h: 480 };
      this.setRect({
        x: clamp(r.x, 0, a.w - 80), y: clamp(r.y, a.y, a.y + a.h - 60),
        w: Math.min(r.w, a.w), h: Math.min(r.h, a.h),
      }, animate !== false);
    }

    close(force) {
      const doClose = () => {
        this.root.classList.add('closing');
        setTimeout(() => {
          this.root.remove();
          windows.delete(this.id);
          if (focused === this) { focused = null; this._focusNext(); }
          OS.emit('wm:closed', this);
        }, 180);
        this._fire('close');
      };
      if (!force && this._handlers['beforeclose']) {
        Promise.resolve(this._handlers['beforeclose'][0]()).then(ok => { if (ok !== false) doClose(); });
      } else doClose();
    }

    _focusNext() {
      const rest = Array.from(windows.values()).filter(w => w !== this && !w.isMin);
      if (rest.length) {
        rest.sort((a, b) => (parseInt(b.root.style.zIndex) || 0) - (parseInt(a.root.style.zIndex) || 0));
        rest[0].focus();
      } else {
        focused = null;
        OS.emit('wm:focus', null);
      }
    }

    /* --- drag / resize / кнопки --- */
    _wire() {
      const root = this.root;

      root.addEventListener('pointerdown', () => this.focus(), true);

      // светофор
      $('.tl-close', root).addEventListener('click', (e) => { e.stopPropagation(); this.close(); });
      $('.tl-min', root).addEventListener('click', (e) => { e.stopPropagation(); this.minimize(); });
      const maxBtn = $('.tl-max', root);
      maxBtn.addEventListener('click', (e) => { e.stopPropagation(); hideSnapLayouts(); this.toggleMaximize(); });
      maxBtn.addEventListener('mouseenter', () => { snapLayoutTimer = setTimeout(() => showSnapLayouts(this, maxBtn), 420); });
      maxBtn.addEventListener('mouseleave', () => { clearTimeout(snapLayoutTimer); scheduleHideSnapLayouts(); });

      // двойной клик по заголовку — максимизация
      this.titlebar.addEventListener('dblclick', (e) => {
        if (e.target.closest('.tl')) return;
        this.toggleMaximize();
      });

      // перетаскивание
      this.titlebar.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || e.target.closest('.tl') || e.target.closest('.win-titlebar-actions')) return;
        this._dragStart(e);
      });

      // контекстное меню заголовка
      this.titlebar.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        OS.contextMenu([
          { label: 'Свернуть', action: () => this.minimize() },
          { label: this.snapState === 'max' ? 'Восстановить' : 'Развернуть', action: () => this.toggleMaximize() },
          { label: 'Прикрепить слева', action: () => this.snapTo('left') },
          { label: 'Прикрепить справа', action: () => this.snapTo('right') },
          { sep: true },
          { label: 'Закрыть', hotkey: 'Ctrl+W', action: () => this.close() },
        ], e.clientX, e.clientY);
      });

      // ресайз
      const dirs = ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'];
      dirs.forEach(d => {
        $('.rz-' + d, root).addEventListener('pointerdown', (e) => {
          if (e.button !== 0) return;
          this._resizeStart(e, d);
        });
      });
    }

    _dragStart(e) {
      e.preventDefault();
      const startX = e.clientX, startY = e.clientY;
      let r = this.rect();
      let started = false;
      // Aero Shake
      let lastDx = 0, dirChanges = 0, lastChangeTs = 0, shaken = false;

      const grabRatio = (startX - r.x) / r.w;

      const move = (ev) => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (!started && Math.abs(dx) < 3 && Math.abs(dy) < 3) return;

        // выход из снэпа при начале перетаскивания — окно «выпрыгивает» под курсор
        if (!started && this.snapState) {
          const pre = this.preSnap || { w: 720, h: 480 };
          this.snapState = null;
          this.root.classList.remove('maximized');
          r = {
            x: ev.clientX - pre.w * grabRatio,
            y: r.y,
            w: pre.w, h: pre.h,
          };
          this.setRect(r, false);
        }
        started = true;

        const a = workArea();
        this.setRect({
          x: r.x + dx,
          y: clamp(r.y + dy, a.y, a.y + a.h - 36),
          w: r.w, h: r.h,
        }, false);

        // Aero Shake: резкие смены направления
        const ndx = ev.movementX;
        if (Math.sign(ndx) !== 0 && Math.sign(ndx) !== Math.sign(lastDx) && Math.abs(ndx) > 9) {
          const t = performance.now();
          dirChanges = (t - lastChangeTs < 450) ? dirChanges + 1 : 1;
          lastChangeTs = t;
          if (dirChanges >= 6 && !shaken) {
            shaken = true;
            OS.wm.minimizeOthers(this);
          }
        }
        if (Math.abs(ndx) > 2) lastDx = ndx;

        const zone = zoneAt(ev.clientX, ev.clientY);
        if (zone) showSnapPreview(zone); else hideSnapPreview();
      };

      const up = (ev) => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        hideSnapPreview();
        if (!started) return;
        const zone = zoneAt(ev.clientX, ev.clientY);
        if (zone) this.snapTo(zone);
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    }

    _resizeStart(e, dir) {
      e.preventDefault();
      e.stopPropagation();
      this.focus();
      if (this.snapState) { this.snapState = null; this.root.classList.remove('maximized'); }
      const startX = e.clientX, startY = e.clientY;
      const r = this.rect();
      const minW = this.app.minWidth || 260, minH = this.app.minHeight || 160;
      const a = workArea();

      const move = (ev) => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        let { x, y, w, h } = r;
        if (dir.includes('e')) w = clamp(r.w + dx, minW, a.w - r.x);
        if (dir.includes('s')) h = clamp(r.h + dy, minH, a.y + a.h - r.y);
        if (dir.includes('w')) {
          w = clamp(r.w - dx, minW, r.x + r.w);
          x = r.x + r.w - w;
        }
        if (dir.includes('n')) {
          h = clamp(r.h - dy, minH, r.y + r.h - a.y);
          y = r.y + r.h - h;
        }
        this.setRect({ x, y, w, h }, false);
      };
      const up = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    }
  }

  /* ====================== SNAP LAYOUTS (Win11) ====================== */

  let snapLayoutTimer = null;
  let snapLayoutHideTimer = null;

  function showSnapLayouts(win, anchor) {
    hideSnapLayouts();
    const pop = el('div');
    pop.id = 'snap-layouts';
    const groups = [
      { cells: [{ z: 'left', c: '1 / 1 / 2 / 2' }, { z: 'right', c: '1 / 2 / 2 / 3' }], cols: '1fr 1fr', rows: '1fr' },
      { cells: [{ z: 'l23', c: '1 / 1 / 2 / 2' }, { z: 'r13', c: '1 / 2 / 2 / 3' }], cols: '2fr 1fr', rows: '1fr' },
      { cells: [{ z: 'tl', c: '1 / 1 / 2 / 2' }, { z: 'tr', c: '1 / 2 / 2 / 3' }, { z: 'bl', c: '2 / 1 / 3 / 2' }, { z: 'br', c: '2 / 2 / 3 / 3' }], cols: '1fr 1fr', rows: '1fr 1fr' },
      { cells: [{ z: 'max', c: '1 / 1 / 2 / 2' }], cols: '1fr', rows: '1fr' },
    ];
    groups.forEach(g => {
      const grp = el('div', 'sl-group');
      grp.style.gridTemplateColumns = g.cols;
      grp.style.gridTemplateRows = g.rows;
      g.cells.forEach(c => {
        const cell = el('div', 'sl-cell');
        cell.style.gridArea = c.c;
        cell.addEventListener('click', () => { win.snapTo(c.z); hideSnapLayouts(); });
        grp.appendChild(cell);
      });
      pop.appendChild(grp);
    });
    pop.addEventListener('mouseenter', () => clearTimeout(snapLayoutHideTimer));
    pop.addEventListener('mouseleave', scheduleHideSnapLayouts);
    document.body.appendChild(pop);
    const ar = anchor.getBoundingClientRect();
    const pw = pop.offsetWidth;
    pop.style.left = clamp(ar.left + ar.width / 2 - pw / 2, 8, innerWidth - pw - 8) + 'px';
    pop.style.top = (ar.bottom + 10) + 'px';
  }
  function scheduleHideSnapLayouts() {
    clearTimeout(snapLayoutHideTimer);
    snapLayoutHideTimer = setTimeout(hideSnapLayouts, 350);
  }
  function hideSnapLayouts() {
    clearTimeout(snapLayoutTimer);
    const p = document.getElementById('snap-layouts');
    if (p) p.remove();
  }

  /* ====================== ALT+TAB ====================== */

  let atState = null; // { items, idx, sticky }

  function altTabOpen(sticky) {
    const items = Array.from(windows.values());
    if (!items.length) return;
    items.sort((a, b) => (parseInt(b.root.style.zIndex) || 0) - (parseInt(a.root.style.zIndex) || 0));
    atState = { items, idx: items.length > 1 ? 1 : 0, sticky: !!sticky };
    renderAltTab();
  }
  function renderAltTab() {
    let elx = document.getElementById('alt-tab');
    if (!elx) {
      elx = el('div');
      elx.id = 'alt-tab';
      document.body.appendChild(elx);
    }
    elx.innerHTML = atState.items.map((w, i) => `
      <div class="at-item ${i === atState.idx ? 'active' : ''}" data-i="${i}">
        <div class="at-icon">${w.app.icon || OS.icons.fileGeneric}</div>
        <div class="at-name">${esc(w.getTitle() || w.app.name)}</div>
      </div>`).join('');
    elx.querySelectorAll('.at-item').forEach(item => {
      item.addEventListener('click', () => { atState.idx = +item.dataset.i; altTabCommit(); });
    });
  }
  function altTabNext(delta) {
    if (!atState) return;
    atState.idx = (atState.idx + delta + atState.items.length) % atState.items.length;
    renderAltTab();
  }
  function altTabCommit() {
    const elx = document.getElementById('alt-tab');
    if (elx) elx.remove();
    if (atState) {
      const w = atState.items[atState.idx];
      if (w) { w.restore(); w.focus(); }
    }
    atState = null;
  }
  function altTabCancel() {
    const elx = document.getElementById('alt-tab');
    if (elx) elx.remove();
    atState = null;
  }

  /* ====================== MISSION CONTROL ====================== */

  let missionOn = false;
  let missionData = [];

  function missionToggle() {
    if (missionOn) missionExit(null);
    else missionEnter();
  }
  function missionEnter() {
    const wins = Array.from(windows.values()).filter(w => !w.isMin);
    if (!wins.length) return;
    missionOn = true;
    const bg = el('div');
    bg.id = 'mission';
    bg.innerHTML = `<div class="ms-title">Просмотр задач — кликните окно, Esc — выход</div>`;
    bg.addEventListener('click', (e) => { if (e.target === bg || e.target.classList.contains('ms-title')) missionExit(null); });
    // внутрь #os: иначе окна (внутри stacking context #os) не поднимутся над оверлеем
    (document.getElementById('os') || document.body).appendChild(bg);

    const a = workArea();
    const n = wins.length;
    const cols = Math.ceil(Math.sqrt(n));
    const rows = Math.ceil(n / cols);
    const cellW = (a.w - 80) / cols;
    const cellH = (a.h - 120) / rows;

    missionData = wins.map((w, i) => {
      const r = w.rect();
      const col = i % cols, row = Math.floor(i / cols);
      const scale = Math.min(cellW * 0.9 / r.w, cellH * 0.85 / r.h, 0.92);
      const cx = a.x + 40 + col * cellW + cellW / 2;
      const cy = a.y + 70 + row * cellH + cellH / 2;
      const tx = cx - (r.x + r.w / 2);
      const ty = cy - (r.y + r.h / 2);

      const prevZ = w.root.style.zIndex;
      w.root.classList.add('in-mission');
      w.root.style.zIndex = 8901;
      w.root.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;

      const label = el('div', 'ms-label', esc(w.getTitle() || w.app.name));
      label.style.left = cx + 'px';
      label.style.top = (cy + (r.h * scale) / 2 + 12) + 'px';
      document.body.appendChild(label);

      const onPick = (e) => { e.stopPropagation(); missionExit(w); };
      w.root.addEventListener('click', onPick, true);
      return { w, prevZ, label, onPick };
    });
  }
  function missionExit(pick) {
    if (!missionOn) return;
    missionOn = false;
    missionData.forEach(({ w, prevZ, label, onPick }) => {
      w.root.style.transform = '';
      w.root.removeEventListener('click', onPick, true);
      label.remove();
      setTimeout(() => { w.root.classList.remove('in-mission'); w.root.style.zIndex = prevZ; }, 300);
    });
    missionData = [];
    const bg = document.getElementById('mission');
    if (bg) bg.remove();
    if (pick) { pick.restore(); pick.focus(); }
  }

  /* ====================== ГЛОБАЛЬНЫЕ КЛАВИШИ ====================== */

  document.addEventListener('keydown', (e) => {
    // Alt+Tab
    if (e.altKey && e.code === 'Tab') {
      e.preventDefault();
      if (!atState) altTabOpen(false);
      else altTabNext(e.shiftKey ? -1 : 1);
      return;
    }
    if (atState) {
      if (e.code === 'Escape') { e.preventDefault(); altTabCancel(); return; }
      if (atState.sticky) {
        if (e.code === 'ArrowRight') { e.preventDefault(); altTabNext(1); return; }
        if (e.code === 'ArrowLeft') { e.preventDefault(); altTabNext(-1); return; }
        if (e.code === 'Enter') { e.preventDefault(); altTabCommit(); return; }
      }
    }
    // Mission Control: F3 или Ctrl+Alt+M
    if (e.code === 'F3' || (e.ctrlKey && e.altKey && e.code === 'KeyM')) {
      e.preventDefault();
      missionToggle();
      return;
    }
    if (missionOn && e.code === 'Escape') { missionExit(null); return; }

    // Снэп с клавиатуры (Win+стрелки → Ctrl+Alt+стрелки)
    if (e.ctrlKey && e.altKey && focused && !focused.isMin) {
      if (e.code === 'ArrowLeft') { e.preventDefault(); focused.snapTo('left'); }
      else if (e.code === 'ArrowRight') { e.preventDefault(); focused.snapTo('right'); }
      else if (e.code === 'ArrowUp') { e.preventDefault(); focused.snapTo('max'); }
      else if (e.code === 'ArrowDown') {
        e.preventDefault();
        if (focused.snapState) focused.unsnap(true);
        else focused.minimize();
      }
    }
    // Ctrl+W — закрыть активное окно
    if (e.ctrlKey && !e.altKey && !e.shiftKey && e.code === 'KeyW' && focused) {
      e.preventDefault();
      focused.close();
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'Alt' && atState && !atState.sticky) {
      e.preventDefault();
      altTabCommit();
    }
  });
  window.addEventListener('blur', () => { if (atState && !atState.sticky) altTabCommit(); });

  window.addEventListener('resize', () => {
    const a = workArea();
    windows.forEach(w => {
      if (w.snapState) { w.setRect(snapRect(w.snapState), false); return; }
      const r = w.rect();
      w.setRect({
        x: clamp(r.x, -r.w + 120, a.w - 80),
        y: clamp(r.y, a.y, Math.max(a.y, a.y + a.h - 40)),
        w: Math.min(r.w, a.w), h: Math.min(r.h, a.h),
      }, false);
    });
  });

  /* ====================== ЭКСПОРТ ====================== */

  OS.wm = {
    createWindow: (app, args) => new Win(app, args),
    get focused() { return focused; },
    all: () => Array.from(windows.values()),
    windowsOf: (appId) => Array.from(windows.values()).filter(w => w.app.id === appId),
    byId: (id) => windows.get(id),
    minimizeOthers(keep) {
      windows.forEach(w => { if (w !== keep && !w.isMin) w.minimize(); });
    },
    /** «Показать стол»: свернуть всё; повторный вызов возвращает окна */
    showDesktop() {
      if (this._peek && this._peek.some(id => windows.has(id) && windows.get(id).isMin)) {
        this._peek.forEach(id => { const w = windows.get(id); if (w && w.isMin) w.restore(); });
        this._peek = null;
      } else {
        this._peek = Array.from(windows.values()).filter(w => !w.isMin).map(w => w.id);
        this._peek.forEach(id => windows.get(id).minimize());
      }
    },
    closeAll(appId) {
      Array.from(windows.values()).filter(w => !appId || w.app.id === appId).forEach(w => w.close());
    },
    missionToggle,
    altTabOpen: () => altTabOpen(true),
    workArea,
  };
})();

</script>
  <script>
/* === js/core/menubar.js === */
/* ============================================================
   Hiko OS · menubar — строка меню + всплывающие/контекстные меню
   ============================================================ */
(function () {
  'use strict';
  const { el, $, esc, clamp } = OS;

  /* ================= МЕНЮ (общий механизм) ================= */

  let openMenus = [];
  function closeMenus() {
    openMenus.forEach(m => m.remove());
    openMenus = [];
    document.querySelectorAll('.mb-item.open').forEach(i => i.classList.remove('open'));
    OS.emit('menus:closed');
  }

  /**
   * items: [{label, icon, hotkey, disabled, checked, action, sep}]
   */
  function buildMenu(items, x, y, opts) {
    const menu = el('div', 'menu');
    items.forEach(it => {
      if (it.sep) { menu.appendChild(el('div', 'menu-sep')); return; }
      const mi = el('div', 'menu-item' + (it.disabled ? ' disabled' : ''));
      mi.innerHTML = `${it.icon ? it.icon : ''}<span>${esc(it.label)}${it.checked ? ' ✓' : ''}</span>${it.hotkey ? `<span class="mi-hotkey">${esc(it.hotkey)}</span>` : ''}`;
      if (!it.disabled && it.action) {
        mi.addEventListener('click', (e) => {
          e.stopPropagation();
          closeMenus();
          setTimeout(() => it.action(), 10);
        });
      }
      menu.appendChild(mi);
    });
    document.body.appendChild(menu);
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    menu.style.left = clamp(x, 4, innerWidth - mw - 4) + 'px';
    menu.style.top = clamp(y, 4, innerHeight - mh - 4) + 'px';
    openMenus.push(menu);
    return menu;
  }

  OS.contextMenu = (items, x, y) => { closeMenus(); return buildMenu(items, x, y); };
  OS.closeMenus = closeMenus;

  document.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('.menu') && !e.target.closest('.mb-item')) closeMenus();
  }, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenus(); });

  /* ================= MENU BAR ================= */

  let activeAppName = 'Рабочий стол';
  let activeAppMenus = null;

  function render() {
    const bar = document.getElementById('menubar');
    bar.innerHTML = '';

    // — логотип
    const logo = el('div', 'mb-item mb-logo', OS.icons.logo);
    logo.addEventListener('click', (e) => {
      e.stopPropagation();
      if (logo.classList.contains('open')) { closeMenus(); return; }
      closeMenus();
      logo.classList.add('open');
      const r = logo.getBoundingClientRect();
      buildMenu([
        { label: 'Об этой системе', action: showAbout },
        { sep: true },
        { label: 'Настройки…', action: () => OS.launch('settings') },
        { label: 'Диспетчер задач…', action: () => OS.launch('taskmgr') },
        { sep: true },
        { label: 'Свернуть все окна', action: () => OS.wm.minimizeOthers(null) },
        { label: 'Обзор окон', hotkey: 'F3', action: () => OS.wm.missionToggle() },
        { sep: true },
        { label: 'Заблокировать экран', hotkey: 'Ctrl+Alt+L', action: () => OS.emit('session:lock') },
        { label: 'Перезагрузить…', action: () => OS.emit('session:restart') },
        { label: 'Выключить…', action: () => OS.emit('session:shutdown') },
      ], r.left, r.bottom + 6);
    });
    bar.appendChild(logo);

    // — имя активного приложения
    const appName = el('div', 'mb-item mb-appname', esc(activeAppName));
    bar.appendChild(appName);

    // — меню приложения
    const menus = activeAppMenus || defaultAppMenus();
    menus.forEach(m => {
      const item = el('div', 'mb-item', esc(m.title));
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        if (item.classList.contains('open')) { closeMenus(); return; }
        closeMenus();
        item.classList.add('open');
        const r = item.getBoundingClientRect();
        buildMenu(m.items, r.left, r.bottom + 6);
      });
      bar.appendChild(item);
    });

    bar.appendChild(el('div', 'mb-spacer'));

    // — правая часть
    const right = [
      { id: 'mb-assist', html: OS.icons.spark, title: 'Ассистент (Ctrl+Alt+H)', click: () => OS.assistant.toggle() },
      { id: 'mb-search', html: OS.icons.search, title: 'Поиск (Alt+Space)', click: () => OS.emit('spotlight:toggle') },
      { id: 'mb-mission', html: OS.icons.mission, title: 'Обзор окон (F3)', click: () => OS.wm.missionToggle() },
      { id: 'mb-wifi', html: OS.icons.wifi, title: 'Wi-Fi', click: (e, n) => toggleQuick(n, 'wifi') },
      { id: 'mb-vpn', html: OS.icons.globe, title: 'Обход блокировок включён', click: () => OS.emit('cc:toggle') },
      { id: 'mb-battery', html: `<span style="font-size:11.5px;font-weight:600;">100%</span>` + OS.icons.battery, title: 'Аккумулятор', click: () => OS.emit('cc:toggle') },
      { id: 'mb-cc', html: OS.icons.cc, title: 'Центр управления', click: () => OS.emit('cc:toggle') },
    ];
    right.forEach(cfg => {
      const item = el('div', 'mb-item', cfg.html);
      item.id = cfg.id;
      item.title = cfg.title || '';
      if (cfg.click) item.addEventListener('click', (e) => { e.stopPropagation(); cfg.click(e, item); });
      bar.appendChild(item);
    });
    updateWifiIcon();
    updateVpnIndicator();
    setupBattery();
    applyBatteryUI();

    // — часы
    const clock = el('div', 'mb-item mb-clock');
    clock.id = 'mb-clock';
    clock.addEventListener('click', (e) => { e.stopPropagation(); OS.emit('clockpanel:toggle'); });
    bar.appendChild(clock);
    tickClock();
  }

  function toggleQuick(node, key) {
    OS.settings.set(key, !OS.settings.get(key));
    updateWifiIcon();
  }
  function updateWifiIcon() {
    const w = document.getElementById('mb-wifi');
    if (w) w.style.opacity = OS.settings.get('wifi') ? '1' : '.35';
  }
  OS.on('settings:change', ({ key }) => { if (key === 'wifi') updateWifiIcon(); });

  /* --- индикатор обхода блокировок (показывается только когда включён) --- */
  function updateVpnIndicator() {
    const v = document.getElementById('mb-vpn');
    if (!v) return;
    const on = OS.net ? OS.net.isOn() : false;
    v.style.display = on ? '' : 'none';
    v.classList.toggle('on', on);
  }
  OS.on('net:state', updateVpnIndicator);
  OS.on('net:providers', updateVpnIndicator);

  /* --- живой аккумулятор (Battery API, с запасным «100%») --- */
  let batteryReady = false;
  let batteryState = null; // { pct, charging }
  function applyBatteryUI() {
    const b = document.getElementById('mb-battery');
    if (!b) return;
    if (!batteryState) return; // остаётся дефолтный «100%»
    const bolt = batteryState.charging ? `<span class="mb-bolt">${OS.icons.bolt}</span>` : '';
    b.innerHTML = `<span style="font-size:11.5px;font-weight:600;">${batteryState.pct}%</span>${bolt}${OS.icons.battery}`;
    b.title = 'Аккумулятор' + (batteryState.charging ? ' · заряжается' : '');
  }
  function setupBattery() {
    if (batteryReady || !navigator.getBattery) return;
    batteryReady = true;
    navigator.getBattery().then(bat => {
      const upd = () => { batteryState = { pct: Math.round(bat.level * 100), charging: bat.charging }; applyBatteryUI(); };
      bat.addEventListener('levelchange', upd);
      bat.addEventListener('chargingchange', upd);
      upd();
    }).catch(() => { /* нет доступа — оставим 100% */ });
  }

  const DOW = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const MON = ['янв.', 'февр.', 'мар.', 'апр.', 'мая', 'июн.', 'июл.', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'];
  function tickClock() {
    const c = document.getElementById('mb-clock');
    if (c) {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      c.textContent = `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}  ${hh}:${mm}`;
    }
    setTimeout(tickClock, 1000 * (60 - new Date().getSeconds()) + 500);
  }

  function defaultAppMenus() {
    return [
      {
        title: 'Файл',
        items: [
          { label: 'Новое окно', hotkey: 'Ctrl+N', action: () => { const w = OS.wm.focused; if (w) OS.launch(w.app.id); else OS.launch('finder'); } },
          { label: 'Закрыть окно', hotkey: 'Ctrl+W', action: () => OS.wm.focused?.close() },
        ],
      },
      {
        title: 'Окно',
        items: [
          { label: 'Свернуть', action: () => OS.wm.focused?.minimize() },
          { label: 'Развернуть / восстановить', action: () => OS.wm.focused?.toggleMaximize() },
          { sep: true },
          { label: 'Прикрепить слева', hotkey: 'Ctrl+Alt+←', action: () => OS.wm.focused?.snapTo('left') },
          { label: 'Прикрепить справа', hotkey: 'Ctrl+Alt+→', action: () => OS.wm.focused?.snapTo('right') },
          { sep: true },
          { label: 'Все окна (Обзор)', hotkey: 'F3', action: () => OS.wm.missionToggle() },
        ],
      },
      {
        title: 'Справка',
        items: [
          { label: 'О системе Hiko OS', action: showAbout },
          { label: 'Горячие клавиши', action: showHotkeys },
        ],
      },
    ];
  }

  function showAbout() {
    OS.dialog.alert(
      `Hiko OS ${OS.VERSION} «${OS.CODENAME}»`,
      `Персональная веб-ОС со своим характером\nЧистый JavaScript, ноль зависимостей\n\nПамять: localStorage (${OS.fmtBytes(OS.vfs.usage())} занято)\nПользователь: ${OS.settings.get('userName')}`,
      `<div style="width:52px;height:52px;color:var(--accent)">${OS.icons.logo}</div>`
    );
  }
  function showHotkeys() {
    OS.dialog.alert('Горячие клавиши',
      'Alt + Space — поиск\nAlt + Tab — переключение окон\nF3 — обзор окон\nCtrl + Alt + ←/→/↑/↓ — прикрепить окно\nCtrl + W — закрыть окно\nCtrl + Alt + L — заблокировать\nF2 — переименовать файл');
  }

  OS.on('wm:focus', (win) => {
    const newName = win ? win.app.name : 'Рабочий стол';
    const newMenus = win && win.app.menus ? win.app.menus(win) : null;
    if (newName !== activeAppName || newMenus !== activeAppMenus) {
      activeAppName = newName;
      activeAppMenus = newMenus;
      render();
    }
  });
  OS.on('wm:closed', () => { if (!OS.wm.focused) { activeAppName = 'Рабочий стол'; activeAppMenus = null; render(); } });

  OS.menubar = { render, showAbout, showHotkeys };
})();

  <script>
/* === js/core/dock.js === */
/* ============================================================
   Hiko OS · dock — панель приложений с магнификацией, индикаторами
   запущенных приложений, тултипами и контекстными меню
   ============================================================ */
(function () {
  'use strict';
  const { el, esc, clamp } = OS;

  let dockEl = null;
  let tipEl = null;

  function pinned() { return OS.settings.get('dockPinned', []); }

  function itemsModel() {
    const running = new Set(OS.wm.all().map(w => w.app.id));
    const list = [];
    // Launchpad всегда первый
    list.push({ special: 'launchpad' });
    pinned().forEach(id => {
      const app = OS.getApp(id);
      if (app) list.push({ app, running: running.has(id) });
    });
    // запущенные, но не закреплённые
    running.forEach(id => {
      if (!pinned().includes(id)) {
        const app = OS.getApp(id);
        if (app) list.push({ app, running: true });
      }
    });
    list.push({ special: 'sep' });
    list.push({ special: 'trash' });
    return list;
  }

  function render() {
    if (!dockEl) dockEl = document.getElementById('dock');
    dockEl.innerHTML = '';
    itemsModel().forEach(m => {
      if (m.special === 'sep') { dockEl.appendChild(el('div', 'dock-sep')); return; }

      const item = el('div', 'dock-item');
      let name, iconHtml;
      if (m.special === 'launchpad') {
        name = 'Приложения';
        iconHtml = OS.appTile(
          { from: '#aab6cf', to: '#616c85' },
          `<g fill="#fff" transform="translate(-31 -31) scale(0.62)">
            <rect x="14" y="14" width="20" height="20" rx="5"/><rect x="40" y="14" width="20" height="20" rx="5"/><rect x="66" y="14" width="20" height="20" rx="5"/>
            <rect x="14" y="40" width="20" height="20" rx="5"/><rect x="40" y="40" width="20" height="20" rx="5"/><rect x="66" y="40" width="20" height="20" rx="5"/>
            <rect x="14" y="66" width="20" height="20" rx="5"/><rect x="40" y="66" width="20" height="20" rx="5"/><rect x="66" y="66" width="20" height="20" rx="5"/>
          </g>`
        );
        item.addEventListener('click', () => OS.emit('launchpad:toggle'));
      } else if (m.special === 'trash') {
        name = 'Корзина';
        iconHtml = OS.vfs.trashCount() > 0 ? OS.icons.trashFull : OS.icons.trashEmpty;
        item.addEventListener('click', () => OS.launch('finder', { path: '/Trash' }));
        item.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          OS.contextMenu([
            { label: 'Открыть', action: () => OS.launch('finder', { path: '/Trash' }) },
            { label: 'Очистить корзину…', disabled: OS.vfs.trashCount() === 0, action: confirmEmptyTrash },
          ], e.clientX, e.clientY - 10);
        });
      } else {
        const app = m.app;
        name = app.name;
        iconHtml = app.icon || OS.icons.fileGeneric;
        if (m.running) item.classList.add('running');
        item.dataset.app = app.id;
        item.addEventListener('click', () => {
          const wins = OS.wm.windowsOf(app.id);
          if (!wins.length) {
            item.classList.add('bouncing');
            setTimeout(() => item.classList.remove('bouncing'), 1150);
            OS.launch(app.id);
          } else if (wins.length === 1) {
            const w = wins[0];
            if (w.isMin) { w.restore(); }
            else if (OS.wm.focused === w) w.minimize();
            else w.focus();
          } else {
            const w = wins.find(x => x.isMin) || wins[0];
            w.restore(); w.focus();
          }
        });
        item.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          const wins = OS.wm.windowsOf(app.id);
          const isPinned = pinned().includes(app.id);
          OS.contextMenu([
            ...wins.map(w => ({ label: '· ' + (w.getTitle() || app.name), action: () => { w.restore(); w.focus(); } })),
            ...(wins.length ? [{ sep: true }] : []),
            { label: 'Открыть' + (wins.length ? ' новое окно' : ''), disabled: !!(app.singleton && wins.length), action: () => OS.launch(app.id) },
            { label: isPinned ? 'Открепить от дока' : 'Закрепить в доке', action: () => {
                const p = pinned().slice();
                if (isPinned) p.splice(p.indexOf(app.id), 1);
                else p.push(app.id);
                OS.settings.set('dockPinned', p);
                render();
              } },
            ...(wins.length ? [
              { sep: true },
              { label: 'Свернуть все', action: () => wins.forEach(w => w.minimize()) },
              { label: 'Завершить', action: () => wins.forEach(w => w.close()) },
            ] : []),
          ], e.clientX, e.clientY - 10);
        });
      }

      item.innerHTML = `<div class="dock-icon">${iconHtml}</div><div class="dock-dot"></div>` + item.innerHTML;
      // тултип
      item.addEventListener('mouseenter', () => showTip(item, name));
      item.addEventListener('mouseleave', hideTip);
      dockEl.appendChild(item);
    });
  }

  async function confirmEmptyTrash() {
    const ok = await OS.dialog.confirm('Очистить корзину?',
      `Объектов: ${OS.vfs.trashCount()}. Это действие необратимо.`,
      { okLabel: 'Очистить', danger: true });
    if (ok) { OS.vfs.emptyTrash(); OS.beep(320, .12); }
  }

  function showTip(item, text) {
    hideTip();
    tipEl = el('div', 'dock-tip', esc(text));
    document.body.appendChild(tipEl);
    const r = item.getBoundingClientRect();
    tipEl.style.left = (r.left + r.width / 2) + 'px';
    tipEl.style.top = (r.top - 38) + 'px';
  }
  function hideTip() { if (tipEl) { tipEl.remove(); tipEl = null; } }

  /* --- магнификация (плавная, следует за курсором мгновенно) --- */
  const RANGE = 150;      // радиус влияния курсора, px
  const MAX_SCALE = 1.55; // масштаб иконки прямо под курсором
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  function wireMagnify() {
    let centers = [];   // [{ ic, cx }] — неискажённые центры иконок (cx устойчив к scale: origin bottom-center)
    let raf = 0;
    let lastX = 0;

    const active = () => OS.settings.get('dockMagnify') && !reduceMotion.matches;

    function computeCenters() {
      const icons = dockEl.querySelectorAll('.dock-item .dock-icon');
      centers = Array.from(icons).map(ic => {
        const r = ic.getBoundingClientRect();
        return { ic, cx: r.left + r.width / 2 };
      });
    }

    function apply() {
      raf = 0;
      for (const { ic, cx } of centers) {
        const dist = Math.abs(lastX - cx);
        // косинусный колокол с чуть заострённым пиком — «как в macOS»
        const s = dist > RANGE ? 1 : 1 + (MAX_SCALE - 1) * Math.pow(Math.cos((dist / RANGE) * (Math.PI / 2)), 1.7);
        ic.style.transform = `translateY(${(-(s - 1) * 9).toFixed(1)}px) scale(${s.toFixed(3)})`;
      }
    }

    dockEl.addEventListener('mouseenter', () => {
      if (!active()) return;
      computeCenters();
    });
    dockEl.addEventListener('mousemove', (e) => {
      if (!active()) return;
      // кеш центров устарел (док перерисовался) — пересчитать
      if (centers.length !== dockEl.querySelectorAll('.dock-item .dock-icon').length) computeCenters();
      lastX = e.clientX;
      dockEl.classList.add('magnifying');           // мгновенное следование, без transition-лага
      if (!raf) raf = requestAnimationFrame(apply);
    });
    dockEl.addEventListener('mouseleave', () => {
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      dockEl.classList.remove('magnifying');         // плавный возврат по CSS-transition
      resetMagnify();
      centers = [];
    });
  }

  function resetMagnify() {
    if (!dockEl) return;
    dockEl.querySelectorAll('.dock-item .dock-icon').forEach(ic => { ic.style.transform = ''; });
  }

  /* --- обновления --- */
  OS.on('wm:opened', render);
  OS.on('wm:closed', () => { hideTip(); render(); });
  OS.on('apps:registered', OS.debounce(render, 50));
  OS.on('vfs:change', ({ path, action }) => {
    if (path.startsWith('/Trash') || action === 'empty-trash' || action === 'rm') render();
  });
  OS.on('settings:change', ({ key }) => { if (key === 'dockPinned' || key === 'dockSize') render(); });

  OS.dock = {
    init() { render(); wireMagnify(); },
    render,
    bounce(appId) {
      const item = dockEl?.querySelector(`.dock-item[data-app="${appId}"]`);
      if (item) { item.classList.add('bouncing'); setTimeout(() => item.classList.remove('bouncing'), 1150); }
    },
  };
})();

</script>
  <script>
/* === js/core/desktop.js === */
/* ============================================================
   Hiko OS · desktop — иконки рабочего стола, рамка выделения,
   переименование, контекстные меню, перетаскивание иконок
   ============================================================ */
(function () {
  'use strict';
  const { el, esc, clamp } = OS;

  const GRID_X = 104, GRID_Y = 96, PAD = 14;
  let deskEl = null;
  let selection = new Set();  // пути выделенных
  let clipboard = null;       // { paths: [], cut: bool }

  function iconPositions() { return OS.settings.get('desktopIconPos', {}); }
  function savePos(pos) { OS.settings.set('desktopIconPos', pos); }

  function autoPlace(index) {
    const h = window.innerHeight - 30 - 90;
    const perCol = Math.max(1, Math.floor(h / GRID_Y));
    const col = Math.floor(index / perCol);
    const row = index % perCol;
    return { x: window.innerWidth - PAD - GRID_X * (col + 1) + 4, y: PAD + row * GRID_Y };
  }

  function render() {
    if (!deskEl) return;
    deskEl.querySelectorAll('.di').forEach(n => n.remove());

    let items = [];
    try { items = OS.vfs.list('/Desktop'); } catch (e) { items = []; }

    const pos = iconPositions();
    items.forEach((item, i) => {
      const p = pos[item.name] || autoPlace(i);
      const di = el('div', 'di');
      di.dataset.path = item.path;
      di.dataset.name = item.name;
      di.style.left = clamp(p.x, 0, innerWidth - 80) + 'px';
      di.style.top = clamp(p.y, 0, innerHeight - 140) + 'px';
      di.innerHTML = `
        <div class="di-icon">${OS.fileIcon(item)}</div>
        <div class="di-label">${esc(item.name)}</div>`;
      if (selection.has(item.path)) di.classList.add('selected');
      wireIcon(di, item);
      deskEl.appendChild(di);
    });

    // Корзина — системная иконка
    const trashCount = OS.vfs.trashCount();
    const tp = pos['␀trash'] || autoPlace(items.length);
    const trash = el('div', 'di di-trash');
    trash.style.left = clamp(tp.x, 0, innerWidth - 80) + 'px';
    trash.style.top = clamp(tp.y, 0, innerHeight - 140) + 'px';
    trash.innerHTML = `
      <div class="di-icon">${trashCount ? OS.icons.trashFull : OS.icons.trashEmpty}</div>
      <div class="di-label">Корзина</div>`;
    trash.addEventListener('dblclick', () => OS.launch('finder', { path: '/Trash' }));
    trash.addEventListener('contextmenu', (e) => {
      e.preventDefault(); e.stopPropagation();
      OS.contextMenu([
        { label: 'Открыть', action: () => OS.launch('finder', { path: '/Trash' }) },
        { label: 'Очистить корзину…', disabled: !trashCount, action: async () => {
            const ok = await OS.dialog.confirm('Очистить корзину?', `Объектов: ${trashCount}. Это действие необратимо.`, { okLabel: 'Очистить', danger: true });
            if (ok) OS.vfs.emptyTrash();
          } },
      ], e.clientX, e.clientY);
    });
    wireDrag(trash, '␀trash');
    deskEl.appendChild(trash);
  }

  function wireIcon(di, item) {
    di.addEventListener('pointerdown', (e) => {
      if (e.button === 0 && !e.ctrlKey && !selection.has(item.path)) {
        selection.clear();
        selection.add(item.path);
        refreshSelection();
      } else if (e.ctrlKey) {
        if (selection.has(item.path)) selection.delete(item.path); else selection.add(item.path);
        refreshSelection();
      }
    });
    di.addEventListener('dblclick', () => OS.openFile(item.path));
    di.addEventListener('contextmenu', (e) => {
      e.preventDefault(); e.stopPropagation();
      if (!selection.has(item.path)) { selection.clear(); selection.add(item.path); refreshSelection(); }
      OS.contextMenu([
        { label: 'Открыть', action: () => OS.openFile(item.path) },
        { sep: true },
        { label: 'Переименовать', hotkey: 'F2', action: () => startRename(di, item) },
        { label: 'Копировать', hotkey: 'Ctrl+C', action: () => { clipboard = { paths: [...selection], cut: false }; } },
        { label: 'Вырезать', hotkey: 'Ctrl+X', action: () => { clipboard = { paths: [...selection], cut: true }; } },
        { sep: true },
        { label: 'Переместить в корзину', hotkey: 'Del', action: deleteSelection },
      ], e.clientX, e.clientY);
    });
    wireDrag(di, item.name);
  }

  function wireDrag(di, key) {
    di.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const startX = e.clientX, startY = e.clientY;
      const origX = parseFloat(di.style.left), origY = parseFloat(di.style.top);
      let moved = false;
      const move = (ev) => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (!moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
        moved = true;
        di.style.left = clamp(origX + dx, 0, innerWidth - 80) + 'px';
        di.style.top = clamp(origY + dy, 0, innerHeight - 140) + 'px';
      };
      const up = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        if (moved) {
          const pos = iconPositions();
          pos[key] = { x: parseFloat(di.style.left), y: parseFloat(di.style.top) };
          savePos(pos);
        }
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  }

  function refreshSelection() {
    deskEl.querySelectorAll('.di').forEach(di => {
      di.classList.toggle('selected', selection.has(di.dataset.path));
    });
  }

  function startRename(di, item) {
    const label = di.querySelector('.di-label');
    const input = el('input', 'di-rename');
    input.value = item.name;
    label.replaceWith(input);
    input.focus();
    const dot = item.name.lastIndexOf('.');
    input.setSelectionRange(0, dot > 0 ? dot : item.name.length);
    const commit = () => {
      const newName = input.value.trim();
      if (newName && newName !== item.name && !newName.includes('/')) {
        try { OS.vfs.mv(item.path, '/Desktop/' + newName); }
        catch (err) { OS.dialog.alert('Не удалось переименовать', err.message); }
      }
      render();
    };
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') render();
    });
    input.addEventListener('blur', commit);
    input.addEventListener('pointerdown', (e) => e.stopPropagation());
  }

  async function deleteSelection() {
    const paths = [...selection];
    selection.clear();
    for (const p of paths) {
      try { OS.vfs.rm(p, { toTrash: true }); } catch (e) { /* системные пропускаем */ }
    }
    if (paths.length) OS.beep(500, .08);
  }

  function pasteToDesktop() {
    if (!clipboard) return;
    for (const p of clipboard.paths) {
      try {
        const name = OS.vfs.nameOf(p);
        const dest = '/Desktop/' + OS.vfs.uniqueName('/Desktop', name);
        if (clipboard.cut) OS.vfs.mv(p, dest); else OS.vfs.cp(p, dest);
      } catch (e) { OS.dialog.alert('Не удалось вставить', e.message); }
    }
    if (clipboard.cut) clipboard = null;
  }

  /* --- фон рабочего стола: рамка выделения + контекстное меню --- */
  function wireDesktop() {
    const rubber = document.getElementById('rubber');

    deskEl.addEventListener('pointerdown', (e) => {
      if (e.target !== deskEl || e.button !== 0) return;
      selection.clear();
      refreshSelection();
      const sx = e.clientX, sy = e.clientY;
      let active = false;
      const move = (ev) => {
        const x = Math.min(sx, ev.clientX), y = Math.min(sy, ev.clientY);
        const w = Math.abs(ev.clientX - sx), h = Math.abs(ev.clientY - sy);
        if (!active && (w > 5 || h > 5)) { active = true; rubber.style.display = 'block'; }
        if (!active) return;
        Object.assign(rubber.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
        // пересечение с иконками
        deskEl.querySelectorAll('.di[data-path]').forEach(di => {
          const r = di.getBoundingClientRect();
          const hit = r.left < x + w && r.right > x && r.top < y + h && r.bottom > y;
          if (hit) selection.add(di.dataset.path); else selection.delete(di.dataset.path);
        });
        refreshSelection();
      };
      const up = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        rubber.style.display = 'none';
        rubber.style.width = '0px'; rubber.style.height = '0px';
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });

    deskEl.addEventListener('contextmenu', (e) => {
      if (e.target !== deskEl) return;
      e.preventDefault();
      OS.contextMenu([
        { label: 'Новая папка', action: async () => {
            const name = OS.vfs.uniqueName('/Desktop', 'Новая папка');
            OS.vfs.mkdir('/Desktop/' + name);
          } },
        { label: 'Новый документ', action: async () => {
            const name = OS.vfs.uniqueName('/Desktop', 'Документ.txt');
            OS.vfs.write('/Desktop/' + name, '');
          } },
        { sep: true },
        { label: 'Вставить', hotkey: 'Ctrl+V', disabled: !clipboard, action: pasteToDesktop },
        { sep: true },
        { label: 'Добавить виджет…', action: () => OS.widgets.openGallery() },
        { label: 'Выстроить иконки', action: () => { savePos({}); render(); } },
        { label: 'Сменить обои…', action: () => OS.launch('settings', { section: 'wallpaper' }) },
        { sep: true },
        { label: 'Настройки…', action: () => OS.launch('settings') },
      ], e.clientX, e.clientY);
    });

    // клавиатура (когда фокус не в окне)
    document.addEventListener('keydown', (e) => {
      const inWindow = e.target.closest && (e.target.closest('.window') || e.target.closest('input') || e.target.closest('textarea') || e.target.closest('[contenteditable]'));
      if (inWindow) return;
      if (e.key === 'Delete' && selection.size) { e.preventDefault(); deleteSelection(); }
      if (e.key === 'F2' && selection.size === 1) {
        e.preventDefault();
        const path = [...selection][0];
        const di = deskEl.querySelector(`.di[data-path="${CSS.escape(path)}"]`);
        const st = OS.vfs.stat(path);
        if (di && st) startRename(di, { name: st.name, path });
      }
      if (e.ctrlKey && e.code === 'KeyC' && selection.size) { clipboard = { paths: [...selection], cut: false }; }
      if (e.ctrlKey && e.code === 'KeyX' && selection.size) { clipboard = { paths: [...selection], cut: true }; }
      if (e.ctrlKey && e.code === 'KeyV') pasteToDesktop();
    });
  }

  OS.on('vfs:change', OS.debounce(() => render(), 80));
  window.addEventListener('resize', OS.debounce(() => render(), 200));

  OS.desktop = {
    init() {
      deskEl = document.getElementById('desktop');
      wireDesktop();
      render();
    },
    render,
  };
})();

</script>
  <script>
/* === js/core/overlays.js === */
/* ============================================================
   Hiko OS · overlays — поиск, экран приложений, быстрые настройки,
   уведомления (тосты + центр), календарь
   ============================================================ */
(function () {
  'use strict';
  const { el, esc } = OS;

  // плавное закрытие панели: класс -> удаление
  function animateOut(node, done) {
    if (!node) { if (done) done(); return; }
    node.classList.add('panel-out');
    setTimeout(() => { node.remove(); if (done) done(); }, 170);
  }

  /* ==================== SPOTLIGHT ==================== */

  let spotEl = null;
  let spotItems = [];
  let spotIdx = 0;

  function spotlightToggle() {
    if (spotEl) { spotlightClose(); return; }
    closeAllPanels();
    spotEl = el('div');
    spotEl.id = 'spotlight';
    spotEl.innerHTML = `
      <div class="spot-row">${OS.icons.search}<input type="text" placeholder="Поиск приложений и файлов…" spellcheck="false"></div>
      <div class="spot-results hidden"></div>`;
    document.body.appendChild(spotEl);
    const input = spotEl.querySelector('input');
    input.focus();
    input.addEventListener('input', () => spotSearch(input.value));
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') spotlightClose();
      else if (e.key === 'ArrowDown') { e.preventDefault(); spotMove(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); spotMove(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); spotRun(); }
    });
    document.addEventListener('pointerdown', spotOutside, true);
  }
  function spotOutside(e) { if (spotEl && !spotEl.contains(e.target)) spotlightClose(); }
  function spotlightClose() {
    animateOut(spotEl);
    spotEl = null;
    spotItems = [];
    document.removeEventListener('pointerdown', spotOutside, true);
  }

  function spotSearch(q) {
    const box = spotEl.querySelector('.spot-results');
    q = q.trim().toLowerCase();
    if (!q) { box.classList.add('hidden'); box.innerHTML = ''; spotItems = []; return; }

    // живой калькулятор: «2+2*3» считается прямо в поиске
    const calcItems = [];
    const expr = q.replace(/,/g, '.').replace(/[×х]/g, '*').replace(/[÷:]/g, '/').replace(/\s+/g, '');
    if (/^[\d+\-*/().%]+$/.test(expr) && /\d/.test(expr) && /[+\-*/]/.test(expr.slice(1))) {
      try {
        const val = Function('"use strict";return (' + expr + ')')();
        if (typeof val === 'number' && isFinite(val)) {
          const pretty = String(+val.toPrecision(12)).replace('.', ',');
          calcItems.push({
            kind: 'calc', label: `= ${pretty}`, sub: 'Enter — скопировать результат',
            icon: `<div style="color:var(--accent)">${OS.icons.logo}</div>`,
            run: () => {
              try { navigator.clipboard.writeText(pretty); } catch (e) { /* — */ }
              OS.notify({ title: 'Калькулятор', body: `${q} = ${pretty} · скопировано`, appId: 'calculator' });
            },
          });
        }
      } catch (e) { /* не выражение — молчим */ }
    }

    const apps = OS.allApps()
      .filter(a => a.name.toLowerCase().includes(q) || a.id.includes(q))
      .sort((a, b) => Number(b.name.toLowerCase().startsWith(q)) - Number(a.name.toLowerCase().startsWith(q)))
      .slice(0, 5)
      .map(a => ({ kind: 'app', label: a.name, sub: 'Приложение', icon: a.icon || OS.icons.fileGeneric, run: () => OS.launch(a.id) }));

    const files = OS.vfs.search(q, 8).filter(f => !f.path.startsWith('/Trash'))
      .map(f => ({ kind: 'file', label: f.name, sub: f.path, icon: OS.fileIcon(f), run: () => OS.openFile(f.path) }));

    const actions = [];
    if ('выключить'.includes(q) || 'shutdown'.includes(q)) actions.push({ kind: 'act', label: 'Выключить', sub: 'Действие', icon: `<div style="color:var(--accent)">${OS.icons.power}</div>`, run: () => OS.emit('session:shutdown') });
    if ('заблокировать'.includes(q) || 'lock'.includes(q)) actions.push({ kind: 'act', label: 'Заблокировать экран', sub: 'Действие', icon: `<div style="color:var(--accent)">${OS.icons.moon}</div>`, run: () => OS.emit('session:lock') });

    spotItems = [...calcItems, ...apps, ...files, ...actions];
    spotIdx = 0;
    if (!spotItems.length) {
      box.innerHTML = `<div class="spot-cat">Ничего не найдено</div>`;
      box.classList.remove('hidden');
      return;
    }
    let html = '';
    let lastKind = null;
    spotItems.forEach((it, i) => {
      if (it.kind !== lastKind) {
        html += `<div class="spot-cat">${it.kind === 'calc' ? 'Калькулятор' : it.kind === 'app' ? 'Приложения' : it.kind === 'file' ? 'Файлы' : 'Действия'}</div>`;
        lastKind = it.kind;
      }
      html += `<div class="spot-item ${i === spotIdx ? 'active' : ''}" data-i="${i}">
        <div class="sp-icon">${it.icon}</div>
        <div><div class="sp-name">${esc(it.label)}</div><div class="sp-sub">${esc(it.sub)}</div></div>
      </div>`;
    });
    box.innerHTML = html;
    box.classList.remove('hidden');
    box.querySelectorAll('.spot-item').forEach(n => {
      n.addEventListener('click', () => { spotIdx = +n.dataset.i; spotRun(); });
      n.addEventListener('mousemove', () => {
        if (spotIdx !== +n.dataset.i) {
          spotIdx = +n.dataset.i;
          box.querySelectorAll('.spot-item').forEach(m => m.classList.toggle('active', +m.dataset.i === spotIdx));
        }
      });
    });
  }
  function spotMove(d) {
    if (!spotItems.length) return;
    spotIdx = (spotIdx + d + spotItems.length) % spotItems.length;
    spotEl.querySelectorAll('.spot-item').forEach(m => m.classList.toggle('active', +m.dataset.i === spotIdx));
    const act = spotEl.querySelector('.spot-item.active');
    if (act) act.scrollIntoView({ block: 'nearest' });
  }
  function spotRun() {
    const it = spotItems[spotIdx];
    if (!it) return;
    spotlightClose();
    it.run();
  }

  /* ==================== LAUNCHPAD ==================== */

  let lpEl = null;
  function launchpadToggle() {
    if (lpEl) { launchpadClose(); return; }
    closeAllPanels();
    spotlightClose();
    lpEl = el('div');
    lpEl.id = 'launchpad';
    lpEl.innerHTML = `
      <div class="lp-search">${OS.icons.search}<input type="text" placeholder="Поиск" spellcheck="false"></div>
      <div class="lp-grid"></div>`;
    document.body.appendChild(lpEl);
    const input = lpEl.querySelector('input');
    const grid = lpEl.querySelector('.lp-grid');
    const fill = (q) => {
      q = (q || '').toLowerCase();
      grid.innerHTML = '';
      OS.allApps()
        .filter(a => !a.hidden && (!q || a.name.toLowerCase().includes(q)))
        .sort((a, b) => a.name.localeCompare(b.name, 'ru'))
        .forEach((a, i) => {
          const item = el('div', 'lp-app', `
            <div class="lp-icon">${a.icon || OS.icons.fileGeneric}</div>
            <div class="lp-name">${esc(a.name)}</div>`);
          item.style.setProperty('--i', i);
          item.addEventListener('click', () => { launchpadClose(); OS.launch(a.id); });
          grid.appendChild(item);
        });
    };
    grid.classList.add('stagger');
    setTimeout(() => grid.classList.remove('stagger'), 650);
    fill('');
    input.focus();
    input.addEventListener('input', () => fill(input.value));
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') launchpadClose();
      if (e.key === 'Enter') {
        const first = grid.querySelector('.lp-app');
        if (first) first.click();
      }
    });
    lpEl.addEventListener('click', (e) => { if (e.target === lpEl || e.target.classList.contains('lp-grid')) launchpadClose(); });
  }
  function launchpadClose() {
    if (!lpEl) return;
    const n = lpEl;
    lpEl = null;
    n.classList.add('closing');
    setTimeout(() => n.remove(), 190);
  }

  /* ==================== ЦЕНТР УПРАВЛЕНИЯ (боковая панель справа) ==================== */

  const SPK = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M 14 38 L 34 38 L 56 20 L 56 80 L 34 62 L 14 62 Z" fill="currentColor"/><path d="M 68 36 C 76 44 76 56 68 64 M 76 28 C 90 42 90 58 76 72" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg>`;

  const MON_FULL_CC = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  const greetWord = (h) => h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';

  function calendarHTML() {
    const d = new Date();
    const year = d.getFullYear(), month = d.getMonth(), today = d.getDate();
    const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;
    const daysIn = new Date(year, month + 1, 0).getDate();
    const daysPrev = new Date(year, month, 0).getDate();
    let cells = '';
    ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].forEach(dw => cells += `<div class="cal-dow">${dw}</div>`);
    for (let i = 0; i < firstDow; i++) cells += `<div class="cal-day other">${daysPrev - firstDow + 1 + i}</div>`;
    for (let day = 1; day <= daysIn; day++) cells += `<div class="cal-day ${day === today ? 'today' : ''}">${day}</div>`;
    const tail = (7 - (firstDow + daysIn) % 7) % 7;
    for (let i = 1; i <= tail; i++) cells += `<div class="cal-day other">${i}</div>`;
    return `<div class="cal-head"><span class="cal-month">${MON_FULL_CC[month]}</span><span>${year}</span></div><div class="cal-grid">${cells}</div>`;
  }
  function notifHTML() {
    const notifs = OS.getNotifications();
    return `<div class="notif-head"><span>Уведомления</span>${notifs.length ? '<span class="notif-clear">Очистить</span>' : ''}</div>
      <div class="notif-list">${notifs.length ? notifs.map(n => `
        <div class="notif-item"><div class="t-icon">${appIconOf(n.appId)}</div>
          <div><div class="t-title">${esc(n.title)}</div><div class="t-body">${esc(n.body)}</div></div></div>`).join('')
        : `<div class="notif-empty">Нет новых уведомлений</div>`}</div>`;
  }

  let ccEl = null;
  let ccTick = null;

  function ccToggle() {
    if (ccEl) { ccClose(); return; }
    closeAllPanels();
    ccEl = el('div');
    ccEl.id = 'control-center';
    document.body.appendChild(ccEl);
    renderCC();
    startCCTick();
    setTimeout(() => document.addEventListener('pointerdown', ccOutside, true), 0);
  }

  function renderCC() {
    if (!ccEl) return;
    const s = OS.settings;
    const theme = document.documentElement.getAttribute('data-theme');
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
    const vpnOn = OS.net ? OS.net.isOn() : false;
    const provs = OS.net ? OS.net.providers() : [];
    const vp = provs.length ? (provs.find(x => x.id === OS.net.active()) || provs[0]) : null;

    const tile = (t, on, ic, nm, st) =>
      `<div class="cc-tile ${on ? 'on' : ''}" data-t="${t}"><div class="ic">${ic}</div>
        <div class="tx"><div class="nm">${nm}</div><div class="st">${st}</div></div></div>`;

    ccEl.innerHTML = `
      <div class="cc-header">
        <div><div class="cc-clock">${hh}:${mm}</div>
          <div class="cc-sub">${esc(d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }))}</div></div>
        <div class="cc-greet">${esc(greetWord(d.getHours()))}${s.get('userName') ? '<br>' + esc(s.get('userName')) : ''}</div>
      </div>

      <div class="cc-grid">
        ${tile('wifi', s.get('wifi'), OS.icons.wifi, 'Wi-Fi', s.get('wifi') ? 'Hiko_5G' : 'Выкл.')}
        ${tile('bluetooth', s.get('bluetooth'), OS.icons.bluetooth, 'Bluetooth', s.get('bluetooth') ? 'Вкл.' : 'Выкл.')}
        ${tile('dnd', s.get('dnd'), OS.icons.moon, 'Не беспокоить', s.get('dnd') ? 'Вкл.' : 'Выкл.')}
        ${tile('nightlight', s.get('nightLight'), OS.icons.sun, 'Тёплый свет', s.get('nightLight') ? 'Вкл.' : 'Выкл.')}
        ${tile('theme', theme === 'dark', theme === 'dark' ? OS.icons.moon : OS.icons.sun, 'Тема', theme === 'dark' ? 'Тёмная' : 'Светлая')}
        ${tile('edge', s.get('ccEdgeReveal'), OS.icons.cc, 'Панель у края', s.get('ccEdgeReveal') ? 'Вкл.' : 'Выкл.')}
      </div>

      <div class="cc-vpn ${vpnOn ? 'on' : ''}">
        <div class="ic">${OS.icons.globe}</div>
        <div class="tx"><div class="nm">Обход блокировок</div>
          <div class="st">${vp ? (vpnOn ? 'Включён · ' + esc(vp.name) : 'Готов · ' + esc(vp.name)) : 'Нет модуля обхода'}</div></div>
        ${vp ? `<div class="ui-switch ${vpnOn ? 'on' : ''}" data-vpn="1"></div>`
             : `<button class="ui-btn cc-vpn-get">Модуль…</button>`}
      </div>

      <div class="cc-sliders">
        <div class="cc-slider">${OS.icons.sun}<input class="ui-slider" data-s="brightness" type="range" min="40" max="100" value="${Math.round(s.get('brightness') * 100)}"></div>
        <div class="cc-slider">${SPK}<input class="ui-slider" data-s="volume" type="range" min="0" max="100" value="${s.get('volume')}"></div>
      </div>

      <div class="cc-actions">
        <div class="cc-act" data-a="spotlight">${OS.icons.search}<span>Поиск</span></div>
        <div class="cc-act" data-a="mission">${OS.icons.mission}<span>Окна</span></div>
        <div class="cc-act" data-a="assistant">${OS.icons.spark}<span>Ави</span></div>
        <div class="cc-act" data-a="lock">${OS.icons.lock}<span>Замок</span></div>
      </div>

      <div class="cc-cal">${calendarHTML()}</div>
      <div class="cc-notif">${notifHTML()}</div>`;

    bindCC();
  }

  function bindCC() {
    const s = OS.settings;
    ccEl.querySelectorAll('.cc-tile[data-t]').forEach(row => row.addEventListener('click', () => {
      const t = row.dataset.t;
      if (t === 'theme') { const cur = document.documentElement.getAttribute('data-theme'); s.set('theme', cur === 'dark' ? 'light' : 'dark'); }
      else if (t === 'nightlight') s.set('nightLight', !s.get('nightLight'));
      else if (t === 'edge') s.set('ccEdgeReveal', !s.get('ccEdgeReveal'));
      else s.set(t, !s.get(t));
      renderCC();
    }));
    const sw = ccEl.querySelector('[data-vpn]');
    if (sw) sw.addEventListener('click', async () => { await OS.net.toggle(); renderCC(); });
    const getBtn = ccEl.querySelector('.cc-vpn-get');
    if (getBtn) getBtn.addEventListener('click', ccVpnGet);
    const br = ccEl.querySelector('[data-s="brightness"]');
    if (br) br.addEventListener('input', (e) => s.set('brightness', (+e.target.value) / 100));
    const vol = ccEl.querySelector('[data-s="volume"]');
    if (vol) vol.addEventListener('change', (e) => { s.set('volume', +e.target.value); OS.beep(660, .1); });
    ccEl.querySelectorAll('.cc-act[data-a]').forEach(a => a.addEventListener('click', () => {
      const act = a.dataset.a;
      ccClose();
      if (act === 'spotlight') spotlightToggle();
      else if (act === 'mission') OS.wm.missionToggle();
      else if (act === 'assistant') OS.assistant.toggle();
      else if (act === 'lock') OS.emit('session:lock');
    }));
    const clr = ccEl.querySelector('.notif-clear');
    if (clr) clr.addEventListener('click', () => { OS.clearNotifications(); refreshNotif(); });
  }

  async function ccVpnGet() {
    ccClose();
    const demo = await OS.dialog.confirm('Модуль обхода',
      'Скачай последнюю версию модуля обхода с GitHub и поставь её через Установщик («По ссылке…») — Hiko сам подхватит переключатель.\n\nИли поставить встроенный демо-модуль прямо сейчас, чтобы увидеть, как это работает?',
      { okLabel: 'Поставить демо', cancelLabel: 'Открыть Установщик' });
    if (demo) { OS.installer.installTrusted(OS.net.DEMO_CODE, 'obhod-demo.js'); }
    else OS.launch('installer');
  }

  function refreshNotif() {
    if (!ccEl) return;
    const n = ccEl.querySelector('.cc-notif');
    if (!n) return;
    n.innerHTML = notifHTML();
    const clr = n.querySelector('.notif-clear');
    if (clr) clr.addEventListener('click', () => { OS.clearNotifications(); refreshNotif(); });
  }

  function startCCTick() {
    stopCCTick();
    ccTick = setInterval(() => {
      if (!ccEl) { stopCCTick(); return; }
      const d = new Date();
      const c = ccEl.querySelector('.cc-clock');
      if (c) c.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }, 15000);
  }
  function stopCCTick() { if (ccTick) { clearInterval(ccTick); ccTick = null; } }

  function ccOutside(e) {
    if (ccEl && !ccEl.contains(e.target) &&
        !e.target.closest('#mb-cc') && !e.target.closest('#mb-clock') &&
        !e.target.closest('#mb-vpn') && !e.target.closest('#mb-battery')) ccClose();
  }
  function ccClose() {
    stopCCTick();
    animateOut(ccEl);
    ccEl = null;
    document.removeEventListener('pointerdown', ccOutside, true);
  }

  OS.on('net:providers', () => { if (ccEl) renderCC(); });
  OS.on('net:state', () => { if (ccEl) renderCC(); });
  OS.on('os:notify', refreshNotif);
  OS.on('os:notify-cleared', refreshNotif);

  /* ==================== ЧАСЫ / КАЛЕНДАРЬ / УВЕДОМЛЕНИЯ ==================== */

  let cpEl = null;
  const MON_FULL = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  function clockPanelToggle() {
    if (cpEl) { cpClose(); return; }
    closeAllPanels();
    cpEl = el('div');
    cpEl.id = 'clock-panel';
    const d = new Date();
    const year = d.getFullYear(), month = d.getMonth(), today = d.getDate();
    const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // пн=0
    const daysIn = new Date(year, month + 1, 0).getDate();
    const daysPrev = new Date(year, month, 0).getDate();

    let cells = '';
    ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].forEach(dw => cells += `<div class="cal-dow">${dw}</div>`);
    for (let i = 0; i < firstDow; i++) cells += `<div class="cal-day other">${daysPrev - firstDow + 1 + i}</div>`;
    for (let day = 1; day <= daysIn; day++) cells += `<div class="cal-day ${day === today ? 'today' : ''}">${day}</div>`;
    const tail = (7 - (firstDow + daysIn) % 7) % 7;
    for (let i = 1; i <= tail; i++) cells += `<div class="cal-day other">${i}</div>`;

    const notifs = OS.getNotifications();
    cpEl.innerHTML = `
      <div class="cal-head"><span class="cal-month">${MON_FULL[month]}</span><span>${year}</span></div>
      <div class="cal-grid">${cells}</div>
      <div class="notif-head"><span>Уведомления</span><span class="notif-clear">Очистить</span></div>
      <div class="notif-list">${notifs.length ? notifs.map(n => `
        <div class="notif-item">
          <div class="t-icon">${appIconOf(n.appId)}</div>
          <div><div class="t-title">${esc(n.title)}</div><div class="t-body">${esc(n.body)}</div></div>
        </div>`).join('') : `<div class="notif-empty">Нет новых уведомлений</div>`}</div>`;
    document.body.appendChild(cpEl);
    cpEl.querySelector('.notif-clear').addEventListener('click', () => {
      OS.clearNotifications();
      cpClose(); clockPanelToggle();
    });
    setTimeout(() => document.addEventListener('pointerdown', cpOutside, true), 0);
  }
  function cpOutside(e) {
    if (cpEl && !cpEl.contains(e.target) && !e.target.closest('#mb-clock')) cpClose();
  }
  function cpClose() {
    animateOut(cpEl);
    cpEl = null;
    document.removeEventListener('pointerdown', cpOutside, true);
  }

  function appIconOf(appId) {
    const app = OS.getApp(appId);
    if (app && app.icon) return app.icon;
    return `<div style="color:var(--accent)">${OS.icons.logo}</div>`;
  }

  /* ==================== ТОСТЫ ==================== */

  OS.on('os:notify', (n) => {
    if (OS.settings.get('dnd')) return;
    if (ccEl) return; // Центр управления открыт — уведомление уже видно в его списке
    const zone = document.getElementById('toasts');
    if (!zone) return;
    const t = el('div', 'toast', `
      <div class="t-icon">${appIconOf(n.appId)}</div>
      <div style="min-width:0"><div class="t-title">${esc(n.title)}</div><div class="t-body">${esc(n.body)}</div></div>`);
    t.addEventListener('click', () => dismiss());
    zone.appendChild(t);
    const dismiss = () => {
      t.classList.add('out');
      setTimeout(() => t.remove(), 260);
    };
    setTimeout(dismiss, 5200);
  });

  function closeAllPanels() {
    ccClose();
    cpClose();
    if (OS.assistant && OS.assistant.close) OS.assistant.close(); // не оставляем панель ассистента под другими
  }

  /* ==================== ПРИВЯЗКИ ==================== */

  OS.on('spotlight:toggle', spotlightToggle);
  OS.on('launchpad:toggle', launchpadToggle);
  OS.on('cc:toggle', ccToggle);
  OS.on('clockpanel:toggle', ccToggle); // клик по часам открывает единый Центр управления

  document.addEventListener('keydown', (e) => {
    if (e.altKey && e.code === 'Space') {
      e.preventDefault();
      spotlightToggle();
    }
    if (e.ctrlKey && e.altKey && e.code === 'KeyL') {
      e.preventDefault();
      OS.emit('session:lock');
    }
  });

  /* ==================== ГОРЯЧИЕ УГЛЫ ==================== */

  const CORNER_ACTIONS = {
    mission: () => OS.wm.missionToggle(),
    desktop: () => OS.wm.showDesktop(),
    search: spotlightToggle,
    apps: launchpadToggle,
    assistant: () => OS.assistant.toggle(),
    lock: () => OS.emit('session:lock'),
  };
  let cornerAt = 0;
  let cornerArmed = true; // взводится только после ухода из угла
  document.addEventListener('mousemove', (e) => {
    const M = 2;
    const L = e.clientX <= M, R = e.clientX >= innerWidth - M - 1;
    const T = e.clientY <= M, B = e.clientY >= innerHeight - M - 1;
    const corner = L && T ? 'tl' : R && T ? 'tr' : L && B ? 'bl' : R && B ? 'br' : null;
    if (!corner) { cornerArmed = true; return; }
    if (!cornerArmed || performance.now() - cornerAt < 900) return;
    const conf = OS.settings.get('hotCorners', {});
    const fn = CORNER_ACTIONS[conf[corner]];
    if (fn) {
      cornerAt = performance.now();
      cornerArmed = false;
      fn();
    }
  });

  /* ==================== ОТКРЫТИЕ ПАНЕЛИ НАВЕДЕНИЕМ НА ПРАВЫЙ КРАЙ ==================== */

  let edgeT = null;
  document.addEventListener('mousemove', (e) => {
    if (!OS.settings.get('ccEdgeReveal', true)) { if (edgeT) { clearTimeout(edgeT); edgeT = null; } return; }
    const atEdge = e.clientX >= innerWidth - 1;
    const band = e.clientY > 56 && e.clientY < innerHeight - 56; // не мешаем углам
    if (atEdge && band && !ccEl && !edgeT && !e.buttons) {
      edgeT = setTimeout(() => { edgeT = null; if (!ccEl) ccToggle(); }, 220);
    } else if (edgeT && (!atEdge || !band)) {
      // ушли с края ИЛИ в зону угла (band=false) — снимаем взвод, не мешаем углам
      clearTimeout(edgeT); edgeT = null;
    }
  });

  OS.overlays = { spotlightToggle, launchpadToggle, ccToggle, clockPanelToggle, animateOut };
})();

</script>
  <script>
/* === js/core/widgets.js === */
/* ============================================================
   Hiko OS · widgets — виджеты рабочего стола
   Реестр, галерея добавления, перетаскивание, персистентность.
   Виджет: OS.widgets.register({id, name, desc, w, h, preview, render})
   render(body, ctx) → опционально возвращает dispose()
   ctx: { data, save(data), uid }
   ============================================================ */
(function () {
  'use strict';
  const { el, esc, clamp, uid } = OS;

  const registry = new Map();
  const live = new Map();   // uid -> {el, dispose, entry}
  let entries = [];         // персистентный список [{uid, type, x, y, data}]
  let layerReady = false;

  function persist() {
    OS.settings.set('widgets', entries.map(e => ({ uid: e.uid, type: e.type, x: e.x, y: e.y, data: e.data })));
  }

  OS.injectStyle('core-widgets', `

      position: absolute;

    }
    .widget.dragging { box-shadow: 0 20px 54px rgba(0,0,0,.4); opacity: .92; }

    /* — галерея — */
    #wg-gallery {
      position: fixed; inset: 0;

    }

      background: var(--glass-strong);
      backdrop-filter: blur(50px) saturate(180%);
      -webkit-backdrop-filter: blur(50px) saturate(180%);

    }

    .wg-card .wg-prev {

      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-soft), transparent);
      display: flex; align-items: center; justify-content: center;
