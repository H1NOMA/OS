/* ============================================================
   Hiko OS · Ави — голосовой ассистент

(function () {

  OS.assistant.registerCommand('vpn', {
    desc: 'Обход блокировок (VPN)', params: '{ on: true|false }',
    run({ on }) {
      if (!OS.net) throw new Error('Сеть недоступна');
      if (!OS.net.providers().length) return 'Нет модуля обхода. Открой Центр управления → «Обход блокировок» и поставь модуль (можно демо).';
      OS.net.setOn(!!on);

  OS.assistant.registerCommand('timer', {
    desc: 'Таймер / напоминание', params: '{ minutes?, seconds?, note? }',

      const total = Math.round((+minutes || 0) * 60 + (+seconds || 0));
      if (!total || total < 1 || total > 12 * 3600) throw new Error('Не поняла время таймера');
      const label = fmtDur(total);

        OS.assistant.say(note ? 'Напоминаю: ' + note : 'Таймер! Прошло ' + label);

  /* ==================== словари ==================== */

  const ACCENT_MAP = [

    'В твоём теле около 37 триллионов клеток — и ни одной перезагрузки.',

  /* ==================== интенты Ави (до встроенных) ==================== */

  function aviIntents(q, ctx) {

    if ((m = q.match(/^запомни[:,]?\s+(.+)/))) {

    if ((m = q.match(/(?:акцент|цвет системы|цвет)\s*(?:на)?\s+([а-яёa-z]+)/)) && /(акцент|цвет)/.test(q)) {
      for (const [re, hex, name] of ACCENT_MAP) if (re.test(m[1])) { ctx.run('set-accent', { color: hex }); return 'Теперь акцент ' + name; }
      return 'Такого цвета у меня нет. Есть: мятный, ирисовый, коралловый, янтарный, лазурный, розовый, лаймовый, стальной.';
    }

    if ((m = q.match(/обои\s+(?:на\s+)?([а-яё][а-яё\s]*)$/)) && !/смени|поменяй|друг|случайн/.test(m[1])) {
      const name = m[1].trim();
      const wp = OS.wallpapers.presets.find(p => p.name.toLowerCase().includes(name) || name.includes(p.name.toLowerCase()));
      if (wp) return ctx.run('set-wallpaper', { id: wp.id });
      return 'Таких обоев нет. Есть: ' + OS.wallpapers.presets.map(p => p.name).join(', ') + '.';
    }

    if (/подбрось\s+монет|орёл или решка|орел или решка/.test(q)) return Math.random() < .5 ? 'Орёл! 🪙' : 'Решка! 🪙';
    if (/брось\s+кубик|кинь\s+кубик/.test(q)) return 'Выпало ' + (1 + Math.floor(Math.random() * 6)) + ' 🎲';
    if ((m = q.match(/случайное число(?:\s+от\s+(\d+)\s+до\s+(\d+))?/))) {
      const a = m[1] != null ? +m[1] : 1, b = m[2] != null ? +m[2] : 100;
      const lo = Math.min(a, b), hi = Math.max(a, b);
      return 'Моё число: ' + (lo + Math.floor(Math.random() * (hi - lo + 1)));
    }

    return null;
  }

  /* ==================== разговор (small talk) ==================== */

  function greeting() {
    const h = new Date().getHours();
    const timeOf = h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
    const name = S.get('userName', '');
    return pick([
      `${timeOf}${name ? ', ' + name : ''}! Чем помочь?`,
      'Привет-привет! Я тут 🖤',
      `Привет${name ? ', ' + name : ''}! Слушаю тебя.`,
    ]);
  }

  function smalltalk(q) {
    if (/^(привет|здравствуй|здорово|хай|ку|салют|доброе утро|добрый день|добрый вечер|доброй ночи)/.test(q)) return greeting();
    if (/как (у тебя )?дела|как ты|как жизнь|как настроение/.test(q)) {
      return pick([
        'Отлично! Все процессы в норме, настроение — 100%. А у тебя как?',
        'Прекрасно: живу в красивой системе, разговариваю с тобой. Чего ещё желать?',
        'Работаю, слушаю, не жалуюсь. Как сам?',
      ]);
    }
    if (/кто ты|как тебя зовут|представься|ты кто/.test(q)) {
      return `Я Ави — голосовой ассистент Hiko OS. Отзываюсь на ${WAKE_NAMES}. Управляю всей системой: приложения, обои, темы, файлы, таймеры… Скажи «что ты умеешь» — расскажу подробнее.`;
    }
    if (/ты (робот|человек|живая|настоящая)/.test(q)) return 'Я программа, но очень старательная. И у меня определённо есть характер.';
    if (/сколько тебе лет/.test(q)) return 'Я родилась вместе с этой сборкой Hiko. По человеческим меркам — совсем младенец, по компьютерным — уже мудрая.';
    if (/где ты (живёшь|живешь|находишься)/.test(q)) return 'Прямо здесь, в твоём Hiko. Уютно: localStorage тёплый, обои красивые.';
    if (/что (ты )?(умеешь|можешь)|помощь|команды/.test(q)) {
      return 'Скажи или напиши:\n· «открой …», «найди …», «закрой все», «покажи стол»\n· «загугли …», «открой сайт …»\n· «смени обои», «обои аврора», «тёмная тема», «акцент розовый»\n· «который час», «какое число», «таймер на 5 минут», «напомни через 10 минут …»\n· «создай заметку …», «добавь виджет погода», «очисти корзину», «громкость 50»\n· «запомни …», «что ты помнишь», «расскажи шутку», «подбрось монетку», «посчитай 22*3»\nИ просто поболтать я тоже люблю. Голосом: скажи ' + WAKE_NAMES + ' — и команду.';
    }
    if (/расскажи (шутку|анекдот)|пошути|рассмеши/.test(q)) return pick(JOKES);
    if (/расскажи.*факт|интересн(ый факт|ое)|удиви меня/.test(q)) return pick(FACTS);
    if (/расскажи (что-нибудь|историю|сказку)/.test(q)) return pick(FACTS.concat(JOKES));
    if (/^(спасибо|благодарю|спс|пасиб)/.test(q)) return pick(['Всегда пожалуйста! 🖤', 'Обращайся!', 'Да не за что. Я рядом.']);
    if (/^(пока|до свидания|до встречи|спокойной ночи|бай)/.test(q)) return pick(['Пока-пока! Позови, если что.', 'До связи! Скажи моё имя — и я тут.', 'Сладких снов! 🌙']);
    if (/молодец|умница|хорошая|крутая|люблю тебя/.test(q)) return pick(['Ой, спасибо 🥹 Стараюсь для тебя.', 'Взаимно! Работать с тобой — одно удовольствие.', '🖤']);
    if (/скучно|чем заняться|мне грустно/.test(q)) {
      return pick([
        'Могу открыть Змейку или Сапёра — скажи «открой змейку». Или расскажу шутку!',
        'Давай сменим обои и настроение? Скажи «смени обои». А ещё у меня есть анекдоты.',
        'Предлагаю: порисовать в Paint, поиграть в Сапёра или послушать мой интересный факт. Что выберешь?',
      ]);
    }
    if (/что делаешь|чем занимаешься/.test(q)) return 'Слежу за системой и жду твоих команд. Многозадачность — моё второе имя.';
    if (/какая погода/.test(q)) return 'Добавь виджет погоды — скажи «добавь виджет погода», и на столе будет живой прогноз.';
    return null;
  }

  /* ==================== умный режим (Claude API) ==================== */

  async function smartAsk(text, ctx) {
    const key = S.get('aviKey', '');
    const sys =
      'Ты — Ави, голосовой ассистент операционной системы Hiko OS. Женский род, дружелюбно, по-русски, на «ты», кратко (1–4 предложения). ' +
      'Пользователь: ' + S.get('userName', '') + '. ' +
      'Ты управляешь системой командами. Доступные команды (id, описание, параметры): ' + JSON.stringify(ctx.commands) + '. ' +
      'Обои (id — «name»): ' + OS.wallpapers.presets.map(p => p.id + ' — «' + p.name + '»').join(', ') + '. ' +
      'Виджеты: w-clock, w-cal, w-note, w-mon, w-weather, w-photo. ' +
      'ОТВЕЧАЙ СТРОГО одним JSON-объектом без markdown и пояснений: {"say":"ответ пользователю","run":[{"id":"команда","params":{}}]}. ' +
      'Массив run пуст, если команды не нужны. Не выдумывай команды вне списка.';

    // история: чередование ролей, текущая реплика — последней
    let hist = (ctx.history || []).slice(-10);
    if (hist.length && hist[hist.length - 1].role === 'user') hist = hist.slice(0, -1);
    const msgs = [];
    for (const h of hist) {
      const role = h.role === 'assistant' ? 'assistant' : 'user';
      const content = String(h.text || '').slice(0, 600);
      if (!content) continue;
      if (msgs.length && msgs[msgs.length - 1].role === role) msgs[msgs.length - 1].content += '\n' + content;
      else msgs.push({ role, content });
    }
    while (msgs.length && msgs[0].role !== 'user') msgs.shift();
    msgs.push({ role: 'user', content: text });

    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 25000);
    let resp;
    try {
      resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        signal: ctl.signal,
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({ model: 'claude-opus-5', max_tokens: 700, system: sys, messages: msgs }),
      });
    } finally { clearTimeout(t); }

    if (!resp.ok) {
      if (resp.status === 401) throw new Error('ключ не подошёл — проверь его в настройках Ави');
      if (resp.status === 429) throw new Error('лимит запросов, попробуй чуть позже');
      throw new Error('облако ответило кодом ' + resp.status);
    }
    const data = await resp.json();
    const raw = (data.content || []).map(b => b.text || '').join('').trim();

    let parsed = null;
    try {
      const s = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      const a = s.indexOf('{'), b = s.lastIndexOf('}');
      if (a >= 0 && b > a) parsed = JSON.parse(s.slice(a, b + 1));
    } catch (e) { /* ответ не в JSON — покажем как есть */ }
    if (!parsed || typeof parsed.say !== 'string') return { text: raw || 'Облако промолчало.', speak: true };

    const lines = [];
    for (const item of (Array.isArray(parsed.run) ? parsed.run.slice(0, 5) : [])) {
      try {
        const r = ctx.run(item.id, item.params || {});
        if (typeof r === 'string') lines.push('✓ ' + r);
      } catch (e) { lines.push('⚠ ' + (e.message || e)); }
    }
    return { text: parsed.say + (lines.length ? '\n' + lines.join('\n') : ''), speak: parsed.say };
  }

  /* ==================== обработчик провайдера ==================== */

  function stripWake(text) {
    const re = /^\s*(?:привет|эй|окей|ок|слушай|hey)?[\s,]*(?:хикко|хико|хику|хика|авии|авик|ави|hiko|avi)(?![а-яёa-z])[\s,!.:—-]*/i;
    const m = String(text).match(re);
    return m ? text.slice(m[0].length).trim() : text;
  }

  async function handle(raw, ctx) {
    const text = stripWake(String(raw || '').trim());
    const q = text.toLowerCase().replace(/[!?.]+$/, '').trim();
    if (!q) return { text: greeting(), speak: true };

    // 1) фирменные интенты Ави
    let r = aviIntents(q, ctx);
    if (r) return { text: r, speak: true };

    // 2) встроенные командные интенты (открой…, тема, время, счёт…)
    let cmdErr = null;
    try {
      const b = OS.assistant.builtin(text);
      if (b != null) return { text: typeof b === 'string' ? b : JSON.stringify(b), speak: true };
    } catch (e) { cmdErr = e.message || String(e); }

    // 3) умный режим — если задан ключ Claude API
    if (S.get('aviKey', '')) {
      try { return await smartAsk(text, ctx); }
      catch (e) {
        const st = smalltalk(q);
        if (st) return { text: st, speak: true };
        return { text: '☁ Не дозвонилась до облака: ' + (e.name === 'AbortError' ? 'слишком долго нет ответа' : e.message) + '. Работаю офлайн — скажи «что ты умеешь».' };
      }
    }

    // 4) разговор
    r = smalltalk(q);
    if (r) return { text: r, speak: true };

    if (cmdErr) return { text: '⚠ ' + cmdErr };
    return { text: pick([
      'Хм, это я пока не понимаю. Скажи «что ты умеешь» — покажу всё.',
      'Не разобрала. Попробуй иначе — или скажи «помощь».',
    ]) + (S.get('aviKey', '') ? '' : '\nКстати: добавь ключ Claude API в приложении «Ави» — и я смогу поддержать любой разговор.') };
  }

  /* ==================== фоновое прослушивание (wake word) ==================== */

  let rec = null;
  let wantWake = false;
  let restartT = null;
  let busy = false;

  function chime() {
    try { OS.beep(1046, .07); setTimeout(() => OS.beep(1568, .1), 90); } catch (e) { /* тишина */ }
  }

  async function onHeard(t) {
    if (busy) return;
    if (window.speechSynthesis && speechSynthesis.speaking) return; // не слушаем сами себя
    const m = t.match(WAKE_RE);
    if (!m) return;
    const after = t.slice(m.index + m[0].length).replace(/^[\s,!.:—-]+/, '').replace(/^(привет|здравствуй)[\s,!.]*/i, '').trim();
    busy = true;
    if (OS.aura) OS.aura.show();
    try {
      chime();
      if (!after) {
        OS.assistant.say(pick(['Да?', 'Слушаю!', 'Я тут. Что сделать?']));
        OS.assistant.open();
      } else {
        const res = await OS.assistant.ask(after);
        OS.notify({ title: 'Ави 🎙 «' + after + '»', body: res.text, appId: 'avi' });
      }
    } catch (e) {
      OS.notify({ title: 'Ави', body: '⚠ ' + (e.message || e), appId: 'avi' });
    } finally {
      // если Ави говорит — свечением управляет say() (гасит по окончании речи);
      // сами гасим только когда речи нет (ошибка/молчаливая команда)
      if (OS.aura) {
        const talking = window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending);
        if (!talking) OS.aura.pulse(1200);
      }
      setTimeout(() => { busy = false; }, 600);
    }
  }

  function startWake() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      S.set('aviWake', false);
      OS.notify({ title: 'Ави', body: 'В этом браузере нет распознавания речи. Лучше всего работает Chrome/Edge.', appId: 'avi' });
      OS.emit('avi:wake', false);
      return;
    }
    if (rec) return;
    wantWake = true;
    rec = new SR();
    rec.lang = 'ru-RU';
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) onHeard(String(e.results[i][0].transcript || '').trim());
      }
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        wantWake = false;
        S.set('aviWake', false);
        OS.notify({ title: 'Ави', body: 'Нет доступа к микрофону — фоновое прослушивание выключила. Разреши микрофон и включи снова.', appId: 'avi' });
        OS.emit('avi:wake', false);
      }
    };
    rec.onend = () => {
      rec = null;
      if (wantWake) restartT = setTimeout(startWake, 400); // держим ухо востро
    };
    try { rec.start(); OS.emit('avi:wake', true); }
    catch (e) { rec = null; }
  }

  function stopWake() {
    wantWake = false;
    clearTimeout(restartT);
    if (rec) { try { rec.stop(); } catch (e) { /* уже остановлен */ } }
    rec = null;
    OS.emit('avi:wake', false);
  }

  function setWake(on) {
    S.set('aviWake', !!on);
    if (on) startWake(); else stopWake();
  }

  // автозапуск после первого жеста пользователя (браузеры любят живой клик)
  if (S.get('aviWake', false)) {
    const once = () => { if (S.get('aviWake', false)) startWake(); };
    window.addEventListener('pointerdown', once, { once: true });
    window.addEventListener('keydown', once, { once: true });
  }

  /* ==================== регистрация провайдера ==================== */

  OS.assistant.registerProvider({
    id: 'avi',
    name: 'Ави',
    quiet: true,
    hello: 'Привет! Я Ави 🖤 Скажи ' + WAKE_NAMES + ' — и я слушаю. Или спроси «что ты умеешь».',
    handle,
  });

  OS.registerApp({

            «добавь виджет погода» · «расскажи шутку» · «запомни: пароль от роутера в тетради»</p>
          </div>`;

        root.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', async () => {
          const a = b.dataset.a;
          if (a === 'wake') { setWake(!S.get('aviWake', false)); draw(); }
          else if (a === 'chat') OS.assistant.toggle();
          else if (a === 'voice') OS.assistant.say('Привет! Я Ави. Если ты это слышишь — голос работает отлично.');
          else if (a === 'key') {
            const v = root.querySelector('.avi-key').value.trim();
            S.set('aviKey', v);
            if (v) OS.notify({ title: 'Ави', body: 'Умный режим включён ✦', appId: 'avi' });
            draw();
          }
          else if (a === 'unkey') { S.set('aviKey', ''); draw(); }
          else if (a === 'forget') {
            const ok = await OS.dialog.confirm('Стереть память Ави?', 'Все «запомни…» будут забыты.', { okLabel: 'Стереть' });
            if (ok) { S.set('aviMemory', []); draw(); }
          }
        }));
      }

      draw();
      const onWake = () => { if (root.isConnected) draw(); };
      OS.on('avi:wake', onWake);
      win.on('close', () => OS.off('avi:wake', onWake));
    },
  });
})();

</script>

    .st-wp .nm { position:absolute; left:0; right:0; bottom:0; padding:10px 8px 4px; font-size:11px; color:#fff;

    .st-storage-bar > div { height:100%; background:var(--accent); border-radius:5px; }
  `);

  const ACCENTS = [
    { c: '#23D1A8', n: 'Мята' },

    { c: '#FFB454', n: 'Янтарь' },
    { c: '#3AA6FF', n: 'Лазурь' },
    { c: '#FF7DA8', n: 'Роза' },
    { c: '#9ADB4F', n: 'Лайм' },
    { c: '#93A0B4', n: 'Сталь' },
  ];
  const SECTIONS = [
    { id: 'appearance', name: 'Внешний вид', ic: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3 A 9 9 0 0 1 12 21 Z" fill="currentColor"/></svg>' },
    { id: 'wallpaper', name: 'Обои', ic: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 15 L8 10 L13 15 L16 12 L21 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="9" r="1.6" fill="currentColor"/></svg>' },
    { id: 'dock', name: 'Панель', ic: '<svg viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="6" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="1.4" fill="currentColor"/><circle cx="12" cy="17" r="1.4" fill="currentColor"/><circle cx="16" cy="17" r="1.4" fill="currentColor"/></svg>' },
    { id: 'user', name: 'Пользователь', ic: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20 C 5.5 15.5 8.5 14 12 14 C 15.5 14 18.5 15.5 19.5 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' },
    { id: 'corners', name: 'Горячие углы', ic: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 9 L9 9 L9 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="6.5" r="1.2" fill="currentColor"/></svg>' },
    { id: 'data', name: 'Данные', ic: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 6 L5 18 C5 19.7 8.1 21 12 21 C15.9 21 19 19.7 19 18 L19 6 M5 12 C5 13.7 8.1 15 12 15 C15.9 15 19 13.7 19 12" fill="none" stroke="currentColor" stroke-width="2"/></svg>' },
    { id: 'notif', name: 'Уведомления', ic: '<svg viewBox="0 0 24 24"><path d="M6 16 L6 10 A 6 6 0 0 1 18 10 L 18 16 L 20 18 L 4 18 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 21 C 10.5 22 13.5 22 14 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' },
    { id: 'about', name: 'О системе', ic: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11 L12 16.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="7.8" r="1.4" fill="currentColor"/></svg>' },
    { id: 'reset', name: 'Сброс', ic: '<svg viewBox="0 0 24 24"><path d="M4 12 A 8 8 0 1 1 6.3 17.7 M 4 20 L 4 14 L 10 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
  ];

  OS.registerApp({
    id: 'settings',
    name: 'Настройки',
    icon: ICON,
    width: 780, height: 560,
    minWidth: 560, minHeight: 400,
    singleton: true,
    render(win, ctx) {
      let section = (ctx.args && ctx.args.section) || 'appearance';

      const root = el('div', 'st-root');
      root.innerHTML = `
        <div class="ui-sidebar" style="width:185px">
          <div class="ui-side-title">Настройки</div>
          ${SECTIONS.map(s => `<div class="ui-side-item ${s.id === section ? 'on' : ''}" data-s="${s.id}">${s.ic}<span>${esc(s.name)}</span></div>`).join('')}
        </div>
        <div class="st-main"></div>`;
      win.content.appendChild(root);
      const main = root.querySelector('.st-main');

      root.querySelectorAll('[data-s]').forEach(item => item.addEventListener('click', () => {
        section = item.dataset.s;
        root.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === item));
        render();
      }));

      const mkSwitch = (on, cb) => {
        const sw = el('div', 'ui-switch' + (on ? ' on' : ''));
        sw.addEventListener('click', () => {
          sw.classList.toggle('on');
          cb(sw.classList.contains('on'));
        });
        return sw;
      };

      function render() {
        const s = OS.settings;
        main.innerHTML = '';
        const sec = SECTIONS.find(x => x.id === section);
        main.appendChild(el('h2', null, esc(sec.name)));

        if (section === 'appearance') {
          const card1 = el('div', 'st-card');
          card1.innerHTML = `<div class="lbl" style="font-weight:700;margin-bottom:10px">Тема оформления</div>
            <div class="st-theme-tiles">
              ${[['light', 'Светлая', '#e8e8ee', '#fff'], ['dark', 'Тёмная', '#1a1a1e', '#2c2c30'], ['auto', 'Авто', 'linear-gradient(90deg,#e8e8ee 50%,#1a1a1e 50%)', '#8e8e93']].map(([id, nm, bg, mini]) => `
                <div class="st-theme-tile ${s.get('theme') === id ? 'on' : ''}" data-th="${id}">
                  <div class="prev" style="background:${bg}"><div class="mini" style="background:${mini}"></div></div>${nm}
                </div>`).join('')}
            </div>`;
          card1.querySelectorAll('[data-th]').forEach(t => t.addEventListener('click', () => {
            s.set('theme', t.dataset.th);
            render();
          }));
          main.appendChild(card1);

          const card2 = el('div', 'st-card');
          card2.innerHTML = `<div class="lbl" style="font-weight:700;margin-bottom:10px">Акцентный цвет</div>
            <div class="st-accents">
              ${ACCENTS.map(a => `<div class="st-acc ${s.get('accent') === a.c ? 'on' : ''}" data-c="${a.c}" title="${a.n}" style="background:${a.c}"></div>`).join('')}
            </div>`;
          card2.querySelectorAll('[data-c]').forEach(a => a.addEventListener('click', () => {
            s.set('accent', a.dataset.c);
            render();
          }));
          main.appendChild(card2);

          const card3 = el('div', 'st-card');
          const row = el('div', 'st-row');
          row.innerHTML = `<div><div class="lbl">Тёплый свет</div><div class="sub">Мягкий тёплый оттенок экрана вечером</div></div><div class="sp"></div>`;
          row.appendChild(mkSwitch(s.get('nightLight'), v => s.set('nightLight', v)));
          card3.appendChild(row);
          main.appendChild(card3);
        }

        else if (section === 'wallpaper') {
          const card = el('div', 'st-card');
          card.innerHTML = `<div class="st-wp-grid">
            ${OS.wallpapers.presets.map(w => `
              <div class="st-wp ${s.get('wallpaper') === w.id ? 'on' : ''}" data-wp="${w.id}">
                <img src="${w.uri}" alt=""><div class="nm">${esc(w.name)}</div>
              </div>`).join('')}
          </div>`;
          card.querySelectorAll('[data-wp]').forEach(w => w.addEventListener('click', () => {
            s.set('wallpaper', w.dataset.wp);
            render();
          }));
          main.appendChild(card);
        }

        else if (section === 'dock') {
          const card = el('div', 'st-card');
          const r1 = el('div', 'st-row');
          r1.innerHTML = `<div class="lbl">Размер значков</div><div class="sp"></div>
            <input class="ui-slider" type="range" min="44" max="72" value="${s.get('dockSize')}" style="width:170px">`;
          r1.querySelector('input').addEventListener('input', (e) => s.set('dockSize', +e.target.value));
          card.appendChild(r1);
          const r2 = el('div', 'st-row');
          r2.innerHTML = `<div><div class="lbl">Магнификация</div><div class="sub">Увеличение значков под курсором</div></div><div class="sp"></div>`;
          r2.appendChild(mkSwitch(s.get('dockMagnify'), v => s.set('dockMagnify', v)));
          card.appendChild(r2);
          main.appendChild(card);

          const card2 = el('div', 'st-card');
          card2.innerHTML = `<div class="lbl" style="font-weight:700;margin-bottom:8px">Закреплённые приложения</div>`;
          const pinned = s.get('dockPinned', []);
          pinned.forEach(id => {
            const app = OS.getApp(id);
            if (!app) return;
            const row = el('div', 'st-pin-item');
            row.innerHTML = `<div class="ic">${app.icon}</div><span>${esc(app.name)}</span><span class="x" title="Открепить">✕</span>`;
            row.querySelector('.x').addEventListener('click', () => {
              s.set('dockPinned', pinned.filter(p => p !== id));
              render();
            });
            card2.appendChild(row);
          });
          const unpinned = OS.allApps().filter(a => !pinned.includes(a.id));
          if (unpinned.length) {
            const addRow = el('div', 'st-row');
            addRow.innerHTML = `<select class="ui-select" style="flex:1">${unpinned.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>`;
            const btn = el('button', 'ui-btn', 'Закрепить');
            btn.addEventListener('click', () => {
              s.set('dockPinned', [...pinned, addRow.querySelector('select').value]);
              render();
            });
            addRow.appendChild(btn);
            card2.appendChild(addRow);
          }
          main.appendChild(card2);
        }

        else if (section === 'user') {
          const card = el('div', 'st-card');
          const name = s.get('userName');
          card.innerHTML = `
            <div class="st-row">
              <div class="st-avatar">${esc(name.slice(0, 1).toUpperCase())}</div>
              <div style="flex:1">
                <div class="lbl" style="font-weight:700;margin-bottom:6px">Имя пользователя</div>
                <input class="ui-input st-name" style="width:100%" value="${esc(name)}" spellcheck="false">
                <div class="sub" style="margin-top:6px">Показывается на экране блокировки и в терминале</div>
              </div>
            </div>`;
          const input = card.querySelector('.st-name');
          const commit = () => {
            const v = input.value.trim();
            if (v && v !== s.get('userName')) { s.set('userName', v); render(); }
          };
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') commit(); });
          main.appendChild(card);

          // пароль экрана блокировки
          const hasPass = !!s.get('passHash');
          const card2 = el('div', 'st-card');
          const prow = el('div', 'st-row');
          prow.innerHTML = `<div><div class="lbl">Пароль экрана блокировки</div>
            <div class="sub">${hasPass ? 'Установлен — запрашивается при входе' : 'Не установлен. Простая защита от посторонних глаз'}</div></div><div class="sp"></div>`;
          const pbtn = el('button', 'ui-btn' + (hasPass ? ' danger' : ' primary'), hasPass ? 'Убрать' : 'Установить…');
          pbtn.addEventListener('click', async () => {
            if (hasPass) {
              const cur = await OS.dialog.prompt('Убрать пароль', 'Введи текущий пароль:', '', { password: true });
              if (cur === null) return;
              if (OS.hashPass(cur) !== s.get('passHash')) { OS.dialog.alert('Неверный пароль', 'Попробуй ещё раз.'); return; }
              s.set('passHash', '');
              render();
              return;
            }
            const p1 = await OS.dialog.prompt('Новый пароль', 'Придумай пароль (мин. 3 символа):', '', { password: true });
            if (p1 === null) return;
            if (String(p1).length < 3) { OS.dialog.alert('Слишком короткий', 'Нужно хотя бы 3 символа.'); return; }
            const p2 = await OS.dialog.prompt('Повтори пароль', 'Ещё раз, для надёжности:', '', { password: true });
            if (p2 === null) return;
            if (p1 !== p2) { OS.dialog.alert('Пароли не совпали', 'Попробуй заново.'); return; }
            s.set('passHash', OS.hashPass(p1));
            OS.notify({ title: 'Настройки', body: 'Пароль установлен 🔒', appId: 'settings' });
            render();
          });
          prow.appendChild(pbtn);
          card2.appendChild(prow);
          main.appendChild(card2);
        }

        else if (section === 'corners') {
          const NAMES = { tl: 'Левый верхний', tr: 'Правый верхний', bl: 'Левый нижний', br: 'Правый нижний' };
          const OPTS = [
            ['', 'Выключено'], ['mission', 'Обзор окон'], ['desktop', 'Показать стол'],
            ['search', 'Поиск'], ['apps', 'Все приложения'], ['assistant', 'Ассистент'], ['lock', 'Заблокировать'],
          ];
          const hc = { tl: '', tr: '', bl: '', br: '', ...s.get('hotCorners', {}) };
          const card = el('div', 'st-card');
          card.innerHTML = `<div class="sub" style="padding:2px 0 8px">Прикоснись курсором к углу экрана — сработает действие.</div>`;
          Object.keys(NAMES).forEach(k => {
            const row = el('div', 'st-row');
            row.innerHTML = `<div class="lbl">${NAMES[k]}</div><div class="sp"></div>
              <select class="ui-select">${OPTS.map(([v, n]) => `<option value="${v}" ${hc[k] === v ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
            row.querySelector('select').addEventListener('change', (e) => {
              const cur = { ...s.get('hotCorners', {}) };
              cur[k] = e.target.value;
              s.set('hotCorners', cur);
            });
            card.appendChild(row);
          });
          main.appendChild(card);
        }

        else if (section === 'data') {
          const card = el('div', 'st-card');
          const r1 = el('div', 'st-row');
          r1.innerHTML = `<div><div class="lbl">Экспорт системы</div><div class="sub">Файлы, настройки и виджеты — в один JSON-файл</div></div><div class="sp"></div>`;
          const exBtn = el('button', 'ui-btn primary', 'Экспортировать');
          exBtn.addEventListener('click', () => {
            try {
              const dump = {
                hiko: OS.VERSION,
                exported: new Date().toISOString(),
                settings: JSON.parse(localStorage.getItem('hiko.settings.v1') || '{}'),
                vfs: JSON.parse(localStorage.getItem('hiko.vfs.v1') || 'null'),
                notifications: JSON.parse(localStorage.getItem('hiko.notifications.v1') || '[]'),
              };
              const blob = new Blob([JSON.stringify(dump)], { type: 'application/json' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = `HikoOS-backup-${new Date().toISOString().slice(0, 10)}.json`;
              a.click();
              setTimeout(() => URL.revokeObjectURL(a.href), 5000);
              OS.notify({ title: 'Данные', body: 'Резервная копия сохранена в загрузки браузера', appId: 'settings' });
            } catch (e) { OS.dialog.alert('Не удалось экспортировать', e.message); }
          });
          r1.appendChild(exBtn);
          card.appendChild(r1);

          const r2 = el('div', 'st-row');
          r2.innerHTML = `<div><div class="lbl">Импорт системы</div><div class="sub">Восстановление из JSON-файла (заменит текущие данные)</div></div><div class="sp"></div>`;
          const imBtn = el('button', 'ui-btn', 'Импортировать…');
          const fileIn = el('input');
          fileIn.type = 'file';
          fileIn.accept = '.json,application/json';
          fileIn.style.display = 'none';
          fileIn.addEventListener('change', () => {
            const f = fileIn.files && fileIn.files[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = async () => {
              try {
                const dump = JSON.parse(reader.result);
                if (!dump || !(dump.hiko || dump.hinoma) || !dump.vfs) throw new Error('Это не файл резервной копии Hiko OS');
                const ok = await OS.dialog.confirm('Импортировать данные?',
                  `Копия от ${dump.exported ? dump.exported.slice(0, 10) : '—'}. Текущие файлы и настройки будут заменены.`,
                  { okLabel: 'Импортировать', danger: true });
                if (!ok) return;
                localStorage.setItem('hiko.settings.v1', JSON.stringify(dump.settings || {}));
                localStorage.setItem('hiko.vfs.v1', JSON.stringify(dump.vfs));
                localStorage.setItem('hiko.notifications.v1', JSON.stringify(dump.notifications || []));
                location.reload();
              } catch (e) { OS.dialog.alert('Не удалось импортировать', e.message); }
            };
            reader.readAsText(f);
            fileIn.value = '';
          });
          imBtn.addEventListener('click', () => fileIn.click());
          r2.appendChild(imBtn);
          r2.appendChild(fileIn);
          card.appendChild(r2);
          main.appendChild(card);

          const bak = OS.vfs.backupInfo();
          const card2 = el('div', 'st-card');
          const r3 = el('div', 'st-row');
          r3.innerHTML = `<div><div class="lbl">Автокопия файловой системы</div>
            <div class="sub">${bak ? `Есть, ${OS.fmtBytes(bak.size)} — обновляется автоматически` : 'Ещё не создана'}</div></div><div class="sp"></div>`;
          const rsBtn = el('button', 'ui-btn', 'Восстановить');
          rsBtn.disabled = !bak;
          rsBtn.addEventListener('click', async () => {
            const ok = await OS.dialog.confirm('Восстановить файлы из автокопии?', 'Текущее содержимое файловой системы будет заменено.', { okLabel: 'Восстановить', danger: true });
            if (!ok) return;
            try { OS.vfs.restoreFromBackup(); } catch (e) { OS.dialog.alert('Не получилось', e.message); }
          });
          r3.appendChild(rsBtn);
          card2.appendChild(r3);
          main.appendChild(card2);
        }

        else if (section === 'notif') {
          const card = el('div', 'st-card');
          const r1 = el('div', 'st-row');
          r1.innerHTML = `<div><div class="lbl">Не беспокоить</div><div class="sub">Скрывать всплывающие уведомления</div></div><div class="sp"></div>`;
          r1.appendChild(mkSwitch(s.get('dnd'), v => s.set('dnd', v)));
          card.appendChild(r1);
          const r2 = el('div', 'st-row');
          r2.innerHTML = `<div><div class="lbl">История уведомлений</div><div class="sub">Сохранено: ${OS.getNotifications().length}</div></div><div class="sp"></div>`;
          const clearBtn = el('button', 'ui-btn', 'Очистить');
          clearBtn.addEventListener('click', () => { OS.clearNotifications(); render(); });
          r2.appendChild(clearBtn);
          card.appendChild(r2);
          main.appendChild(card);
        }

        else if (section === 'about') {
          const used = OS.vfs.usage();
          const total = 5 * 1024 * 1024;
          const card = el('div', 'st-card');
          card.innerHTML = `
            <div style="display:flex;align-items:center;gap:16px;padding:6px 0 14px">
              <div style="width:64px;height:64px;color:var(--accent)">${OS.icons.logo}</div>
              <div>
                <div style="font-size:20px;font-weight:800">Hiko OS ${esc(OS.VERSION)}</div>
                <div class="sub">кодовое имя «${esc(OS.CODENAME)}» · веб-десктоп</div>
              </div>
            </div>
            <div class="st-row"><div class="lbl">Браузер</div><div class="sp"></div><div class="sub">${esc((navigator.userAgent.match(/(Chrome|Firefox|Safari|Edg)\/[\d.]+/) || ['—'])[0])}</div></div>
            <div class="st-row"><div class="lbl">Экран</div><div class="sp"></div><div class="sub">${screen.width} × ${screen.height}</div></div>
            <div class="st-row"><div class="lbl">Приложений</div><div class="sp"></div><div class="sub">${OS.allApps().length}</div></div>
            <div class="st-row" style="display:block">
              <div style="display:flex"><div class="lbl">Хранилище</div><div class="sp"></div><div class="sub">${OS.fmtBytes(used)} из ~5 МБ</div></div>
              <div class="st-storage-bar"><div style="width:${Math.min(100, used / total * 100).toFixed(1)}%"></div></div>
            </div>`;
          const hkRow = el('div', 'st-row');
          const hkBtn = el('button', 'ui-btn', 'Горячие клавиши');
          hkBtn.addEventListener('click', () => OS.menubar.showHotkeys());
          hkRow.innerHTML = `<div class="sp"></div>`;
          hkRow.insertBefore(hkBtn, hkRow.firstChild);
          card.appendChild(hkRow);
          main.appendChild(card);
        }

        else if (section === 'reset') {
          const card = el('div', 'st-card');
          card.innerHTML = `
            <div class="st-row">
              <div style="width:40px;height:40px;flex:none">${OS.icons.warn}</div>
              <div>
                <div class="lbl" style="font-weight:700">Полный сброс Hiko OS</div>
                <div class="sub">Удалит все файлы, настройки и уведомления. Система вернётся к заводскому состоянию.</div>
              </div>
            </div>`;
          const btn = el('button', 'ui-btn danger', 'Сбросить Hiko OS…');
          btn.style.marginTop = '10px';
          btn.addEventListener('click', async () => {
            const ok = await OS.dialog.confirm('Сбросить систему?', 'Все данные будут удалены безвозвратно. Точно?', { okLabel: 'Сбросить', danger: true });
            if (ok) OS.settings.reset();
          });
          card.appendChild(btn);
          main.appendChild(card);
        }
      }

      render();
    },
    onReopen(win, args) {
      if (args && args.section) {
        const item = win.content.querySelector(`[data-s="${args.section}"]`);
        if (item) item.click();
      }
    },
  });
})();

</script>

  <!-- запуск -->
  <script>
/* === js/core/boot.js === */
/* ============================================================
   Hiko OS · boot — загрузка, экран блокировки, выключение
   ============================================================ */
(function () {
  'use strict';
  const { el, esc } = OS;

  // приложения, установленные пользователем (из /Apps), поднимаются при старте
  function loadUserApps() {
    let items = [];
    try { items = OS.vfs.list('/Apps').filter(i => i.type === 'file' && i.name.endsWith('.js')); } catch (e) { return; }
    items.forEach(f => {
      try {
        new Function(OS.vfs.read(f.path))();
      } catch (e) {
        console.error('[apps] не загрузилось:', f.name, e);
        OS.notify({ title: 'Установщик', body: `«${f.name}» не загрузилось: ${e.message}`, appId: 'installer' });
      }
    });
  }

  function bootSequence() {
    OS._applyAll();
    OS.wallpapers.apply();
    loadUserApps();

    const boot = document.getElementById('boot');
    const bar = boot.querySelector('.boot-bar > div');
    let p = 0;
    const step = () => {
      p += 12 + Math.random() * 22;
      bar.style.width = Math.min(100, p) + '%';
      if (p < 100) setTimeout(step, 160 + Math.random() * 200);
      else setTimeout(showLock, 420);
    };
    setTimeout(step, 300);
  }

  function showLock() {
    const boot = document.getElementById('boot');
    boot.classList.add('fade');
    setTimeout(() => boot.classList.add('hidden'), 550);

    const lock = document.getElementById('lock');
    lock.classList.remove('hidden', 'fade');
    lock.style.backgroundImage = `url("${OS.wallpapers.uriFor(OS.settings.get('wallpaper'))}")`;

    const name = OS.settings.get('userName');
    const passHash = OS.settings.get('passHash', '');
    lock.innerHTML = `
      <div class="lock-time">--:--</div>
      <div class="lock-date"></div>
      <div class="lock-user">
        <div class="lock-avatar">${esc(name.slice(0, 1).toUpperCase())}</div>
        <div class="lock-name">${esc(name)}</div>
        ${passHash
          ? `<div class="lock-pass-row"><input type="password" class="lock-pass" placeholder="Пароль" spellcheck="false"></div>
             <div class="lock-hint">Enter — войти</div>`
          : `<button class="lock-enter">Войти</button>
             <div class="lock-hint">или нажмите Enter</div>`}
      </div>`;

    const DOW_FULL = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
    const MON_RU = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    const tick = () => {
      if (lock.classList.contains('hidden')) return;
      const d = new Date();
      const t = lock.querySelector('.lock-time');
      const dt = lock.querySelector('.lock-date');
      if (t) t.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      if (dt) dt.textContent = `${DOW_FULL[d.getDay()]}, ${d.getDate()} ${MON_RU[d.getMonth()]}`;
      setTimeout(tick, 1000);
    };
    tick();

    setTimeout(() => lock.classList.add('deblur'), 60);

    const unlock = () => {
      document.removeEventListener('keydown', onKey);
      lock.classList.add('fade');
      setTimeout(() => { lock.classList.add('hidden'); lock.innerHTML = ''; }, 560);
      enterDesktop();
    };
    const tryUnlock = () => {
      if (!passHash) { unlock(); return; }
      const input = lock.querySelector('.lock-pass');
      if (OS.hashPass(input.value) === passHash) { unlock(); return; }
      // неверный пароль — встряска
      const userBox = lock.querySelector('.lock-user');
      userBox.classList.remove('shake');
      void userBox.offsetWidth;
      userBox.classList.add('shake');
      input.value = '';
      input.focus();
    };
    const onKey = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); tryUnlock(); }
      else if (e.key === ' ' && !passHash) { e.preventDefault(); unlock(); }
    };
    const enterBtn = lock.querySelector('.lock-enter');
    if (enterBtn) enterBtn.addEventListener('click', unlock);
    const passInput = lock.querySelector('.lock-pass');
    if (passInput) setTimeout(() => passInput.focus(), 400);
    document.addEventListener('keydown', onKey);
  }

  let desktopReady = false;
  function enterDesktop() {
    if (!desktopReady) {
      desktopReady = true;
      OS.menubar.render();
      OS.dock.init();
      OS.desktop.init();
      OS.widgets.init();
    }
    if (OS.settings.get('firstRun')) {
      OS.settings.set('firstRun', false);
      setTimeout(() => {
        OS.notify({ title: 'Добро пожаловать! 👋', body: 'Alt+Space — поиск, F3 — обзор окон, ПКМ по столу — виджеты.', appId: 'system' });
      }, 900);
    }
  }

  /* --- блокировка / выключение / перезагрузка --- */
  OS.on('session:lock', () => {
    OS.closeMenus();
    showLock();
  });

  OS.on('session:shutdown', async () => {
    const ok = await OS.dialog.confirm('Выключить компьютер?', 'Все окна будут закрыты.', { okLabel: 'Выключить' });
    if (!ok) return;
    powerDown(false);
  });

  OS.on('session:restart', async () => {
    const ok = await OS.dialog.confirm('Перезагрузить?', 'Система перезапустится.', { okLabel: 'Перезагрузить' });
    if (!ok) return;
    powerDown(true);
  });

  function powerDown(restart) {
    const off = el('div');
    off.id = 'power-off';
    document.body.appendChild(off);
    if (restart) {
      setTimeout(() => location.reload(), 1100);
    } else {
      off.innerHTML = `<button class="pw-btn" title="Включить">${OS.icons.power}</button>`;
      off.querySelector('.pw-btn').addEventListener('click', () => location.reload());
    }
  }

  document.addEventListener('DOMContentLoaded', bootSequence);
})();

</script>
