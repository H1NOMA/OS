    }
    .wg-card .wg-name { font-size: 13.5px; font-weight: 700; }
    .wg-card .wg-desc { font-size: 12px; color: var(--text-2); line-height: 1.35; flex: 1; }
    .wg-card .ui-btn { align-self: flex-start; }

    /* — начинка виджетов — */
    .wgc-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .wg-clock-date { font-size: 12px; color: var(--text-2); }
    .wg-cal { padding: 12px 14px; }
    .wg-cal .cal-grid { font-size: 11px; }
    .wg-cal .cal-head { margin-bottom: 6px; font-size: 13.5px; }
    .wg-note-ta {
      flex: 1; border: none; outline: none; resize: none;
      background: transparent; color: inherit;
      font: 13px/1.5 var(--font);
      padding: 12px 14px;
    }
    .wg-note { background: linear-gradient(160deg, rgba(255,214,130,.92), rgba(255,183,90,.92)); color: #3c2a08; }
    [data-theme="dark"] .wg-note { background: linear-gradient(160deg, rgba(214,164,72,.9), rgba(173,122,44,.9)); color: #241802; }
    .wg-title-row {
      flex: none; display: flex; align-items: center; gap: 6px;
      padding: 9px 13px 0;
      font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase;
      color: var(--text-3);
    }
    .wg-mon-rows { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 9px; padding: 6px 14px 12px; }
    .wg-mon-row { font-size: 11.5px; color: var(--text-2); }
    .wg-mon-bar { height: 7px; border-radius: 4px; background: var(--ctl-bg-hover); overflow: hidden; margin-top: 3px; }
    .wg-mon-bar > div { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .8s ease; }
    .wg-weather-main { display: flex; align-items: center; gap: 12px; padding: 2px 14px; flex: 1; }
    .wg-weather-main .we-emoji { font-size: 38px; }
    .wg-weather-main .we-t { font-size: 30px; font-weight: 800; }
    .wg-weather-main .we-d { font-size: 12px; color: var(--text-2); }
    .wg-weather-city {
      border: none; outline: none;
      background: transparent; color: var(--text-2);
      font: 11.5px var(--font);
      margin-left: auto;
    }
    .wg-weather-city option { color: #222; }
    .wg-photo-img { flex: 1; background-size: cover; background-position: center; }
    .wg-photo-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--text-2); background: linear-gradient(135deg, var(--accent-soft), transparent); }
  `);

  /* ================= каркас ================= */

  function layer() { return document.getElementById('desktop'); }

  function mount(entry) {
    const def = registry.get(entry.type);
    if (!def) return;
    const w = el('div', 'widget');
    w.style.width = def.w + 'px';
    w.style.height = def.h + 'px';
    w.style.left = clamp(entry.x, 0, Math.max(0, innerWidth - def.w - 8)) + 'px';
    w.style.top = clamp(entry.y, 0, Math.max(0, innerHeight - 30 - def.h - 90)) + 'px';
    const body = el('div', 'wg-body');
    w.appendChild(body);
    layer().appendChild(w);

    const ctx = {
      uid: entry.uid,
      data: entry.data || {},
      save(d) { entry.data = d; persist(); },
    };
    let dispose = null;
    try { dispose = def.render(body, ctx) || null; }
    catch (e) {
      console.error('[widgets] ошибка виджета', entry.type, e);
      body.innerHTML = `<div class="wgc-center" style="font-size:12px;color:var(--text-3)">Виджет сломался 😵</div>`;
    }
    live.set(entry.uid, { el: w, dispose, entry });

    // перетаскивание (кроме интерактивных элементов)
    w.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('textarea, input, button, select, a, [data-nodrag]')) return;
      const sx = e.clientX, sy = e.clientY;
      const ox = parseFloat(w.style.left), oy = parseFloat(w.style.top);
      let moved = false;
      const move = (ev) => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
        if (!moved) { moved = true; w.classList.add('dragging'); }
        w.style.left = clamp(ox + dx, 0, innerWidth - 60) + 'px';
        w.style.top = clamp(oy + dy, 0, innerHeight - 30 - 80) + 'px';
      };
      const up = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        w.classList.remove('dragging');
        if (moved) {
          entry.x = parseFloat(w.style.left);
          entry.y = parseFloat(w.style.top);
          persist();
        }
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });

    w.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      OS.contextMenu([
        { label: def.name, disabled: true },
        { sep: true },
        { label: 'Обновить', action: () => remount(entry.uid) },
        { label: 'Убрать виджет', action: () => remove(entry.uid) },
        { sep: true },
        { label: 'Добавить виджет…', action: openGallery },
      ], e.clientX, e.clientY);
    });
  }

  function unmount(uidv) {
    const inst = live.get(uidv);
    if (!inst) return;
    try { if (inst.dispose) inst.dispose(); } catch (e) { /* — */ }
    inst.el.remove();
    live.delete(uidv);
  }

  function remount(uidv) {
    const entry = entries.find(e => e.uid === uidv);
    unmount(uidv);
    if (entry) mount(entry);
  }

  // свободное место слева, колонками, без пересечений с другими виджетами
  function findSpot(def) {
    const GAP = 14;
    for (let col = 0; col < 5; col++) {
      for (let row = 0; row < 4; row++) {
        const x = 24 + col * 254;
        const y = 18 + row * 208;
        if (y + def.h > innerHeight - 30 - 100) continue;
        const clash = entries.some(e => {
          const d = registry.get(e.type);
          if (!d) return false;
          return !(e.x + d.w + GAP <= x || x + def.w + GAP <= e.x ||
                   e.y + d.h + GAP <= y || y + def.h + GAP <= e.y);
        });
        if (!clash) return { x, y };
      }
    }
    return { x: 40 + entries.length * 26, y: 30 + entries.length * 26 };
  }

  function add(type) {
    const def = registry.get(type);
    if (!def) return;
    const spot = findSpot(def);
    const entry = { uid: uid('wg'), type, x: spot.x, y: spot.y, data: {} };
    entries.push(entry);
    persist();
    mount(entry);
  }

  function remove(uidv) {
    const inst = live.get(uidv);
    entries = entries.filter(e => e.uid !== uidv);
    persist();
    if (inst) {
      inst.el.classList.add('wg-out');
      setTimeout(() => unmount(uidv), 190);
    }
  }

  /* ================= галерея ================= */

  function openGallery() {
    if (document.getElementById('wg-gallery')) return;
    const g = el('div');
    g.id = 'wg-gallery';
    g.innerHTML = `
      <div class="wg-panel">
        <div class="wg-head"><h2>Виджеты</h2><button class="ui-btn wg-x">Готово</button></div>
        <div class="wg-grid">
          ${Array.from(registry.values()).map(d => `
            <div class="wg-card" data-w="${esc(d.id)}">
              <div class="wg-prev">${d.preview || '🧩'}</div>
              <div class="wg-name">${esc(d.name)}</div>
              <div class="wg-desc">${esc(d.desc || '')}</div>
              <button class="ui-btn primary">Добавить</button>
            </div>`).join('')}
        </div>
      </div>`;
    document.body.appendChild(g);
    const close = () => g.remove();
    g.querySelector('.wg-x').addEventListener('click', close);
    g.addEventListener('click', (e) => { if (e.target === g) close(); });
    const onKey = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
    document.addEventListener('keydown', onKey);
    g.querySelectorAll('.wg-card').forEach(card => {
      card.querySelector('button').addEventListener('click', () => {
        add(card.dataset.w);
        OS.beep(760, .07);
      });
    });
  }

  /* ================= встроенные виджеты ================= */

  const MON_RU = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const DOW_RU = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];

  /* — Часы — */
  registry.set('w-clock', {
    id: 'w-clock', name: 'Часы', desc: 'Аналоговые часы с датой', w: 176, h: 190, preview: '🕒',
    render(body) {
      body.innerHTML = `
        <div class="wgc-center">
          <svg width="118" height="118" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="56" fill="var(--content-bg)" stroke="var(--divider)" stroke-width="1.5"/>
            ${[0, 1, 2, 3].map(i => {
              const a = i * 90 * Math.PI / 180;
              return `<circle cx="${60 + 47 * Math.sin(a)}" cy="${60 - 47 * Math.cos(a)}" r="2.2" fill="var(--accent)"/>`;
            }).join('')}
            <line class="wh" x1="60" y1="60" x2="60" y2="33" stroke="var(--text)" stroke-width="4.5" stroke-linecap="round"/>
            <line class="wm" x1="60" y1="60" x2="60" y2="22" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/>
            <line class="ws" x1="60" y1="67" x2="60" y2="18" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="60" cy="60" r="3.2" fill="var(--accent)"/>
          </svg>
          <div class="wg-clock-date"></div>
        </div>`;
      const hh = body.querySelector('.wh'), mm = body.querySelector('.wm'), ss = body.querySelector('.ws');
      const dateEl = body.querySelector('.wg-clock-date');
      const tick = () => {
        const d = new Date();
        const s = d.getSeconds(), m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
        ss.setAttribute('transform', `rotate(${s * 6} 60 60)`);
        mm.setAttribute('transform', `rotate(${m * 6} 60 60)`);
        hh.setAttribute('transform', `rotate(${h * 30} 60 60)`);
        dateEl.textContent = `${DOW_RU[d.getDay()]}, ${d.getDate()} ${MON_RU[d.getMonth()]}`;
      };
      tick();
      const t = setInterval(tick, 1000);
      return () => clearInterval(t);
    },
  });

  /* — Календарь — */
  registry.set('w-cal', {
    id: 'w-cal', name: 'Календарь', desc: 'Текущий месяц с сегодняшним днём', w: 208, h: 208, preview: '📅',
    render(body) {
      const MONF = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
      let shownKey = '';
      const draw = () => {
        const d = new Date();
        const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
        if (key === shownKey) return;
        shownKey = key;
        const y = d.getFullYear(), mo = d.getMonth(), today = d.getDate();
        const firstDow = (new Date(y, mo, 1).getDay() + 6) % 7;
        const daysIn = new Date(y, mo + 1, 0).getDate();
        let cells = '';
        ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].forEach(dw => cells += `<div class="cal-dow">${dw}</div>`);
        for (let i = 0; i < firstDow; i++) cells += `<div class="cal-day other"></div>`;
        for (let day = 1; day <= daysIn; day++) cells += `<div class="cal-day ${day === today ? 'today' : ''}">${day}</div>`;
        body.innerHTML = `<div class="wg-cal">
          <div class="cal-head"><span class="cal-month">${MONF[mo]}</span> <span>${y}</span></div>
          <div class="cal-grid">${cells}</div>
        </div>`;
      };
      draw();
      const t = setInterval(draw, 30000);
      return () => clearInterval(t);
    },
  });

  /* — Стикер — */
  registry.set('w-note', {
    id: 'w-note', name: 'Стикер', desc: 'Быстрая заметка, всегда на столе', w: 220, h: 168, preview: '📝',
    render(body, ctx) {
      body.classList.add('wg-note');
      const ta = el('textarea', 'wg-note-ta');
      ta.placeholder = 'Записать что-нибудь…';
      ta.spellcheck = false;
      ta.value = (ctx.data && ctx.data.text) || '';
      ta.addEventListener('input', OS.debounce(() => ctx.save({ text: ta.value }), 400));
      ta.addEventListener('keydown', (e) => e.stopPropagation());
      body.appendChild(ta);
    },
  });

  /* — Монитор — */
  registry.set('w-mon', {
    id: 'w-mon', name: 'Монитор', desc: 'Процессор, память и хранилище', w: 236, h: 170, preview: '📈',
    render(body) {
      body.innerHTML = `
        <div class="wg-title-row">Система</div>
        <div class="wg-mon-rows">
          <div class="wg-mon-row"><span class="c-lbl">ЦП</span><div class="wg-mon-bar"><div class="c-bar"></div></div></div>
          <div class="wg-mon-row"><span class="m-lbl">Память</span><div class="wg-mon-bar"><div class="m-bar"></div></div></div>
          <div class="wg-mon-row"><span class="s-lbl">Хранилище</span><div class="wg-mon-bar"><div class="s-bar"></div></div></div>
        </div>`;
      let cpu = 8 + Math.random() * 10, mem = 30 + Math.random() * 15;
      const upd = () => {
        cpu = clamp(cpu + (Math.random() - 0.5) * 7, 2, 92);
        mem = clamp(mem + (Math.random() - 0.5) * 3, 18, 88);
        const used = OS.vfs.usage();
        const stPct = clamp(used / (5 * 1024 * 1024) * 100, 0.5, 100);
        body.querySelector('.c-lbl').textContent = `ЦП · ${cpu.toFixed(0)}%`;
        body.querySelector('.c-bar').style.width = cpu + '%';
        body.querySelector('.m-lbl').textContent = `Память · ${mem.toFixed(0)}%`;
        body.querySelector('.m-bar').style.width = mem + '%';
        body.querySelector('.s-lbl').textContent = `Хранилище · ${OS.fmtBytes(used)}`;
        body.querySelector('.s-bar').style.width = stPct + '%';
      };
      upd();
      const t = setInterval(upd, 1600);
      return () => clearInterval(t);
    },
  });

  /* — Погода — */
  const CITIES = [
    { name: 'Москва', lat: 55.75, lon: 37.62 },
    { name: 'Санкт-Петербург', lat: 59.94, lon: 30.31 },
    { name: 'Лондон', lat: 51.51, lon: -0.13 },
    { name: 'Нью-Йорк', lat: 40.71, lon: -74.01 },
    { name: 'Токио', lat: 35.68, lon: 139.69 },
    { name: 'Дубай', lat: 25.2, lon: 55.27 },
    { name: 'Сидней', lat: -33.87, lon: 151.21 },
  ];
  function weatherOf(code, isDay) {
    if (code === 0) return [isDay ? '☀️' : '🌙', 'Ясно'];
    if (code <= 2) return [isDay ? '🌤️' : '☁️', 'Переменная облачность'];
    if (code === 3) return ['☁️', 'Пасмурно'];
    if (code === 45 || code === 48) return ['🌫️', 'Туман'];
    if (code >= 51 && code <= 67) return ['🌧️', 'Дождь'];
    if (code >= 71 && code <= 77) return ['❄️', 'Снег'];
    if (code >= 80 && code <= 82) return ['🌦️', 'Ливень'];
    if (code >= 95) return ['⛈️', 'Гроза'];
    return ['🌡️', 'Погода'];
  }
  registry.set('w-weather', {
    id: 'w-weather', name: 'Погода', desc: 'Текущая погода (нужен интернет)', w: 236, h: 150, preview: '⛅',
    render(body, ctx) {
      let cityIdx = Math.max(0, CITIES.findIndex(c => c.name === (ctx.data && ctx.data.city)));
      body.innerHTML = `
        <div class="wg-title-row">Погода
          <select class="wg-weather-city" data-nodrag>
            ${CITIES.map((c, i) => `<option value="${i}" ${i === cityIdx ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="wg-weather-main">
          <div class="we-emoji">⏳</div>
          <div><div class="we-t">—</div><div class="we-d">Загрузка…</div></div>
        </div>`;
      const emojiEl = body.querySelector('.we-emoji');
      const tEl = body.querySelector('.we-t');
      const dEl = body.querySelector('.we-d');

      let alive = true;
      async function fetchWeather() {
        const c = CITIES[cityIdx];
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 8000);
          const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current_weather=true`, { signal: ctrl.signal });
          clearTimeout(timer);
          const j = await r.json();
          if (!alive || !j.current_weather) throw new Error('нет данных');
          const cw = j.current_weather;
          const [emoji, desc] = weatherOf(cw.weathercode, cw.is_day);
          emojiEl.textContent = emoji;
          tEl.textContent = `${Math.round(cw.temperature)}°`;
          dEl.textContent = `${desc} · ветер ${Math.round(cw.windspeed)} км/ч`;
          ctx.save({ city: c.name, cache: { t: cw.temperature, code: cw.weathercode, day: cw.is_day, ts: Date.now() } });
        } catch (e) {
          if (!alive) return;
          const cache = ctx.data && ctx.data.cache;
          if (cache) {
            const [emoji, desc] = weatherOf(cache.code, cache.day);
            emojiEl.textContent = emoji;
            tEl.textContent = `${Math.round(cache.t)}°`;
            dEl.textContent = `${desc} · данные не свежие`;
          } else {
            emojiEl.textContent = '📡';
            tEl.textContent = '—';
            dEl.textContent = 'Нет соединения';
          }
        }
      }
      body.querySelector('select').addEventListener('change', (e) => {
        cityIdx = +e.target.value;
        ctx.save({ ...(ctx.data || {}), city: CITIES[cityIdx].name });
        emojiEl.textContent = '⏳'; tEl.textContent = '—'; dEl.textContent = 'Загрузка…';
        fetchWeather();
      });
      fetchWeather();
      const t = setInterval(fetchWeather, 20 * 60 * 1000);
      return () => { alive = false; clearInterval(t); };
    },
  });

  /* — Фото — */
  registry.set('w-photo', {
    id: 'w-photo', name: 'Фоторамка', desc: 'Картинки из папки «Изображения», клик — следующая', w: 220, h: 172, preview: '🖼️',
    render(body, ctx) {
      let idx = (ctx.data && ctx.data.idx) || 0;
      const collect = () => {
        const out = [];
        const walk = (dir) => {
          let items;
          try { items = OS.vfs.list(dir); } catch (e) { return; }
          items.forEach(i => {
            if (i.type === 'dir') walk(i.path);
            else if (/\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(i.name)) out.push(i.path);
          });
        };
        walk('/Pictures');
        return out;
      };
      const show = () => {
        const photos = collect();
        if (!photos.length) {
          body.innerHTML = `<div class="wg-photo-empty">🖼️<div>Нет картинок в «Изображениях»</div><div style="font-size:11px;opacity:.7">Нарисуй что-нибудь в Paint!</div></div>`;
          return;
        }
        idx = ((idx % photos.length) + photos.length) % photos.length;
        let src = null;
        try {
          const c = OS.vfs.read(photos[idx]);
          if (c.startsWith('data:')) src = c;
          else if (photos[idx].toLowerCase().endsWith('.svg')) src = 'data:image/svg+xml,' + encodeURIComponent(c);
        } catch (e) { /* — */ }
        body.innerHTML = `<div class="wg-photo-img" style="${src ? `background-image:url('${src}')` : ''}" title="Клик — следующая"></div>`;
        body.querySelector('.wg-photo-img').addEventListener('click', () => {
          idx++;
          ctx.save({ idx });
          show();
        });
      };
      show();
      const un = OS.on('vfs:change', OS.debounce(({ path }) => { if (path.startsWith('/Pictures')) show(); }, 300));
      return () => un();
    },
  });

  /* ================= init / API ================= */

  function init() {
    if (layerReady) return;
    layerReady = true;
    entries = (OS.settings.get('widgets') || []).map(e => ({ ...e }));
    entries.forEach(mount);
    // стартовый набор при первом запуске
    if (!OS.settings.get('widgetsSeeded')) {
      OS.settings.set('widgetsSeeded', true);
      if (!entries.length) {
        add('w-clock');
        add('w-weather');
      }
    }
  }

  OS.widgets = {
    register: (def) => registry.set(def.id, def),
    add, remove, openGallery, init,
    all: () => Array.from(registry.values()),
  };
})();

</script>
  <script>
/* === js/core/assistant.js === */
/* ============================================================
   Hiko OS · assistant — шина ассистента
   Встроенный текстовый помощник + точка подключения внешнего
   голосового ассистента: OS.assistant.registerProvider({...}).
   Контракт — docs/ASSISTANT_API.md.
   ============================================================ */
(function () {
  'use strict';
  const { el, esc } = OS;

  OS.injectStyle('core-assistant', `
    #assistant-panel {
      position: fixed;
      top: calc(var(--menubar-h) + 8px);
      right: 10px;
      width: 360px;
      height: min(560px, calc(100vh - 130px));
      display: flex;
      flex-direction: column;
      background: var(--glass-strong);
      backdrop-filter: blur(50px) saturate(180%);
      -webkit-backdrop-filter: blur(50px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-panel);
      box-shadow: var(--shadow-panel);
      z-index: 9200;
      animation: menu-in .18s var(--ease-out);
      overflow: hidden;
    }
    .as-head { flex: none; display: flex; align-items: center; gap: 9px; padding: 12px 14px 10px; }
    .as-head .as-orb {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      color: var(--on-accent); flex: none;
    }
    .as-head .as-orb svg { width: 16px; height: 16px; }
    .as-head .as-title { font-size: 14px; font-weight: 800; }
    .as-head .as-sub { font-size: 11px; color: var(--text-3); }
    .as-msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 12px; display: flex; flex-direction: column; gap: 8px; }
    .as-msg { max-width: 86%; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; animation: menu-in .18s var(--ease-out); user-select: text; }
    .as-msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 5px; }
    .as-msg.bot { align-self: flex-start; background: var(--ctl-bg); color: var(--text); border-bottom-left-radius: 5px; }
    .as-msg.thinking { color: var(--text-3); }
    .as-chips { flex: none; display: flex; gap: 6px; padding: 4px 12px 8px; flex-wrap: wrap; }
    .as-chip { padding: 4px 11px; border-radius: 999px; background: var(--ctl-bg); font-size: 12px; cursor: default; color: var(--text-2); }
    .as-chip:hover { background: var(--ctl-bg-hover); color: var(--text); }
    .as-input-row { flex: none; display: flex; gap: 7px; padding: 10px 12px 12px; border-top: 1px solid var(--divider); }
    .as-input-row input { flex: 1; }
    .as-mic.listening { background: #FF6B5E !important; color: #fff !important; animation: as-pulse 1.2s infinite; }
    @keyframes as-pulse { 50% { box-shadow: 0 0 0 7px rgba(255,107,94,.25); } }
  `);

  /* ==================== командная шина ==================== */

  const commands = new Map();
  function registerCommand(id, def) { commands.set(id, def); }
  function run(id, params) {
    const c = commands.get(id);
    if (!c) throw new Error('Неизвестная команда: ' + id);
    return c.run(params || {});
  }
  const commandList = () => Array.from(commands.entries()).map(([id, c]) => ({ id, desc: c.desc, params: c.params || null }));

  function findApp(raw) {
    const q = String(raw || '').trim().toLowerCase();
    if (!q) return null;
    const apps = OS.allApps();
    const tries = [q, q.replace(/[уюа]$/, 'а'), q.slice(0, -1), q.slice(0, -2)];
    for (const t of tries) {
      if (!t) continue;
      const hit = apps.find(a => a.id === t || a.name.toLowerCase() === t) ||
                  apps.find(a => a.name.toLowerCase().startsWith(t)) ||
                  apps.find(a => a.name.toLowerCase().includes(t));
      if (hit) return hit;
    }
    return null;
  }

  registerCommand('open-app', {
    desc: 'Открыть приложение', params: '{ name }',
    run({ name }) {
      const app = findApp(name);
      if (!app) throw new Error(`Не нашёл приложение «${name}»`);
      OS.launch(app.id);
      return `Открываю «${app.name}»`;
    },
  });
  registerCommand('close-all', { desc: 'Закрыть все окна', run() { OS.wm.closeAll(); return 'Все окна закрыты'; } });
  registerCommand('show-desktop', { desc: 'Показать рабочий стол', run() { OS.wm.showDesktop(); return 'Готово'; } });
  registerCommand('overview', { desc: 'Обзор всех окон', run() { OS.wm.missionToggle(); return 'Обзор окон'; } });
  registerCommand('set-theme', {
    desc: 'Сменить тему', params: "{ theme: 'dark'|'light' }",
    run({ theme }) {
      OS.settings.set('theme', theme === 'light' ? 'light' : 'dark');
      return theme === 'light' ? 'Включил светлую тему' : 'Включил тёмную тему';
    },
  });
  registerCommand('set-wallpaper', {
    desc: 'Сменить обои', params: '{ id? } — без id: случайные',
    run({ id }) {
      const cur = OS.settings.get('wallpaper');
      let wp = id ? OS.wallpapers.get(id) : null;
      if (!wp) {
        const rest = OS.wallpapers.presets.filter(p => p.id !== cur);
        wp = rest[Math.floor(Math.random() * rest.length)];
      }
      OS.settings.set('wallpaper', wp.id);
      return `Обои: «${wp.name}»`;
    },
  });
  registerCommand('create-note', {
    desc: 'Создать заметку', params: '{ text }',
    run({ text }) {
      const name = OS.vfs.uniqueName('/Documents', 'Заметка.txt');
      OS.vfs.write('/Documents/' + name, String(text || '') + '\n');
      OS.launch('textedit', { path: '/Documents/' + name });
      return `Заметка создана: ${name}`;
    },
  });
  registerCommand('search', {
    desc: 'Поиск файлов и приложений', params: '{ query }',
    run({ query }) {
      const files = OS.vfs.search(String(query || ''), 6).filter(f => !f.path.startsWith('/Trash'));
      const app = findApp(query);
      return { app: app ? { id: app.id, name: app.name } : null, files };
    },
  });
  registerCommand('get-time', {
    desc: 'Текущее время',
    run() {
      const d = new Date();
      return `Сейчас ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    },
  });
  registerCommand('get-date', {
    desc: 'Сегодняшняя дата',
    run() {
      return 'Сегодня ' + new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    },
  });
  registerCommand('volume', {
    desc: 'Громкость системы', params: '{ value: 0–100 }',
    run({ value }) {
      OS.settings.set('volume', OS.clamp(+value || 0, 0, 100));
      OS.beep(660, .1);
      return `Громкость ${OS.clamp(+value || 0, 0, 100)}%`;
    },
  });
  registerCommand('notify', {
    desc: 'Показать уведомление', params: '{ title, body }',
    run({ title, body }) { OS.notify({ title: title || 'Ассистент', body: body || '', appId: 'system' }); return 'Показал'; },
  });
  registerCommand('lock', { desc: 'Заблокировать экран', run() { setTimeout(() => OS.emit('session:lock'), 300); return 'Блокирую…'; } });
  registerCommand('shutdown', { desc: 'Выключить (с подтверждением)', run() { OS.emit('session:shutdown'); return 'Спрашиваю подтверждение…'; } });

  /* ==================== голос (Web Speech, если есть) ==================== */

  function say(text) {
    try {
      if (!window.speechSynthesis) return false;
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = 'ru-RU';
      u.volume = OS.settings.get('volume', 70) / 100;
      const ru = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ru'));
      if (ru) u.voice = ru;
      if (OS.aura) {
        const est = Math.min(14000, 1200 + String(text).length * 70);
        OS.aura.pulse(est);
        u.onend = () => { if (OS.aura) OS.aura.pulse(350); };
        u.onerror = () => { if (OS.aura) OS.aura.hide(); };
      }
      speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }

  function systemListen() {
    return new Promise((resolve, reject) => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { reject(new Error('Распознавание речи недоступно в этом браузере')); return; }
      const rec = new SR();
      rec.lang = 'ru-RU';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onresult = (e) => resolve(e.results[0][0].transcript);
      rec.onerror = (e) => reject(new Error(e.error === 'not-allowed' ? 'Нет доступа к микрофону' : 'Не расслышал'));
      rec.onend = () => reject(new Error('Не расслышал'));
      rec.start();
    });
  }

  /* ==================== встроенный обработчик ==================== */

  // quiet=true — режим для внешних провайдеров: только командные интенты,
  // без «личности» встроенного помощника; вернёт null, если ничего не понял.
  function builtinHandle(text, quiet) {
    const q = String(text || '').trim().toLowerCase().replace(/[!?.]+$/, '');
    let m;
    if ((m = q.match(/^(?:открой|запусти|включи)\s+(.+)/))) return run('open-app', { name: m[1] });
    if (/^(закрой все|закрой всё|сверни вс)/.test(q)) return run('close-all');
    if (/покажи (рабочий )?стол/.test(q)) return run('show-desktop');
    if (/^(обзор( окон)?|все окна)$/.test(q)) return run('overview');
    if (/(тёмн|темн|ночн)/.test(q) && /(тем|режим)/.test(q)) return run('set-theme', { theme: 'dark' });
    if (/светл/.test(q) && /(тем|режим)/.test(q)) return run('set-theme', { theme: 'light' });
    if (/(смени|поменяй|другие|случайные)\s+обои|обои\s+(смени|поменяй)/.test(q)) return run('set-wallpaper', {});
    if (/который час|сколько времени|^время$/.test(q)) return run('get-time');
    if (/какой сегодня день|какое.*число|^дата$/.test(q)) return run('get-date');
    if ((m = q.match(/^(?:создай заметку|запиши|заметка)[:,]?\s*(.*)/))) return run('create-note', { text: m[1] || 'Новая заметка' });
    if ((m = q.match(/^громкость\s+(\d+)/))) return run('volume', { value: +m[1] });
    if (/^заблокируй/.test(q)) return run('lock');
    if (/^выключи(сь| компьютер| систему)?$/.test(q)) return run('shutdown');
    if ((m = q.match(/^(?:найди|поиск)\s+(.+)/))) {
      const r = run('search', { query: m[1] });
      const parts = [];
      if (r.app) { OS.launch(r.app.id); parts.push(`Открываю «${r.app.name}»`); }
      if (r.files.length) parts.push('Нашёл: ' + r.files.map(f => f.name).join(', '));
      return parts.length ? parts.join('\n') : 'Ничего не нашёл';
    }
    if ((m = q.match(/^посчитай\s+(.+)/)) || /^[\d\s+\-*/().,%]+$/.test(q)) {
      const expr = (m ? m[1] : q).replace(/,/g, '.').replace(/[×х]/g, '*').replace(/[÷:]/g, '/').replace(/\s+/g, '');
      if (/^[\d+\-*/().%]+$/.test(expr) && /\d/.test(expr)) {
        try {
          const val = Function('"use strict";return (' + expr + ')')();
          if (isFinite(val)) return 'Будет ' + String(+val.toPrecision(12)).replace('.', ',');
        } catch (e) { /* не выражение */ }
      }
    }
    if (quiet) return null;
    if (/кто ты|как тебя зовут/.test(q)) return 'Я встроенный помощник Hiko. Когда подключишь своего голосового ассистента (docs/ASSISTANT_API.md) — я уступлю ему место.';
    if (/помощь|что (ты )?умеешь|команды/.test(q)) {
      return 'Умею: «открой <приложение>», «найди <что-то>», «создай заметку <текст>», «тёмная/светлая тема», «смени обои», «который час», «какой сегодня день», «громкость 50», «посчитай 22*3», «покажи стол», «обзор окон», «закрой все», «заблокируй», «выключи».';
    }
    return 'Пока не понимаю. Скажи «помощь» — покажу, что умею.';
  }

  /* ==================== провайдер ==================== */

  let provider = null;
  const history = [];

  function registerProvider(p) {
    if (!p || typeof p.handle !== 'function') {
      console.error('[assistant] провайдеру нужен handle(text, ctx)');
      return false;
    }
    provider = p;
    OS.emit('assistant:provider', { id: p.id, name: p.name });
    if (!p.quiet) OS.notify({ title: 'Ассистент', body: `«${p.name || p.id}» подключён 🎙`, appId: 'system' });
    const head = document.querySelector('#assistant-panel .as-sub');
    if (head) head.textContent = p.name || p.id;
    return true;
  }

  async function ask(text) {
    const ctx = { run, commands: commandList(), say, history: history.slice(-20), findApp };
    let res;
    if (provider) res = await provider.handle(text, ctx);
    else res = builtinHandle(text);
    if (res == null) res = 'Готово';
    if (typeof res !== 'object' || Array.isArray(res)) res = { text: typeof res === 'string' ? res : JSON.stringify(res) };
    if (res.speak) say(typeof res.speak === 'string' ? res.speak : res.text);
    return res;
  }

  /* ==================== панель ==================== */

  let panel = null;

  function addMsg(kind, text) {
    if (!panel) return null;
    const box = panel.querySelector('.as-msgs');
    const msg = el('div', 'as-msg ' + kind, esc(text));
    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
    return msg;
  }

  async function submit(text) {
    text = String(text || '').trim();
    if (!text || !panel) return;
    history.push({ role: 'user', text });
    addMsg('me', text);
    const thinking = addMsg('bot thinking', '…');
    try {
      const res = await ask(text);
      history.push({ role: 'assistant', text: res.text });
      if (thinking) { thinking.classList.remove('thinking'); thinking.textContent = res.text; }
    } catch (e) {
      if (thinking) { thinking.classList.remove('thinking'); thinking.textContent = '⚠ ' + (e.message || e); }
    }
    const box = panel.querySelector('.as-msgs');
    if (box) box.scrollTop = box.scrollHeight;
  }

  function open() {
    if (panel) return;
    panel = el('div');
    panel.id = 'assistant-panel';
    const provName = provider ? (provider.name || provider.id) : 'встроенный помощник';
    panel.innerHTML = `
      <div class="as-head">
        <div class="as-orb">${OS.icons.spark}</div>
        <div><div class="as-title">Ассистент</div><div class="as-sub">${esc(provName)}</div></div>
      </div>
      <div class="as-msgs"></div>
      <div class="as-chips">
        <div class="as-chip">Который час?</div>
        <div class="as-chip">Открой Змейку</div>
        <div class="as-chip">Смени обои</div>
        <div class="as-chip">Что ты умеешь?</div>
      </div>
      <div class="as-input-row">
        <input class="ui-input" placeholder="Напиши или скажи…" spellcheck="false">
        <button class="ui-btn icon-only as-mic" title="Голосовой ввод">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11 C5 15 8 17.5 12 17.5 C16 17.5 19 15 19 11 M12 17.5 L12 21"/>
          </svg>
        </button>
      </div>`;
    document.body.appendChild(panel);

    const hello = provider && provider.hello
      ? provider.hello
      : 'Привет! Я помогу открыть приложение, найти файл, сменить тему или посчитать. Скажи «помощь».';
    addMsg('bot', hello);

    const input = panel.querySelector('input');
    input.focus();
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key === 'Enter') { submit(input.value); input.value = ''; }
      if (e.key === 'Escape') close();
    });
    panel.querySelectorAll('.as-chip').forEach(c => c.addEventListener('click', () => submit(c.textContent)));

    const mic = panel.querySelector('.as-mic');
    mic.addEventListener('click', async () => {
      mic.classList.add('listening');
      if (OS.aura) OS.aura.show();
      try {
        const heard = provider && provider.listen ? await provider.listen() : await systemListen();
        mic.classList.remove('listening');
        if (OS.aura) OS.aura.pulse(400);
        if (heard) submit(heard);
      } catch (e) {
        mic.classList.remove('listening');
        if (OS.aura) OS.aura.pulse(300);
        addMsg('bot', '🎙 ' + (e.message || 'Не получилось послушать'));
      }
    });

    setTimeout(() => document.addEventListener('pointerdown', outside, true), 0);
  }
  function outside(e) {
    if (panel && !panel.contains(e.target) && !e.target.closest('#mb-assist')) close();
  }
  function close() {
    if (!panel) return;
    const p = panel;
    panel = null;
    document.removeEventListener('pointerdown', outside, true);
    p.classList.add('panel-out');
    setTimeout(() => p.remove(), 170);
  }
  function toggle() { if (panel) close(); else open(); }

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.altKey && e.code === 'KeyH') {
      e.preventDefault();
      toggle();
    }
  });

  OS.assistant = {
    registerProvider,
    registerCommand,
    run,
    commands: commandList,
    ask,
    say,
    findApp,
    builtin: (text) => builtinHandle(text, true),
    open, close, toggle,
    get provider() { return provider ? { id: provider.id, name: provider.name } : null; },
  };
})();

  <script>
/* === js/core/net.js === */
/* ============================================================
   Hiko OS · net — шина «Обход блокировок» (VPN-модули)
   Точка подключения внешнего модуля обхода: скачиваешь .js с
   GitHub, ставишь Установщиком — он вызывает OS.net.registerProvider,
   и система сама выносит переключатель в Центр управления.
   Честно: браузерная ОС не поднимает системный VPN — модуль
   маршрутизирует встроенный Браузер Hiko (и приложения, которые
   зовут OS.net.proxify) через свой прокси. Контракт — docs/NETWORK_API.md.
   ============================================================ */
(function () {
  'use strict';
  const S = OS.settings;

  let providers = []; // { id, name, region?, note?, proxify?, enable?, disable?, test? }

  const byId = (id) => providers.find(p => p.id === id) || null;

  // система уже загрузилась? (при старте boot.loadUserApps повторно выполняет
  // модули из /Apps — тогда «модуль готов» показывать не нужно)
  const bootDone = () => { const b = document.getElementById('boot'); return !b || b.classList.contains('hidden'); };

  function active() {
    return byId(S.get('vpnProvider', '')) || providers[0] || null;
  }

  function list() {
    return providers.map(p => ({ id: p.id, name: p.name || p.id, region: p.region || '', note: p.note || '' }));
  }

  function registerProvider(p) {
    if (!p || !p.id) { console.error('[net] модулю обхода нужен id'); return false; }
    providers = providers.filter(x => x.id !== p.id);
    providers.push(p);
    if (!S.get('vpnProvider', '')) S.set('vpnProvider', p.id);
    OS.emit('net:providers', list());
    // тост только при установке в работающей системе, не при каждом старте
    if (!p.quiet && bootDone()) {
      OS.notify({
        title: 'Обход блокировок',
        body: `Модуль «${p.name || p.id}»${p.region ? ' · ' + p.region : ''} готов. Включи его в Центре управления.`,
        appId: 'net',
      });
    }
    return true;
  }

  function isOn() { return !!S.get('vpnOn', false) && !!active(); }

  async function setOn(on) {
    on = !!on;
    const p = active();
    if (on && !p) {
      OS.notify({ title: 'Обход блокировок', body: 'Нет модуля обхода. Установи его в Центре управления или через Установщик.', appId: 'net' });
      S.set('vpnOn', false);
      OS.emit('net:state', { on: false, provider: null });
      return false;
    }
    try {
      if (on && p && p.enable) await p.enable();
      if (!on && p && p.disable) await p.disable();
    } catch (e) {
      OS.notify({ title: 'Обход блокировок', body: 'Модуль сообщил об ошибке: ' + (e.message || e), appId: 'net' });
    }
    S.set('vpnOn', on);
    OS.emit('net:state', { on, provider: p ? { id: p.id, name: p.name } : null });
    if (on) {
      OS.notify({
        title: 'Обход включён 🌐',
        body: `Через «${p.name || p.id}»${p.region ? ' · ' + p.region : ''}. Иностранные сайты теперь открываются в Браузере Hiko.`,
        appId: 'net',
      });
    }
    return on;
  }

  function toggle() { return setOn(!isOn()); }

  function setProvider(id) {
    if (byId(id)) { S.set('vpnProvider', id); OS.emit('net:providers', list()); }
  }

  // приложения зовут это перед сетевым запросом; при выключенном обходе — no-op
  function proxify(url) {
    if (!isOn()) return url;
    const p = active();
    try { return (p && p.proxify) ? p.proxify(String(url)) : url; } catch (e) { return url; }
  }

  /* --- встроенный демо-модуль: показывает контракт и делает маршрутизацию реальной --- */
  const DEMO_CODE = [
    "(function () {",
    "  'use strict';",
    "  OS.net.registerProvider({",
    "    id: 'demo-bypass',",
    "    name: 'Обход (демо)',",
    "    region: 'Auto',",
    "    note: 'Пример модуля: маршрутизирует Браузер Hiko через веб-прокси. Адрес прокси меняется в Настройках.',",
    "    proxify: function (url) {",
    "      var base = OS.settings.get('vpnProxyBase', 'https://corsproxy.io/?url=');",
    "      return base + encodeURIComponent(url);",
    "    },",
    "    enable: function () { /* демо: только маршрутизация Браузера, без системного VPN */ },",
    "    disable: function () {}",
    "  });",
    "})();",
  ].join('\n');

  OS.net = {
    registerProvider,
    providers: list,
    active: () => (active() ? active().id : null),
    isOn, setOn, toggle, setProvider, proxify,
    DEMO_CODE,
  };
})();

</script>

/* === js/core/aura.js === */
/* ============================================================
   Hiko OS · aura — цветное свечение по краям экрана, когда
   активен голосовой помощник (в духе Apple Intelligence).
   API: OS.aura.show() / hide() / pulse(ms).
   ============================================================ */
(function () {
  'use strict';

  OS.injectStyle('core-aura', `
    #ai-aura {
      position: fixed; inset: 0;
      z-index: 9450; /* над окнами/панелями/тостами, но под меню(9500) и диалогами(9800) */
      pointer-events: none;
      opacity: 0;
      transition: opacity .6s var(--ease-out);
      will-change: opacity;
    }
    #ai-aura.on { opacity: 1; }
    /* Мягкое свечение внутрь от краёв: не рамка, а размытые цветные пятна
       по углам и сторонам, аддитивно светящиеся поверх интерфейса — центр чистый. */
    #ai-aura::before, #ai-aura::after {
      content: "";
      position: absolute; inset: 0;
      transform-origin: center;
      -webkit-mask: radial-gradient(130% 130% at 50% 50%, transparent 16%, #000 68%);
              mask: radial-gradient(130% 130% at 50% 50%, transparent 16%, #000 68%);
      will-change: transform, filter;
    }
    #ai-aura::before {
      background:
        radial-gradient(64% 64% at 0% 0%,     rgba(255,64,112,1),  transparent 82%),
        radial-gradient(66% 66% at 100% 0%,   rgba(72,150,255,1),  transparent 82%),
        radial-gradient(68% 68% at 100% 100%, rgba(176,84,255,1),  transparent 82%),
        radial-gradient(66% 66% at 0% 100%,   rgba(46,224,150,1),  transparent 82%),
        radial-gradient(85% 48% at 50% 0%,    rgba(255,184,92,.95), transparent 85%),
        radial-gradient(48% 85% at 100% 50%,  rgba(110,132,255,.95), transparent 85%),
        radial-gradient(85% 48% at 50% 100%,  rgba(52,235,206,.95), transparent 85%),
        radial-gradient(48% 85% at 0% 50%,    rgba(255,104,164,.95), transparent 85%);
      filter: blur(34px);
      animation: aura-hue1 9s linear infinite, aura-breathe1 5s ease-in-out infinite;
    }
    #ai-aura::after {
      background:
        radial-gradient(64% 64% at 0% 0%,     rgba(110,132,255,1), transparent 82%),
        radial-gradient(66% 66% at 100% 0%,   rgba(52,235,206,1),  transparent 82%),
        radial-gradient(68% 68% at 100% 100%, rgba(255,150,84,1),  transparent 82%),
        radial-gradient(66% 66% at 0% 100%,   rgba(176,84,255,1),  transparent 82%);
      filter: blur(24px);
      opacity: .8;
      animation: aura-hue2 13s linear infinite reverse, aura-breathe2 6.5s ease-in-out infinite;
    }
    @keyframes aura-hue1 { from { filter: blur(34px) hue-rotate(0deg); } to { filter: blur(34px) hue-rotate(360deg); } }
    @keyframes aura-hue2 { from { filter: blur(24px) hue-rotate(0deg); } to { filter: blur(24px) hue-rotate(360deg); } }
    @keyframes aura-breathe1 { 0%, 100% { transform: scale(1.02); } 50% { transform: scale(1.09); } }
    @keyframes aura-breathe2 { 0%, 100% { transform: scale(1.07); } 50% { transform: scale(1.0); } }
  `);

  let auraEl = null;
  let hideT = null;

  function ensure() {
    if (!auraEl) {
      auraEl = document.createElement('div');
      auraEl.id = 'ai-aura';
      document.body.appendChild(auraEl);
    }
    return auraEl;
  }

  function show() {
    clearTimeout(hideT);
    // reflow, чтобы transition сработал при повторном show
    const n = ensure();
    void n.offsetWidth;
    n.classList.add('on');
  }
  function hide() {
    clearTimeout(hideT);
    if (auraEl) auraEl.classList.remove('on');
  }
  function pulse(ms) {
    show();
    clearTimeout(hideT);
    hideT = setTimeout(hide, ms || 2200);
  }

  OS.aura = { show, hide, pulse };
})();

      refresh();
    }
    function goBack() { if (st.hi > 0) { st.hi--; st.cwd = st.hist[st.hi]; st.sel.clear(); st.q = ''; searchEl.value = ''; refresh(); } }
    function goFwd() { if (st.hi < st.hist.length - 1) { st.hi++; st.cwd = st.hist[st.hi]; st.sel.clear(); st.q = ''; searchEl.value = ''; refresh(); } }

    /* ---------- отрисовка ---------- */
    function renderCrumbs() {
      const parts = st.cwd.split('/').filter(Boolean);
      let html = `<span class="fnd-crumb${parts.length ? '' : ' cur'}" data-path="/">Hiko OS</span>`;
      let acc = '';
      parts.forEach((p, i) => {
        acc += '/' + p;
        const cur = i === parts.length - 1;
        html += `<span class="fnd-crumb-sep">›</span>`;
        html += `<span class="fnd-crumb${cur ? ' cur' : ''}" data-path="${esc(acc)}">${esc(dispName(acc))}</span>`;
      });
      crumbsEl.innerHTML = html;
    }

    function renderSidebar() {
      let html = `<div class="ui-side-title">Избранное</div>`;
      for (const f of FAVS) {
        html += `<div class="ui-side-item${st.cwd === f.path ? ' on' : ''}" data-path="${esc(f.path)}">${f.icon}<span>${esc(f.label)}</span></div>`;
      }
      const tc = vfs.trashCount();
      html += `<div class="fnd-side-gap"></div><div class="ui-side-title">Система</div>`;
      html += `<div class="ui-side-item${inTrash() ? ' on' : ''}" data-path="/Trash">${SIDE.trash}<span>Корзина${tc ? ` (${tc})` : ''}</span></div>`;
      sideEl.innerHTML = html;
    }

    function renderView() {
      let items = [];
      try { items = vfs.list(st.cwd); } catch (e) { items = []; }
      if (st.q) {
        const q = st.q.toLowerCase();
        items = items.filter(i => i.name.toLowerCase().includes(q));
      }
      st.shown = items;
      for (const p of Array.from(st.sel)) {
        if (!items.some(i => i.path === p)) st.sel.delete(p);
      }

      if (!items.length) {
        const msg = st.q ? 'Ничего не найдено' : (inTrash() ? 'Корзина пуста' : 'Папка пуста');
        mainEl.innerHTML = `<div class="ui-empty">${inTrash() ? OS.icons.trashEmpty : OS.icons.folder}<div>${msg}</div></div>`;
        return;
      }

      if (st.view === 'grid') {
        let html = `<div class="fnd-grid">`;
        for (const it of items) {
          html += `<div class="fnd-item fnd-gitem${st.sel.has(it.path) ? ' sel' : ''}" data-path="${esc(it.path)}" data-type="${it.type}">
            <div class="fnd-ico">${OS.fileIcon(it)}</div>
            <div class="fnd-name">${esc(it.name)}</div>
          </div>`;
        }
        mainEl.innerHTML = html + `</div>`;
      } else {
        let html = `<div class="fnd-list">
          <div class="fnd-lhead"><div>Имя</div><div>Дата изменения</div><div>Размер</div></div>`;
        for (const it of items) {
          const size = it.type === 'dir' ? objWord(it.size) : OS.fmtBytes(it.size);
          html += `<div class="fnd-item fnd-lrow${st.sel.has(it.path) ? ' sel' : ''}" data-path="${esc(it.path)}" data-type="${it.type}">
            <div class="fnd-lname">${OS.fileIcon(it)}<span class="fnd-name">${esc(it.name)}</span></div>
            <div class="fnd-dim">${esc(OS.fmtDate(it.modified))}</div>
            <div class="fnd-dim">${esc(size)}</div>
          </div>`;
        }
        mainEl.innerHTML = html + `</div>`;
      }
    }

    function applySel() {
      mainEl.querySelectorAll('.fnd-item').forEach(n => n.classList.toggle('sel', st.sel.has(n.dataset.path)));
    }

    function updateStatus() {
      let text = objWord(st.shown.length);
      if (st.sel.size) text += ` · выбрано ${st.sel.size}`;
      if (clip.paths.length) text += ` · в буфере: ${clip.paths.length}`;
      statusEl.textContent = text;
    }

    function updateChrome() {
      btnBack.disabled = st.hi <= 0;
      btnFwd.disabled = st.hi >= st.hist.length - 1;
      segGrid.classList.toggle('on', st.view === 'grid');
      segList.classList.toggle('on', st.view === 'list');
      const t = inTrash();
      btnEmptyTrash.classList.toggle('hidden', !t);
      btnEmptyTrash.disabled = vfs.trashCount() === 0;
      win.setTitle(dispName(st.cwd) + ' — Файлы');
    }

    function refresh() {
      renderCrumbs();
      renderSidebar();
      renderView();
      updateStatus();
      updateChrome();
    }

    /* ---------- операции ---------- */
    function openItem(it) {
      if (it.type === 'dir') goTo(it.path);
      else OS.openFile(it.path);
    }
    function openSelection() {
      const items = st.shown.filter(i => st.sel.has(i.path));
      if (items.length === 1) { openItem(items[0]); return; }
      for (const it of items) OS.openFile(it.path);
    }

    function newFolder() {
      if (inTrash()) return;
      try {
        const name = vfs.uniqueName(st.cwd, 'Новая папка');
        const p = vfs.mkdir(vfs.join(st.cwd, name));
        st.sel = new Set([p]);
        refresh();
        startRename(p);
      } catch (e) { OS.dialog.alert('Файлы', e.message); }
    }
    function newDoc() {
      if (inTrash()) return;
      try {
        const name = vfs.uniqueName(st.cwd, 'Новый документ.txt');
        const p = vfs.write(vfs.join(st.cwd, name), '');
        st.sel = new Set([p]);
        refresh();
        startRename(p);
      } catch (e) { OS.dialog.alert('Файлы', e.message); }
    }

    function copySelection(mode) {
      if (!st.sel.size) return;
      clip.mode = mode;
      clip.paths = Array.from(st.sel);
      updateStatus();
    }

    function pasteHere() {
      if (!clip.paths.length || inTrash()) return;
      for (const p of clip.paths) {
        if (!vfs.exists(p)) continue;
        if (clip.mode === 'cut' && vfs.parentOf(p) === st.cwd) continue;
        try {
          const dest = vfs.join(st.cwd, vfs.uniqueName(st.cwd, vfs.nameOf(p)));
          if (clip.mode === 'cut') vfs.mv(p, dest);
          else vfs.cp(p, dest);
        } catch (e) { OS.dialog.alert('Файлы', e.message); }
      }
      if (clip.mode === 'cut') { clip.mode = null; clip.paths = []; }
      refresh();
    }

    function duplicateSelection() {
      for (const p of Array.from(st.sel)) {
        if (!vfs.exists(p)) continue;
        try {
          const name = vfs.nameOf(p);
          const dot = name.lastIndexOf('.');
          const base = dot > 0 ? `${name.slice(0, dot)} копия${name.slice(dot)}` : `${name} копия`;
          const dir = vfs.parentOf(p);
          vfs.cp(p, vfs.join(dir, vfs.uniqueName(dir, base)));
        } catch (e) { OS.dialog.alert('Файлы', e.message); }
      }
      refresh();
    }

    function trashSelection() {
      for (const p of Array.from(st.sel)) {
        try { vfs.rm(p, { toTrash: true }); } catch (e) { OS.dialog.alert('Файлы', e.message); }
      }
      st.sel.clear();
      refresh();
    }

    async function deleteForever() {
      const n = st.sel.size;
      if (!n) return;
      const ok = await OS.dialog.confirm('Удалить навсегда?',
        `${plural(n, 'Объект будет удалён', 'Объекта будут удалены', 'Объектов будет удалено')}: ${n}. Это действие нельзя отменить.`,
        { okLabel: 'Удалить', danger: true });
      if (!ok) return;
      for (const p of Array.from(st.sel)) {
        try { vfs.rm(p); } catch (e) { OS.dialog.alert('Файлы', e.message); }
      }
      st.sel.clear();
      refresh();
    }

    function restoreSelection() {
      for (const p of Array.from(st.sel)) {
        try { vfs.restore(p); } catch (e) { OS.dialog.alert('Файлы', e.message); }
      }
      st.sel.clear();
      refresh();
    }

    async function emptyTrash() {
      const n = vfs.trashCount();
      if (!n) return;
      const ok = await OS.dialog.confirm('Очистить корзину?',
        `Безвозвратно удалить все объекты (${n}) из корзины?`,
        { okLabel: 'Очистить', danger: true });
      if (ok) { vfs.emptyTrash(); refresh(); }
    }

    function setView(v) {
      st.view = v;
      OS.settings.set('finderView', v);
      renderView();
      updateChrome();
      updateStatus();
    }

    /* ---------- инлайн-переименование ---------- */
    function startRename(path) {
      const item = mainEl.querySelector(`.fnd-item[data-path="${CSS.escape(path)}"]`);
      if (!item) return;
      const nameEl = item.querySelector('.fnd-name');
      if (!nameEl) return;
      const old = vfs.nameOf(path);
      st.renaming = true;
      nameEl.innerHTML = '';
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.spellcheck = false;
      inp.className = 'ui-input fnd-ren';
      inp.value = old;
      nameEl.appendChild(inp);
      inp.focus();
      const dot = old.lastIndexOf('.');
      try { inp.setSelectionRange(0, dot > 0 ? dot : old.length); } catch (e) { /* ок */ }

      let done = false;
      const finish = (commit) => {
        if (done) return;
        done = true;
        st.renaming = false;
        const nn = inp.value.trim();
        if (commit && nn && nn !== old && !nn.includes('/')) {
          try {
            const dest = vfs.join(vfs.parentOf(path), nn);
            vfs.mv(path, dest);
            st.sel.delete(path);
            st.sel.add(dest);
          } catch (e) { OS.dialog.alert('Файлы', e.message); }
        }
        refresh();
        mainEl.focus();
      };
      inp.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') finish(true);
        else if (e.key === 'Escape') finish(false);
      });
      inp.addEventListener('blur', () => finish(true));
      inp.addEventListener('pointerdown', (e) => e.stopPropagation());
      inp.addEventListener('click', (e) => e.stopPropagation());
      inp.addEventListener('dblclick', (e) => e.stopPropagation());
    }

    /* ---------- контекстные меню ---------- */
    function itemMenu(e) {
      const single = st.sel.size === 1;
      const items = st.shown.filter(i => st.sel.has(i.path));
      if (inTrash()) {
        const canRestore = items.some(i => i.meta && i.meta.origPath);
        OS.contextMenu([
          { label: 'Открыть', action: openSelection },
          { sep: true },
          { label: 'Восстановить', disabled: !canRestore, action: restoreSelection },
          { label: 'Удалить навсегда', hotkey: 'Del', action: deleteForever },
        ], e.clientX, e.clientY);
        return;
      }
      OS.contextMenu([
        { label: 'Открыть', action: openSelection },
        { sep: true },
        { label: 'Переименовать', hotkey: 'F2', disabled: !single, action: () => startRename(firstSel()) },
        { label: 'Дублировать', action: duplicateSelection },
        { sep: true },
        { label: 'Копировать', hotkey: 'Ctrl+C', action: () => copySelection('copy') },
        { label: 'Вырезать', hotkey: 'Ctrl+X', action: () => copySelection('cut') },
        { sep: true },
        { label: 'Переместить в корзину', hotkey: 'Del', action: trashSelection },
      ], e.clientX, e.clientY);
    }

    function emptyMenu(e) {
      if (inTrash()) {
        OS.contextMenu([
          { label: 'Очистить корзину', disabled: vfs.trashCount() === 0, action: emptyTrash },
          { sep: true },
          { label: 'Обновить', action: refresh },
        ], e.clientX, e.clientY);
        return;
      }
      OS.contextMenu([
        { label: 'Новая папка', hotkey: 'Ctrl+Shift+N', action: newFolder },
        { label: 'Новый документ', action: newDoc },
        { sep: true },
        { label: 'Вставить', hotkey: 'Ctrl+V', disabled: !clip.paths.length, action: pasteHere },
        { sep: true },
        { label: 'Обновить', action: refresh },
      ], e.clientX, e.clientY);
    }

    /* ---------- события ---------- */
    btnBack.addEventListener('click', goBack);
    btnFwd.addEventListener('click', goFwd);
    btnEmptyTrash.addEventListener('click', emptyTrash);
    segGrid.addEventListener('click', () => setView('grid'));
    segList.addEventListener('click', () => setView('list'));

    searchEl.addEventListener('input', () => {
      st.q = searchEl.value.trim();
      renderView();
      updateStatus();
    });
    searchEl.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { searchEl.value = ''; st.q = ''; renderView(); updateStatus(); mainEl.focus(); }
      e.stopPropagation();
    });

    crumbsEl.addEventListener('click', (e) => {
      const c = e.target.closest('.fnd-crumb');
      if (c && c.dataset.path !== st.cwd) goTo(c.dataset.path);
    });

    sideEl.addEventListener('click', (e) => {
      const it = e.target.closest('.ui-side-item');
      if (it && it.dataset.path !== st.cwd) goTo(it.dataset.path);
    });

    mainEl.addEventListener('click', (e) => {
      if (e.target.closest('.fnd-ren')) return;
      const item = e.target.closest('.fnd-item');
      if (!item) { st.sel.clear(); applySel(); updateStatus(); return; }
      const p = item.dataset.path;
      if (e.ctrlKey || e.metaKey) {
        if (st.sel.has(p)) st.sel.delete(p); else st.sel.add(p);
      } else {
        st.sel.clear();
        st.sel.add(p);
      }
      applySel();
      updateStatus();
    });

    mainEl.addEventListener('dblclick', (e) => {
      if (e.target.closest('.fnd-ren')) return;
      const item = e.target.closest('.fnd-item');
      if (!item) return;
      const it = st.shown.find(i => i.path === item.dataset.path);
      if (it) openItem(it);
    });

    mainEl.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (e.target.closest('.fnd-ren')) return;
      const item = e.target.closest('.fnd-item');
      if (item) {
        const p = item.dataset.path;
        if (!st.sel.has(p)) { st.sel.clear(); st.sel.add(p); applySel(); updateStatus(); }
        itemMenu(e);
      } else {
        emptyMenu(e);
      }
    });

    mainEl.addEventListener('keydown', (e) => {
      if (st.renaming) return;
      const k = e.key.toLowerCase();
      if (e.ctrlKey || e.metaKey) {
        if (k === 'c') { e.preventDefault(); copySelection('copy'); }
        else if (k === 'x') { e.preventDefault(); if (!inTrash()) copySelection('cut'); }
        else if (k === 'v') { e.preventDefault(); pasteHere(); }
        else if (k === 'a') {
          e.preventDefault();
          st.sel = new Set(st.shown.map(i => i.path));
          applySel();
          updateStatus();
        }
      } else if (e.key === 'F2') {
        e.preventDefault();
        if (st.sel.size === 1) startRename(firstSel());
      } else if (e.key === 'Delete') {
        e.preventDefault();
        if (!st.sel.size) return;
        if (inTrash()) deleteForever(); else trashSelection();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (st.sel.size) openSelection();
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        if (st.cwd !== '/') goTo(vfs.parentOf(st.cwd));
      }
    });

    /* ---------- vfs:change с debounce ---------- */
    const onVfsChange = OS.debounce(() => {
      if (st.renaming) return;
      if (!vfs.exists(st.cwd)) { goTo('/'); return; }
      refresh();
    }, 120);
    const unVfs = OS.on('vfs:change', onVfsChange);
    win.on('close', () => unVfs());

    /* API для menus(win) */
    st.api = { newFolder, newDoc, setView };

    /* старт */
    goTo(st.cwd, true);
    setTimeout(() => mainEl.focus(), 0);
  }

  /* ---------- регистрация ---------- */
  OS.registerApp({
    id: 'finder',
    name: 'Файлы',
    icon: ICON,
    width: 900, height: 560,
    minWidth: 560, minHeight: 360,
    singleton: false,
    render,
    menus(win) {
      const st = win._fnd || {};
      const api = st.api || {};
      return [
        {
          title: 'Файл',
          items: [
            { label: 'Новая папка', hotkey: 'Ctrl+Shift+N', action: () => api.newFolder && api.newFolder() },
            { label: 'Новый документ', action: () => api.newDoc && api.newDoc() },
            { sep: true },
            { label: 'Новое окно', hotkey: 'Ctrl+N', action: () => OS.launch('finder', { path: st.cwd || '/Documents' }) },
            { sep: true },
            { label: 'Закрыть', hotkey: 'Ctrl+W', action: () => win.close() },
          ],
        },
        {
          title: 'Вид',
          items: [
            { label: 'Сетка', checked: st.view === 'grid', action: () => api.setView && api.setView('grid') },
            { label: 'Список', checked: st.view === 'list', action: () => api.setView && api.setView('list') },
          ],
        },
      ];
    },
  });
})();

</script>
  <script>
/* === js/apps/textedit.js === */
/* «Заметки» — текстовый редактор Hiko OS */
(function () {
  'use strict';

  /* ---------- иконка приложения: карандаш и линии текста ---------- */
  const GLYPH = `
    <g stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M -34 -24 L 6 -24"/>
      <path d="M -34 -8 L -2 -8"/>
      <path d="M -34 8 L -10 8"/>
      <path d="M -34 24 L -16 24"/>
    </g>
    <g transform="translate(15 2) rotate(45)">
      <rect x="-8" y="-33" width="16" height="8" rx="3.5" fill="#fff"/>
      <rect x="-8" y="-21.5" width="16" height="36" rx="3" fill="#fff"/>
      <path d="M -8 17 L 0 30 L 8 17 Z" fill="#fff"/>
    </g>`;
  const ICON = OS.appTile({ from: '#FFD75E', to: '#FF9F0A' }, GLYPH);

  /* ---------- маленькие глифы тулбара (currentColor) ---------- */
  const I = {
    newDoc: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="M18.4 3.6a2 2 0 0 1 2.8 2.8L13 14.6l-4 1 1-4z"/></svg>`,
    open: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
    save: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10"/><path d="M8 9.5l4 4 4-4"/><path d="M4 16.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5"/></svg>`,
    saveAs: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9"/><path d="M6 8.5l4 4 4-4"/><path d="M4 16.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5"/><path d="M19 3v6M16 6h6"/></svg>`,
    close: `<svg viewBox="0 0 100 100"><path d="M 28 28 L 72 72 M 72 28 L 28 72" stroke="currentColor" stroke-width="11" stroke-linecap="round" fill="none"/></svg>`,
  };

  const TEXT_EXTS = ['txt', 'md', 'json', 'js', 'css', 'html', 'csv', 'log', 'xml', 'sh'];
  const MONO_EXTS = ['json', 'js', 'css', 'html', 'csv', 'log', 'xml', 'sh'];
  const extOf = (p) => (p ? (OS.vfs.nameOf(p).split('.').pop() || '').toLowerCase() : '');

  function plural(n, one, few, many) {
    const m = Math.abs(n) % 100, d = m % 10;
    if (m > 10 && m < 20) return many;
    if (d === 1) return one;
    if (d >= 2 && d <= 4) return few;
    return many;
  }

  /* ---------- мини-рендерер Markdown (экранирование ДО разметки) ---------- */
  function mdToHtml(src) {
    const stash = [];
    const inline = (s) => {
      s = OS.esc(s);
      s = s.replace(/`([^`]+)`/g, (m, c) => {
        stash.push('<code>' + c + '</code>');
        return '\u0000' + (stash.length - 1) + '\u0000';
      });
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<span class="te-md-link">$1</span>');
      s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => stash[+i]);
      return s;
    };
    const out = [];
    let para = [], list = null, quote = [], code = null;
    const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
    const flushList = () => { if (list) { out.push('<ul>' + list.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul>'); list = null; } };
    const flushQuote = () => { if (quote.length) { out.push('<blockquote>' + quote.map(inline).join('<br>') + '</blockquote>'); quote = []; } };
    const flushAll = () => { flushPara(); flushList(); flushQuote(); };

    for (const line of String(src).split('\n')) {
      if (code !== null) {
        if (/^```/.test(line.trim())) { out.push('<pre>' + OS.esc(code.join('\n')) + '</pre>'); code = null; }
        else code.push(line);
        continue;
      }
      if (/^```/.test(line.trim())) { flushAll(); code = []; continue; }
      let m;
      if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
        flushAll();
        const lvl = Math.min(m[1].length, 6);
        out.push('<h' + lvl + '>' + inline(m[2]) + '</h' + lvl + '>');
      } else if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
        flushAll();
        out.push('<hr>');
      } else if ((m = line.match(/^>\s?(.*)$/))) {
        flushPara(); flushList();
        quote.push(m[1]);
      } else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
        flushPara(); flushQuote();
        (list = list || []).push(m[1]);
      } else if (/^\s*$/.test(line)) {
        flushAll();
      } else {
        flushList(); flushQuote();
        para.push(line);
      }
    }
    if (code !== null) out.push('<pre>' + OS.esc(code.join('\n')) + '</pre>');
    flushAll();
    return out.join('\n') || '<p class="te-md-hint">Пусто. Начните писать в режиме «Правка».</p>';
  }

              <div class="te-p-path"></div>
            </div>

          overlay.querySelectorAll('.seg-btn[data-root]').forEach((b) => {
            const r = b.dataset.root;
            b.classList.toggle('on', dir === r || dir.indexOf(r + '/') === 0);

            if (it.type === 'dir') return true;
            const ext = (it.name.split('.').pop() || '').toLowerCase();
            return it.name.indexOf('.') === -1 || TEXT_EXTS.includes(ext);
          });
          if (!items.length) {
            listEl.innerHTML = `<div class="ui-empty">${OS.icons.fileText}<div>Здесь нет текстовых файлов</div></div>`;
            return;
          }
          listEl.innerHTML = items.map((it) => `
            <div class="ui-list-row" data-path="${OS.esc(it.path)}" data-type="${it.type}">
              ${OS.fileIcon(it)}
              <span class="te-row-name">${OS.esc(it.name)}</span>
              <span class="te-row-meta">${it.type === 'dir' ? '›' : OS.fmtBytes(it.size || 0)}</span>
            </div>`).join('');

            row.addEventListener('click', () => {
              if (row.dataset.type === 'dir') { dir = row.dataset.path; renderList(); }

          });

        backBtn.addEventListener('click', () => { if (dir !== '/') { dir = OS.vfs.parentOf(dir); renderList(); } });
        overlay.querySelector('.te-x').addEventListener('click', closeModal);

        overlay.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeModal(); } });
        overlay.querySelectorAll('.seg-btn[data-root]').forEach((b) => {
          b.addEventListener('click', () => { dir = b.dataset.root; renderList(); });

        renderList();
        root.appendChild(overlay);
        overlay.focus();

      ta.addEventListener('input', () => {
        if (!dirty) { dirty = true; win.setTitle(docName() + ' *'); }
        debouncedCount();
      });
      const debouncedCount = OS.debounce(() => updateCount(), 150);

      ta.addEventListener('keydown', (e) => {
        if (e.key === 'Tab' && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey) {
          e.preventDefault();
          let ok = false;
          try { ok = document.execCommand('insertText', false, '  '); } catch (err) { ok = false; }
          if (!ok) {
            ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end');
            if (!dirty) { dirty = true; win.setTitle(docName() + ' *'); }
            debouncedCount();
          }
        }
      });

      root.addEventListener('keydown', (e) => {
        if (!(e.ctrlKey || e.metaKey)) return;
        const k = e.key.toLowerCase();
        if (k === 's') {
          e.preventDefault(); e.stopPropagation();
          if (e.shiftKey) saveAs(); else save();
        } else if (k === 'o' && !e.shiftKey) {
          e.preventDefault(); e.stopPropagation();
          openDialog();
        } else if (k === 'n' && !e.shiftKey && !e.altKey) {
          e.preventDefault(); e.stopPropagation();
          newDoc();
        }
      });

      seg.querySelectorAll('.seg-btn').forEach((b) => {
        b.addEventListener('click', () => setMode(b.dataset.mode));
      });
      root.querySelector('.te-b-new').addEventListener('click', newDoc);
      root.querySelector('.te-b-open').addEventListener('click', openDialog);
      root.querySelector('.te-b-save').addEventListener('click', () => { save(); });
      root.querySelector('.te-b-saveas').addEventListener('click', () => { saveAs(); });

      win.on('beforeclose', async () => {
        if (!dirty) return true;
        win.focus();
        return await ensureSaved(); // false при «Отмена» — окно остаётся
      });

      /* API для menus(win) */
      win._te = { newDoc, openDialog, save, saveAs };

      /* --- старт: аргументы запуска --- */
      if (ctx && ctx.args && ctx.args.path) loadPath(ctx.args.path);
      else { refreshUI(); ta.focus(); }
    },

    menus(win) {
      const api = () => win._te || {};
      return [{
        title: 'Файл',
        items: [
          { label: 'Создать', hotkey: 'Ctrl+N', action: () => api().newDoc && api().newDoc() },
          { label: 'Открыть…', hotkey: 'Ctrl+O', action: () => api().openDialog && api().openDialog() },

          { label: 'Сохранить как…', hotkey: 'Ctrl+Shift+S', action: () => api().saveAs && api().saveAs() },
          { sep: true },
          { label: 'Закрыть', hotkey: 'Ctrl+W', action: () => win.close() },
        ],
      }];
    },
  });
})();

          } else {
            echoLine(args.join(' '));
          }
        },
        open(args) {
          if (!args[0]) throw new Error('open: укажи путь или приложение');
          if (OS.getApp(args[0])) { OS.launch(args[0]); return; }
          const p = resolve(args[0]);
          if (!OS.vfs.exists(p)) throw new Error('не найдено: ' + args[0]);
          OS.openFile(p);
        },
        apps() {
          print(OS.allApps().map(a => `<span class="t-accent">${esc(a.id.padEnd(14))}</span>${esc(a.name)}`).join('\n'));
        },
        install(args) {
          if (!args[0]) { OS.launch('installer'); return; }
          if (/^https?:/.test(args[0])) { OS.installer.installFromUrl(args[0]); return; }
          const p = resolve(args[0]);
          if (!OS.vfs.exists(p)) throw new Error('не найдено: ' + args[0]);
          OS.installer.installCode(OS.vfs.read(p), OS.vfs.nameOf(p));
        },
        theme(args) {
          if (args[0] !== 'dark' && args[0] !== 'light') throw new Error('theme: dark или light');
          OS.settings.set('theme', args[0]);
          echoLine('тема: ' + (args[0] === 'dark' ? 'тёмная' : 'светлая'));
        },
        history() { history.forEach((h, i) => echoLine(`${String(i + 1).padStart(4)}  ${h}`)); },
        date() { echoLine(new Date().toLocaleString('ru-RU')); },
        whoami() { echoLine(OS.settings.get('userName')); },
        clear() { root.querySelectorAll('.t-line').forEach(n => { if (n !== inputRow) n.remove(); }); },
        neofetch() {
          const up = Math.floor(performance.now() / 1000);
          const uptime = `${Math.floor(up / 3600)} ч ${Math.floor(up / 60) % 60} мин`;
          const art = [
            '    ╱╲╱╲    ',
            '   ╱      ╲   ',
            '  │  ├──┤  │  ',
            '  │  │  │  │  ',
            '   ╲      ╱   ',
            '    ╲╱╲╱    ',
          ];
          const info = [
            ['', `<span class="t-prompt">${esc(OS.settings.get('userName'))}@hiko</span>`],
            ['', '─────────────'],
            ['OS', `Hiko OS ${OS.VERSION} «${OS.CODENAME}»`],
            ['Ядро', 'browser-js 1.0'],
            ['Аптайм', uptime],
            ['Приложений', String(OS.allApps().length)],
            ['Оболочка', 'hsh 1.0'],
            ['Тема', document.documentElement.getAttribute('data-theme') === 'dark' ? 'тёмная' : 'светлая'],
            ['Акцент', OS.settings.get('accent')],
            ['Память', OS.fmtBytes(OS.vfs.usage()) + ' / ~5 МБ'],
          ];
          const lines = [];
          for (let i = 0; i < Math.max(art.length, info.length); i++) {
            const a = `<span class="t-accent">${esc((art[i] || '').padEnd(14))}</span>`;
            const inf = info[i] ? (info[i][0] ? `<span class="t-prompt">${esc(info[i][0])}</span><span class="t-dim">: </span>${info[i][1]}` : info[i][1]) : '';
            lines.push(a + ' ' + inf);
          }
          const sw = ['#ff453a', '#ff9f0a', '#ffd60a', '#30d158', '#0a84ff', '#bf5af2', '#ff375f', '#e8e8ec']
            .map(c => `<span style="background:${c};color:${c}">██</span>`).join('');
          print(lines.join('\n') + '\n\n' + ' '.repeat(15) + sw);
        },
      };

      function run(raw) {
        const trimmed = raw.trim();
        print(`<span class="t-prompt">user@hiko</span> <span class="t-dir">${esc(shortPath(cwd))}</span> % ${esc(raw)}`);
        if (!trimmed) return;
        history.push(trimmed);
        const args = tokenize(trimmed);
        const cmd = args.shift();
        const fn = COMMANDS[cmd];
        if (!fn) { print(`<span class="t-err">команда не найдена: ${esc(cmd)}</span> <span class="t-dim">— набери help</span>`); return; }
        try { fn(args, trimmed); }
        catch (e) { print(`<span class="t-err">${esc(e.message)}</span>`); }
      }

      function complete() {
        const val = input.value;
        const m = val.match(/(\S*)$/);
        const frag = m ? m[1] : '';
        const slash = frag.lastIndexOf('/');
        const dirPart = slash >= 0 ? frag.slice(0, slash + 1) : '';
        const namePart = slash >= 0 ? frag.slice(slash + 1) : frag;
        let items;
        try { items = OS.vfs.list(resolve(dirPart || '.')); } catch (e) { return; }
        const matches = items.filter(i => i.name.toLowerCase().startsWith(namePart.toLowerCase()));
        if (matches.length === 1) {
          const add = matches[0].name.slice(namePart.length) + (matches[0].type === 'dir' ? '/' : '');
          input.value = val + add;
        } else if (matches.length > 1) {
          print(matches.map(i => i.type === 'dir' ? `<span class="t-dir">${esc(i.name)}/</span>` : esc(i.name)).join('  '));
        }
        renderInputRow();
        scroll();
      }

      input.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') {
          const v = input.value;
          input.value = '';
          histIdx = -1;
          run(v);
          renderInputRow();
          scroll();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (!history.length) return;
          if (histIdx === -1) { histDraft = input.value; histIdx = history.length - 1; }
          else if (histIdx > 0) histIdx--;
          input.value = history[histIdx];
          renderInputRow();
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (histIdx === -1) return;
          histIdx++;
          if (histIdx >= history.length) { histIdx = -1; input.value = histDraft; }
          else input.value = history[histIdx];
          renderInputRow();
        } else if (e.key === 'Tab') {
          e.preventDefault();
          complete();
        } else if (e.key === 'c' && e.ctrlKey) {
          print(`<span class="t-prompt">user@hiko</span> <span class="t-dir">${esc(shortPath(cwd))}</span> % ${esc(input.value)}^C`);
          input.value = '';
          renderInputRow();
          scroll();
        }
      });
      input.addEventListener('input', () => { renderInputRow(); scroll(); });

      const focusInput = () => setTimeout(() => input.focus(), 0);
      win.content.addEventListener('pointerup', () => {
        if (!window.getSelection().toString()) focusInput();
      });
      win.on('focus', focusInput);
      focusInput();
    },
  });
})();
